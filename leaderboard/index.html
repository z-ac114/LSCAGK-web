  <style>
    .leaderboard-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .leaderboard-card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 0.375rem;
      padding: 2rem;
      margin-top: 1.5rem;
    }
    .leaderboard-title {
      text-align: center;
      font-family: "Noto Serif TC", serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 0.5rem;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .leaderboard-item {
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 15rem) 9rem 4.5rem 6.5rem;
      justify-content: space-between;
      gap: 0.9rem;
      align-items: center;
      padding: 0.9rem 1rem;
      border-radius: 0.25rem;
      background: var(--surface);
      border: 1px solid var(--hairline);
      transition: border-color 0.2s ease;
      animation: lb-row-in 320ms cubic-bezier(0.22, 0.61, 0.36, 1) both;
      animation-delay: calc(var(--row-i, 0) * 45ms);
    }
    @keyframes lb-row-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .leaderboard-card {
      animation: lb-card-in 340ms ease both;
    }
    @keyframes lb-card-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .leaderboard-item, .leaderboard-card { animation: none; }
    }
    .leaderboard-item:hover { border-color: var(--hairline-strong); }
    .leaderboard-head {
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 15rem) 9rem 4.5rem 6.5rem;
      justify-content: space-between;
      gap: 0.9rem;
      align-items: center;
      padding: 0 1rem 0.6rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
    }
    .leaderboard-head span:nth-child(n + 3) { text-align: right; }
    .leaderboard-head.head-infinite span:nth-child(3) { text-align: left; }
    /* infinite list: 7 columns with the category column */
    .leaderboard-item.item-infinite,
    .leaderboard-head.head-infinite {
      grid-template-columns: 2.2rem minmax(0, 13rem) minmax(0, 6rem) 4.5rem 5rem 6.5rem;
    }
    .leaderboard-cat {
      font-size: 1.05rem;
      color: var(--ink);
      letter-spacing: 0.08em;
      white-space: nowrap;
      position: relative;
      cursor: help;
    }
    .leaderboard-cat:hover::after {
      content: attr(data-full);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0;
      background: #26251e;
      color: #faf9f5;
      padding: 4px 10px;
      border-radius: 0.25rem;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      z-index: 60;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .leaderboard-rank {
      font-weight: 700;
      font-size: 1.02rem;
      color: #4a4f58;
      font-variant-numeric: tabular-nums;
    }
    .lb-star {
      color: var(--school-gold);
      margin-left: 6px;
      font-size: 0.8rem;
      cursor: help;
    }
    .dark-mode .lb-star { color: #e2bb62; }
    .leaderboard-name {
      font-weight: 500;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .leaderboard-score {
      font-weight: 700;
      color: var(--red);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .leaderboard-meta {
      font-size: 0.88rem;
      color: #4a4f58;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .leaderboard-item.top {
      background: #e0524a;
      border-color: #c74340;
    }
    .leaderboard-item.top .leaderboard-rank,
    .leaderboard-item.top .leaderboard-name,
    .leaderboard-item.top .leaderboard-score { color: #ffffff; }
    .leaderboard-item.top .leaderboard-meta { color: rgb(255 255 255 / 92%); }
    /* 載入中骨架（skeleton） */
    .lb-skeleton-row {
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 15rem) 9rem 4.5rem 6.5rem;
      gap: 0.9rem;
      align-items: center;
      padding: 0.9rem 1rem;
      border: 1px solid var(--hairline);
      border-radius: 0.25rem;
      background: var(--surface);
      margin-bottom: 0.75rem;
    }
    .lb-skeleton-row.item-infinite {
      grid-template-columns: 2.2rem minmax(0, 13rem) minmax(0, 6rem) 4.5rem 5rem 6.5rem;
    }
    .lb-skel {
      display: block;
      height: 0.8rem;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--hairline-soft) 30%, var(--hairline) 50%, var(--hairline-soft) 70%);
      background-size: 240% 100%;
      animation: lb-shimmer 1.25s ease-in-out infinite;
    }
    .lb-skel.rank { width: 1.35rem; height: 1.05rem; }
    .lb-skel.w40 { width: 40%; }
    .lb-skel.w60 { width: 60%; }
    .lb-skel.w85 { width: 85%; }
    @keyframes lb-shimmer {
      from { background-position: 130% 0; }
      to { background-position: -130% 0; }
    }
    .lb-loading-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.8rem 0 0;
    }
    .lb-dots span {
      display: inline-block;
      animation: lb-dot 1.2s ease-in-out infinite;
    }
    .lb-dots span:nth-child(2) { animation-delay: 0.18s; }
    .lb-dots span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes lb-dot {
      0%, 60%, 100% { opacity: 0.25; }
      30% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lb-skel, .lb-dots span { animation: none; }
    }

    .lb-footnote {
      margin-top: 0.9rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .lb-footnote .lb-star { margin-right: 5px; }

    .leaderboard-empty {
      text-align: center;
      padding: 2rem 0;
      color: var(--muted);
    }

    .leaderboard-list.hidden,
    .shared-questions.hidden {
      display: none;
    }
    .board-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--hairline);
      margin-top: 0.75rem;
    }
    .page-btn {
      display: inline-flex;
      align-items: center;
      min-height: 2.2rem;
      padding: 0 1.1rem;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--hairline);
      border-radius: 0.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .page-btn:hover:not(:disabled) { border-color: var(--red); }
    .page-btn:disabled { color: #c3c3c3; cursor: not-allowed; }
    .page-indicator {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* ---- Board toggle bar ---- */
    .lb-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px 16px;
      margin-top: 1.5rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 1.25rem;
    }
    .lb-tabs { display: flex; gap: 2px; }
    .bank-filter { display: flex; align-items: center; gap: 2px; }
    .bank-label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-right: 6px;
    }
    .lb-tab, .bank-opt {
      appearance: none;
      background: transparent;
      border: 0;
      cursor: pointer;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--body-text);
      padding: 9px 13px;
      border-radius: 8px;
      position: relative;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: color 140ms ease, background-color 140ms ease;
    }
    .lb-tab:hover, .bank-opt:hover { color: var(--ink); background: var(--hairline-soft); }
    .lb-tab.active, .bank-opt.active { color: var(--red); font-weight: 600; }
    .lb-tab.active::after, .bank-opt.active::after {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      bottom: 3px;
      height: 2px;
      background: var(--red);
      border-radius: 1px;
    }
    .dark-mode .leaderboard-meta,
    .dark-mode .leaderboard-rank,
    .dark-mode .leaderboard-cat {
      color: #c5cad4;
    }
    .dark-mode .page-btn:disabled { color: #6a7180; }
    .shared-entry {
      margin-bottom: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--purple);
      border-radius: 0.375rem;
      padding: 1.5rem;
      text-align: center;
    }
    .shared-entry .shared-name {
      font-family: "Noto Serif TC", serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
    }
    .shared-entry .shared-score {
      margin-top: 0.35rem;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--purple);
      font-variant-numeric: tabular-nums;
    }
    .shared-entry .shared-meta {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .shared-entry .shared-rank {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.35rem 1rem;
      background: var(--purple);
      color: var(--cream);
      border-radius: 0.25rem;
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* ---- Dark mode readability fixes ---- */
    .dark-mode .leaderboard-title {
      color: #eef0f4;
    }
    .dark-mode .leaderboard-score {
      color: #f28779;
    }
    .dark-mode .leaderboard-item.top {
      background: #e0524a;
      border-color: #c74340;
    }
    .dark-mode .shared-entry {
      border-color: #a87fd6;
    }
    .dark-mode .shared-entry .shared-score {
      color: #e7c9ee;
    }
    .dark-mode .shared-entry .shared-rank {
      background: #63359b;
    }

    /* ---- Shared entry: per-question review ---- */
    .shared-questions {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .sq-summary {
      font-size: 0.95rem;

      padding: 0.25rem 0;
    }
    .sq-ok { color: #2e7d32; font-weight: 700; }
    .sq-wrong { color: var(--red); font-weight: 700; }
    .sq-un { color: var(--muted); font-weight: 700; }
    .sq-item {
      display: flex;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 0.25rem;
    }
    .sq-item.ok { border-left: 3px solid #2e7d32; }
    .sq-item.wrong { border-left: 3px solid var(--red); }
    .sq-item.un { border-left: 3px solid var(--hairline); }
    .sq-item.un .sq-badge { background: var(--hairline); color: var(--muted); }
    .sq-item.un .sq-ans span:first-child { color: var(--muted); }

    /* ---- Shared entry: filter toggle ---- */
    .shared-filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--hairline);
      margin-bottom: 0.9rem;
    }
    .review-filter {
      display: inline-flex;
      align-items: center;
      min-height: 2.1rem;
      padding: 0 1rem;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--hairline);
      border-radius: 0.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
      font-variant-numeric: tabular-nums;
    }
    .review-filter:hover { border-color: var(--purple); }
    .review-filter.active {
      background: #e0524a;
      border-color: #c74340;
      color: #ffffff;
    }
    .sq-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 30rem;
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .review-empty {
      text-align: center;
      padding: 2rem 0;
      color: var(--muted);
    }

    /* dark mode filters */
    .dark-mode .review-filter {
      background: #2b303b;
    }
    .dark-mode .review-filter.active {
      background: #e0524a;
      border-color: #c74340;
    }
    .sq-badge {
      flex: none;
      width: 1.5rem;
      height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .sq-item.ok .sq-badge { background: #2e7d32; }
    .sq-item.wrong .sq-badge { background: var(--red); }
    .sq-body { flex: 1; min-width: 0; }
    .sq-q {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .sq-ans {
      margin: 0.4rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .sq-item.wrong .sq-ans span:first-child { color: var(--red); }

    /* dark mode */
    .dark-mode .sq-item {
      background: #2b303b;
      border-color: #454b59;
    }
    .dark-mode .sq-ok { color: #7dc98a; }
    /* lighter red for small red text on dark backgrounds (contrast) */
    .dark-mode .sq-wrong,
    .dark-mode .sq-item.wrong .sq-ans span:first-child,
    .dark-mode .rv-wrong,
    .dark-mode .ls-kicker-red {
      color: #f28779;
    }
    .dark-mode .leaderboard-item.top {
      background: #e0524a;
      border-color: #c74340;
    }
  </style>

  <body>
    <div class="flex min-h-screen flex-col bg-cream text-ink">
      <header class="site-header"><div class="site-header-inner"><a class="brand" href="/"><img class="brand-icon" src="/assets/agk-icon.png" width="30" height="30" alt="LSCAGKT 校徽標誌" /><span class="brand-name">LSC<span class="accent">AGKT</span></span><span class="brand-zh">喇沙書院學術時事及常識問答隊</span></a><nav class="site-nav" id="siteNav"><a href="/">首頁</a><a href="/training">資源庫</a><a href="/competition/">競賽模擬</a><a href="/leaderboard/" aria-current="page">排行榜</a></nav><button type="button" class="nav-toggle" aria-expanded="false" aria-label="開啟選單"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg></button></div></header>
      <main class="flex-1">
        <div class="leaderboard-container">
          <h1 class="leaderboard-title">排行榜</h1>

          <div class="shared-entry hidden" id="sharedEntry"></div>

          <div class="shared-questions hidden" id="sharedQuestions"></div>

          <div class="lb-toolbar">
            <div class="lb-tabs" id="lbTabs" role="tablist">
              <button type="button" class="lb-tab active" data-board="listInfinite">無限模式</button>
              <button type="button" class="lb-tab" data-board="listSprint">3分鐘挑戰</button>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://oajvxavzsomymqunpgxx.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_L8QCQotDAIP-Fzm8r5IIWQ_U17i-eFy";
      let supabaseClient = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === "function") {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
          console.warn("Supabase SDK 未載入，排行榜暫不可用。");
        }
      } catch (e) {
        console.warn("Supabase 初始化失敗，排行榜暫不可用。", e);
      }

      /* 題庫年代：依成績建立時間顯示所用的題庫。
         換題庫時在最上面加一項 { until: "YYYY-MM-DDTHH:mm:ss+08:00", short, full }，
         未列 until 的一項 = 現行題庫。 */
      const BANK_ERAS = [
        { until: "2026-11-07T13:00:00+08:00", short: "紫荊", full: "第九屆紫荊杯題庫" },
        { short: "國安", full: "國家安全挑戰賽題庫" }
      ];

      function bankOf(row) {
        const t = row.created_at ? new Date(row.created_at).getTime() : 0;
        for (var i = 0; i < BANK_ERAS.length; i++) {
          var era = BANK_ERAS[i];
          if (!era.until || t < new Date(era.until).getTime()) return era;
        }
        return BANK_ERAS[BANK_ERAS.length - 1];
      }

      let currentBank = "all";
      let currentBoard = "listInfinite";

      const PAGE_SIZE = 10;
      const boardPages = {};

      function renderPage(listId, opts) {
        const state = boardPages[listId];
        const list = document.getElementById(listId);
        const allRows = state && state.rows ? state.rows : [];
        const rows = currentBank === "all" ? allRows : allRows.filter((r) => bankOf(r).short === currentBank);
        if (rows.length === 0) {
          list.innerHTML =
            allRows.length > 0
              ? '<div class="leaderboard-empty">此題庫暫無成績記錄</div>'
              : '<div class="leaderboard-empty">暫無成績記錄</div>';
          return;
        }
        const infinite = opts && opts.infinite;
        const maxPage = Math.max(Math.ceil(rows.length / PAGE_SIZE) - 1, 0);
        const page = Math.min(state.page || 0, maxPage);
        state.page = page;
        const start = page * PAGE_SIZE;
        const slice = rows.slice(start, start + PAGE_SIZE);
        const head = infinite ? `
          <div class="leaderboard-head head-infinite">
            <span>排名</span><span>姓名</span><span>題庫</span><span>準確率</span><span>用時</span><span>日期</span>
          </div>
        ` : `
          <div class="leaderboard-head">
            <span>排名</span><span>姓名</span><span>得分</span><span>準確率</span><span>日期</span>
          </div>
        `;
        const pad2 = (n) => String(n).padStart(2, "0");
        const fmtDur = (s) => `${Math.floor(s / 60)}:${pad2(s % 60)}`;
        const body = slice.map((r, i) => {
          const rank = start + i + 1; // global rank across pages
          const scoreText = `${r.score} 分`;
          const accText = r.accuracy != null ? `${Math.round(r.accuracy * 100)}%` : "";
          const timeText = r.time_taken != null ? fmtDur(r.time_taken) : "—";
          const d = r.created_at ? new Date(r.created_at) : null;
          const dateText = d
            ? `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${String(d.getFullYear()).slice(2)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`
            : "";
          const isTop = rank <= 3;
          const bank = infinite ? bankOf(r) : null;
          const cat = bank ? `<span class="leaderboard-cat" data-full="${esc(bank.full)}" title="${esc(bank.full)}">${esc(bank.short)}</span>` : "";
          return `
            <div class="leaderboard-item ${infinite ? 'item-infinite' : ''} ${isTop ? 'top' : ''}" style="--row-i:${i}">
              <span class="leaderboard-rank">${rank}</span>
              <span class="leaderboard-name">${esc(r.name)}${r.exam_style ? '<span class="lb-star" title="考試模式（小型選項）">★</span>' : ""}</span>
              ${cat}
              ${infinite ? "" : `<span class="leaderboard-score">${scoreText}</span>`}
              <span class="leaderboard-meta">${accText}</span>
              ${infinite ? `<span class="leaderboard-meta">${timeText}</span>` : ""}
              <span class="leaderboard-meta">${dateText}</span>
            </div>
          `;
        }).join("");
        const controls = maxPage > 1 ? `
          <div class="board-pagination">
            <button type="button" class="page-btn" data-board="${listId}" data-dir="-1" ${page === 0 ? "disabled" : ""}>上一頁</button>
            <span class="page-indicator">${page + 1} / ${maxPage}</span>
            <button type="button" class="page-btn" data-board="${listId}" data-dir="1" ${page >= maxPage - 1 ? "disabled" : ""}>下一頁</button>
          </div>` : "";
        list.innerHTML = head + body + controls;
      }

      // infinite mode: all question-bank runs in one list, with the category column
      async function renderInfinite(listId) {
        if (!supabaseClient) {
          document.getElementById(listId).innerHTML = '<div class="leaderboard-empty">排行榜暫不可用（Supabase 未載入），請重新整理。</div>';
          return;
        }
        const { data, error } = await supabaseClient.from("leaderboard")
          .select("*")
          .order('score', { ascending: false })
          .order('accuracy', { ascending: false })
          .limit(500);
        if (error) {
          document.getElementById(listId).innerHTML = '<div class="leaderboard-empty">暫無成績記錄</div>';
          return;
        }
        const rows = (data || []).filter((r) => r.mode !== "sprint");
        boardPages[listId] = { rows, page: 0 };
        renderPage(listId, { infinite: true });
      }

      // sprint mode (3 min): its own leaderboard
      async function renderSprint(listId) {
        if (!supabaseClient) {
          document.getElementById(listId).innerHTML = '<div class="leaderboard-empty">排行榜暫不可用（Supabase 未載入），請重新整理。</div>';
          return;
        }
        const { data, error } = await supabaseClient.from("leaderboard")
          .select("*")
          .eq("mode", "sprint")
          .order('score', { ascending: false })
          .order('accuracy', { ascending: false })
          .limit(100);
        if (error) {
          document.getElementById(listId).innerHTML = '<div class="leaderboard-empty">暫無成績記錄</div>';
          return;
        }
        boardPages[listId] = { rows: data, page: 0 };
        renderPage(listId);
      }

      function modeLabel(mode) {
        const names = { normal: "第八屆紫荊杯", spring: "春季題庫", zijing9: "第九屆紫荊杯", national: "國情知識問答比賽", longtrek: "長征閱讀材料" };
        if (mode === "both") return "第八屆紫荊杯＋春季題庫";
        if (mode === "sprint") return "3分鐘挑戰";
        return (mode || "").split("+").map((m) => names[m] || m).join("＋");
      }

      // compact bank icons for the category column (hover shows the full name)
      const BANK_ICONS = { normal: "⑧", spring: "❀", zijing9: "⑨", national: "⚲", longtrek: "⚑" };
      function modeIcon(mode) {
        if (mode === "both") return "⑧❀";
        if (mode === "sprint") return "⏱";
        return (mode || "").split("+").map((m) => BANK_ICONS[m] || m).join("");
      }

      async function renderSharedEntry() {
        const params = new URLSearchParams(window.location.search);
        const entryId = params.get("entry");
        if (!entryId || !supabaseClient) return;

        const { data, error } = await supabaseClient
          .from("leaderboard")
          .select("*")
          .eq("id", entryId)
          .maybeSingle();
        if (error || !data) return;

        // rank = (number of entries in the same mode with a higher score) + 1
        let rank = null;
        try {
          const { count, error: countError } = await supabaseClient
            .from("leaderboard")
            .select("*", { count: "exact", head: true })
            .eq("mode", data.mode)
            .gt("score", data.score);
          if (!countError && typeof count === "number") rank = count + 1;
        } catch (e) { /* rank is optional */ }

        const isSprint = data.mode === "sprint";
        const scoreText = isSprint ? `${data.score} 分` : `${data.score} / ${data.total}`;
        const pad2 = (n) => String(n).padStart(2, "0");
        const timeText = data.time_taken != null ? `${Math.floor(data.time_taken / 60)}:${pad2(data.time_taken % 60)}` : "—";
        const dd = data.created_at ? new Date(data.created_at) : null;
        const dateText = dd
          ? `${pad2(dd.getDate())}.${pad2(dd.getMonth() + 1)}.${String(dd.getFullYear()).slice(2)} ${pad2(dd.getHours())}:${pad2(dd.getMinutes())}`
          : "";
        const el = document.getElementById("sharedEntry");
        el.innerHTML = `
          <div class="shared-name">${esc(data.name)}${data.exam_style ? `<span class="lb-star" title="考試模式（小型選項）">★</span>` : ""}</div>
          <div class="shared-score">${scoreText}</div>
          <div class="shared-meta">${modeLabel(data.mode)} · ${isSprint ? `答對 ${data.total} 題` : `共答 ${data.total} 題`} · 用時 ${timeText} · ${dateText}</div>
          ${rank !== null ? `<div class="shared-rank">排名 第 ${rank} 位</div>` : ""}
        `;
        el.classList.remove("hidden");
        el.scrollIntoView({ behavior: "smooth", block: "center" });

        // per-question review (correct / wrong / unanswered) with filter toggle
        sharedDetails = Array.isArray(data.details) ? data.details : null;
        if (sharedDetails && sharedDetails.length) {
          renderSharedQuestions();
        }
      }

      let sharedDetails = null;
      let sharedFilter = "all";

      function renderSharedQuestions() {
        const qWrap = document.getElementById("sharedQuestions");
        if (!sharedDetails || !sharedDetails.length) return;

        const right = sharedDetails.filter((d) => d.ok).length;
        const wrong = sharedDetails.filter((d) => !d.ok && d.ua != null).length;
        const unanswered = sharedDetails.filter((d) => !d.ok && d.ua == null).length;

        const counts = { all: sharedDetails.length, ok: right, wrong: wrong, un: unanswered };
        const labels = { all: "全部", ok: "答對", wrong: "答錯", un: "未答" };
        let html = '<div class="shared-filters">';
        for (const key of ["all", "ok", "wrong", "un"]) {
          html += `<button type="button" class="review-filter${sharedFilter === key ? " active" : ""}" data-filter="${key}">${labels[key]} ${counts[key]}</button>`;
        }
        html += "</div>";

        const filtered = sharedFilter === "all" ? sharedDetails : sharedDetails.filter((d) => {
          if (sharedFilter === "ok") return d.ok;
          if (sharedFilter === "wrong") return !d.ok && d.ua != null;
          return !d.ok && d.ua == null;
        });

        html += '<div class="sq-list">';
        if (filtered.length === 0) {
          html += '<div class="review-empty">沒有記錄</div>';
        } else {
          html += filtered.map((d) => {
            const n = sharedDetails.indexOf(d) + 1;
            const status = d.ok ? "ok" : (d.ua != null ? "wrong" : "un");
            const badge = d.ok ? "✓" : (d.ua != null ? "✗" : "–");
            return `
              <div class="sq-item ${status}">
                <span class="sq-badge">${badge}</span>
                <div class="sq-body">
                  <p class="sq-q">${n}. ${esc(d.q)}</p>
                  <p class="sq-ans"><span>你的答案：${esc(d.ua == null ? "未作答" : d.ua)}</span><span>正確答案：${esc(d.ca)}</span></p>
                </div>
              </div>
            `;
          }).join("");
        }
        html += "</div>";

        qWrap.innerHTML = html;
        qWrap.classList.remove("hidden");
      }

      ["listInfinite", "listSprint"].forEach((id) => {
        document.getElementById(id).addEventListener("click", (e) => {
          const btn = e.target && e.target.closest ? e.target.closest(".page-btn") : null;
          if (!btn || btn.dataset.board !== id) return;
          const state = boardPages[id];
          if (!state) return;
          const maxPage = Math.ceil(state.rows.length / PAGE_SIZE) - 1;
          const next = Math.min(Math.max(state.page + Number(btn.dataset.dir), 0), maxPage);
          if (next !== state.page) {
            state.page = next;
            renderPage(id, { infinite: id === "listInfinite" });
          }
        });
      });

      document.getElementById("sharedQuestions").addEventListener("click", (e) => {
        const btn = e.target && e.target.closest ? e.target.closest(".review-filter") : null;
        if (!btn) return;
        sharedFilter = btn.dataset.filter || "all";
        renderSharedQuestions();
      });

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&" + "amp;")
          .replace(/</g, "&" + "lt;")
          .replace(/>/g, "&" + "gt;");
      }

      // tab bar: one board visible at a time, fetched lazily and cached
      const fetchedBoards = new Set();

      // 載入中骨架：以真實列佈局呈現 shimmer
      function renderSkeleton(listId, infinite) {
        const cols = infinite
          ? ["rank", "w85", "w40", "w40", "w40", "w40", "w60"]
          : ["rank", "w85", "w40", "w40", "w60"];
        const rows = Array.from({ length: 6 }, () =>
          `<div class="lb-skeleton-row${infinite ? " item-infinite" : ""}">` +
            cols.map((w) => `<span class="lb-skel ${w}"></span>`).join("") +
          "</div>"
        ).join("");
        document.getElementById(listId).innerHTML =
          rows +
          '<div class="lb-loading-note">載入成績中<span class="lb-dots"><span>.</span><span>.</span><span>.</span></span></div>';
      }

      async function activateTab(boardId) {
        currentBoard = boardId;
        document.querySelectorAll(".leaderboard-list").forEach((el) => el.classList.add("hidden"));
        const list = document.getElementById(boardId);
        if (list) list.classList.remove("hidden");
        if (fetchedBoards.has(boardId)) return;
        fetchedBoards.add(boardId);
        if (supabaseClient) renderSkeleton(boardId, boardId === "listInfinite");
        if (boardId === "listSprint") {
          await renderSprint(boardId);
        } else {
          await renderInfinite(boardId);
        }
      }

      // 題庫篩選：選項自動跟隨 BANK_ERAS
      (function buildBankFilter() {
        const wrap = document.getElementById("bankFilter");
        const shorts = [];
        BANK_ERAS.forEach((era) => {
          if (!shorts.includes(era.short)) shorts.push(era.short);
        });
        const opts = [{ id: "all", label: "全部" }].concat(
          shorts.map((s) => ({ id: s, label: s }))
        );
        wrap.innerHTML =
          '<span class="bank-label">題庫</span>' +
          opts
            .map(
              (o, i) =>
                `<button type="button" class="bank-opt${i === 0 ? " active" : ""}" data-bank="${esc(o.id)}" aria-pressed="${i === 0}">${esc(o.label)}</button>`
            )
            .join("");
      })();

      document.getElementById("bankFilter").addEventListener("click", (e) => {
        const btn = e.target && e.target.closest ? e.target.closest(".bank-opt") : null;
        if (!btn || btn.classList.contains("active")) return;
        currentBank = btn.dataset.bank || "all";
        document.querySelectorAll("#bankFilter .bank-opt").forEach((b) => {
          const active = b === btn;
          b.classList.toggle("active", active);
          b.setAttribute("aria-pressed", active ? "true" : "false");
        });
        if (boardPages[currentBoard]) {
          boardPages[currentBoard].page = 0;
          renderPage(currentBoard, { infinite: currentBoard === "listInfinite" });
        }
      });

      document.getElementById("lbTabs").addEventListener("click", (e) => {
        const tab = e.target && e.target.closest ? e.target.closest(".lb-tab") : null;
        if (!tab) return;
        document.querySelectorAll(".lb-tab").forEach((t) => t.classList.toggle("active", t === tab));
        activateTab(tab.dataset.board);
      });

      // entry-link view: show only the shared result stats, not the leaderboard boards
      (function init() {
        const isEntryView = !!new URLSearchParams(window.location.search).get("entry");
        if (isEntryView) {
          document.querySelectorAll(".lb-tabs, .leaderboard-card").forEach((el) => el.classList.add("hidden"));
          renderSharedEntry();
        } else {
          activateTab("listInfinite");
        }
      })();
    </script>
