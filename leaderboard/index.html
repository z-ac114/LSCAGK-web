<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/assets/agk-icon.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" />
    <title>領袖榜 | AGK 學術時事及常識問答隊</title>
  <style>
    /* Swiss editorial refactor */
    :root { --accent:#b64255; }
    h1 { font-weight:800; letter-spacing:-0.02em; }
    .text-sm { letter-spacing:0.04em; }
    body { background:#fff !important; color:#111 !important; }
    header.bg-purple, main > section.bg-purple, .bg-purple, .bg-cream { background:#fff !important; color:#111 !important; border-bottom:1px solid #e5e5e5; }
    header.bg-purple a, header.bg-purple .text-cream, header.bg-purple .text-cream\/90 { color:#111 !important; }
    header.bg-purple .bg-red { background:var(--accent) !important; color:#fff !important; }
    header.bg-purple nav a { border-radius:0 !important; }
    .stripes { display:none !important; }
    .leaderboard-container { max-width:72rem; margin:0 auto; padding:3rem 1.5rem; }
    .leaderboard-table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
    .leaderboard-table th, .leaderboard-table td { border-bottom:1px solid #e5e5e5; padding:0.75rem 1rem; text-align:left; }
    .leaderboard-table th { font-weight:800; letter-spacing:0.08em; text-transform:uppercase; font-size:0.75rem; color:#666; border-bottom:2px solid #111; }
    .leaderboard-table td { font-weight:500; }
    .leaderboard-table .rank { width:4rem; color:#666; }
    .leaderboard-table .score { font-weight:700; }
    .leaderboard-table .meta { color:#666; font-size:0.875rem; letter-spacing:0.04em; }
    .leaderboard-table tr.top { background:#fafafa; }
    .leaderboard-table tr:hover { background:#fafafa; }
  </style>
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-cream text-ink">
      <header class="sticky top-0 z-50 bg-purple text-cream">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
          <a class="flex min-h-11 items-center gap-2 font-serif text-lg font-semibold tracking-wide" href="/">
            <img class="brand-icon" src="/assets/agk-icon.png" width="36" height="36" alt="" aria-hidden="true" /><span>AGK <span class="hidden font-sans text-sm font-normal text-plum-soft sm:inline">學術時事及常識問答隊</span></span>
          </a>
          <nav class="hidden items-center gap-1 md:flex">
            <a href="/" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">隊伍簡介</a>
            <a href="/training" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">訓練資料</a>
            <a href="/competition" class="min-h-11 rounded-full bg-red px-3 py-2 text-sm text-cream">競賽模擬</a>
            <a href="/news" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">最新消息</a>
            <a href="/awards" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">得獎詳情</a>
            <a href="/contact" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">聯絡我們</a>
          </nav>
        </div>
      </header>
      <main class="flex-1">
        <div class="leaderboard-container">
          <h1 class="text-center font-serif text-4xl font-bold sm:text-5xl">領袖榜</h1>
          <div class="border border-[#e5e5e5]">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th class="rank">排名</th>
                  <th>姓名</th>
                  <th>得分</th>
                  <th>用時</th>
                  <th>日期</th>
                </tr>
              </thead>
              <tbody id="leaderboardList"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://oajvxavzsomymqunpgxx.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_L8QCQotDAIP-Fzm8r5IIWQ_U17i-eFy";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      async function renderLeaderboard() {
        const { data, error } = await supabase.from("leaderboard")
          .select("*")
          .order('score', { ascending: false })
          .order('time_taken', { ascending: true })
          .limit(100);
        
        const list = document.getElementById("leaderboardList");
        if (error || !data || data.length === 0) {
          list.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-muted">暫無成績記錄</td></tr>';
          return;
        }
        list.innerHTML = data.map((r, i) => {
          const scoreText = `${r.score} / ${r.total}`;
          const timeText = r.time_taken ? `${r.time_taken}s` : "—";
          const dateText = r.created_at ? new Date(r.created_at).toLocaleDateString() : "";
          const isTop = i < 3;
          return `
            <tr class="${isTop ? 'top' : ''}">
              <td class="rank">${i + 1}</td>
              <td>${r.name}</td>
              <td class="score">${scoreText}</td>
              <td class="meta">${timeText}</td>
              <td class="meta">${dateText}</td>
            </tr>
          `;
        }).join("");
      }
      renderLeaderboard();
    </script>
  </body>
</html>
