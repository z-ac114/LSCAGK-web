      <main class="flex-1">
        <div class="leaderboard-container">
          <h1 class="text-center font-serif text-4xl font-bold sm:text-5xl">領袖榜</h1>
          <div class="border border-[#e5e5e5]">
            <table class="leaderboard-table">
              <thead>
                <tr>
                  <th class="rank">排名</th>
                  <th>姓名</th>
                  <th>得分</th>
                  <th>用時</th>
                  <th>日期</th>
                </tr>
              </thead>
              <tbody id="leaderboardList"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://oajvxavzsomymqunpgxx.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_L8QCQotDAIP-Fzm8r5IIWQ_U17i-eFy";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      async function renderLeaderboard() {
        const { data, error } = await supabase.from("leaderboard")
          .select("*")
          .order('score', { ascending: false })
          .order('time_taken', { ascending: true })
          .limit(100);
        
        const list = document.getElementById("leaderboardList");
        if (error || !data || data.length === 0) {
          list.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-muted">暫無成績記錄</td></tr>';
          return;
        }
        list.innerHTML = data.map((r, i) => {
          const scoreText = `${r.score} / ${r.total}`;
          const timeText = r.time_taken ? `${r.time_taken}s` : "—";
          const dateText = r.created_at ? new Date(r.created_at).toLocaleDateString() : "";
          const isTop = i < 3;
          return `
            <tr class="${isTop ? 'top' : ''}">
              <td class="rank">${i + 1}</td>
              <td>${r.name}</td>
              <td class="score">${scoreText}</td>
              <td class="meta">${timeText}</td>
              <td class="meta">${dateText}</td>
            </tr>
          `;
        }).join("");
      }
      renderLeaderboard();
    </script>
