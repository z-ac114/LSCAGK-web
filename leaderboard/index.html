<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="../assets/agk-icon.png" />
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" />
    <title>排行榜 | AGK 學術時事及常識問答隊</title>
  <style>
    .leaderboard-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .leaderboard-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      margin-top: 1.5rem;
    }
    .leaderboard-title {
      text-align: center;
      font-family: "Noto Serif TC", serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 0.5rem;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .leaderboard-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border-radius: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: transform 0.2s ease;
    }
    .leaderboard-item:hover { transform: translateX(5px); }
    .leaderboard-rank {
      font-weight: 700;
      width: 30px;
      color: var(--muted);
    }
    .leaderboard-name {
      flex: 1;
      font-weight: 500;
      color: var(--ink);
    }
    .leaderboard-score {
      font-weight: 700;
      color: var(--purple);
      white-space: nowrap;
    }
    .leaderboard-meta {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .leaderboard-item.top {
      background: var(--purple);
      border-color: var(--purple-deep);
    }
    .leaderboard-item.top .leaderboard-rank,
    .leaderboard-item.top .leaderboard-name,
    .leaderboard-item.top .leaderboard-score { color: var(--cream); }
    .leaderboard-item.top .leaderboard-meta { color: var(--plum-soft); }
    .leaderboard-empty {
      text-align: center;
      padding: 2rem 0;
      color: var(--muted);
    }
  </style>
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-cream text-ink">
      <header class="sticky top-0 z-50 bg-purple text-cream">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
          <a class="flex min-h-11 items-center gap-2 font-serif text-lg font-semibold tracking-wide" href="/"><img class="brand-icon" src="../assets/agk-icon.png" width="36" height="36" alt="" aria-hidden="true" /><span>AGK <span class="hidden font-sans text-sm font-normal text-plum-soft sm:inline">學術時事及常識問答隊</span></span></a>
          <nav class="hidden items-center gap-1 md:flex"><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/">隊伍簡介</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/training">訓練資料</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/competition/">競賽模擬</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors bg-red text-cream active" href="/leaderboard/" data-status="active" aria-current="page">領袖榜</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/news">最新消息</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/awards">得獎詳情</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/contact">聯絡我們</a></nav>
          <button type="button" class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-md md:hidden" aria-expanded="false" aria-label="開啟選單"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu size-6" aria-hidden="true"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg></button>
        </div>
        <div class="stripes h-3 w-full" aria-hidden="true"></div>
      </header>
      <main class="flex-1">
        <div class="leaderboard-container">
          <h1 class="leaderboard-title">排行榜</h1>
          <div class="leaderboard-card">
            <div class="leaderboard-list" id="leaderboardList"></div>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://oajvxavzsomymqunpgxx.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_L8QCQotDAIP-Fzm8r5IIWQ_U17i-eFy";
      let supabaseClient = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === "function") {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
          console.warn("Supabase SDK 未載入，排行榜暫不可用。");
        }
      } catch (e) {
        console.warn("Supabase 初始化失敗，排行榜暫不可用。", e);
      }

      async function renderLeaderboard() {
        if (!supabaseClient) {
          document.getElementById("leaderboardList").innerHTML = '<div class="leaderboard-empty">排行榜暫不可用（Supabase 未載入），請重新整理。</div>';
          return;
        }
        const { data, error } = await supabaseClient.from("leaderboard")
          .select("*")
          .order('score', { ascending: false })
          .order('time_taken', { ascending: true })
          .limit(100);

        const list = document.getElementById("leaderboardList");
        if (error || !data || data.length === 0) {
          list.innerHTML = '<div class="leaderboard-empty">暫無成績記錄</div>';
          return;
        }
        list.innerHTML = data.map((r, i) => {
          const scoreText = `${r.score} / ${r.total}`;
          const timeText = r.time_taken ? `${r.time_taken}s` : "—";
          const dateText = r.created_at ? new Date(r.created_at).toLocaleDateString() : "";
          const isTop = i < 3;
          return `
            <div class="leaderboard-item ${isTop ? 'top' : ''}">
              <span class="leaderboard-rank">${i + 1}</span>
              <span class="leaderboard-name">${r.name}</span>
              <span class="leaderboard-score">${scoreText}</span>
              <span class="leaderboard-meta">${timeText}</span>
              <span class="leaderboard-meta">${dateText}</span>
            </div>
          `;
        }).join("");
      }
      renderLeaderboard();
    </script>

        <div class="mx-auto grid max-w-6xl gap-8 px-4 py-12 sm:grid-cols-4 sm:px-6">
          <div class="sm:col-span-2">
            <p class="font-serif text-xl text-cream">AGK 學術時事及常識問答隊</p>

              我們要的是「勝利者」，不是「參賽者」。十年以上隊史，由曾老師以及各隊長帶領，專注時事、歷史與生活常識。

        <p class="border-t border-cream/15 px-4 py-4 text-center text-xs text-plum-soft/80">

        </p>
      </footer>
    </body>
</html>
