<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="../assets/agk-icon.png" />
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" />
    <title>排行榜 | AGK 學術時事及常識問答隊</title>
  <style>
    .leaderboard-container {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    .leaderboard-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 2rem;
      margin-top: 1.5rem;
    }
    .leaderboard-title {
      text-align: center;
      font-family: "Noto Serif TC", serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--purple);
      margin-bottom: 0.5rem;
    }
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .leaderboard-item {
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 1fr) 7.5rem 3.5rem 4rem 5.5rem;
      gap: 0.9rem;
      align-items: center;
      padding: 0.9rem 1rem;
      border-radius: 0.25rem;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: transform 0.2s ease;
    }
    .leaderboard-item:hover { transform: translateX(5px); }
    .leaderboard-head {
      display: grid;
      grid-template-columns: 2.2rem minmax(0, 1fr) 7.5rem 3.5rem 4rem 5.5rem;
      gap: 0.9rem;
      align-items: center;
      padding: 0 1rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }
    .leaderboard-head span:nth-child(n + 3) { text-align: right; }
    .leaderboard-head.head-infinite span:nth-child(3) { text-align: left; }
    /* infinite list: 7 columns with the category column */
    .leaderboard-item.item-infinite,
    .leaderboard-head.head-infinite {
      grid-template-columns: 2.2rem minmax(0, 1fr) minmax(0, 11rem) 5rem 3.5rem 4rem 5.5rem;
    }
    .leaderboard-cat {
      font-size: 0.8rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .leaderboard-rank {
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .leaderboard-name {
      font-weight: 500;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .leaderboard-score {
      font-weight: 700;
      color: var(--purple);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .leaderboard-meta {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .leaderboard-item.top {
      background: var(--red);
      border-color: var(--lasalle-red-dark);
    }
    .leaderboard-item.top .leaderboard-rank,
    .leaderboard-item.top .leaderboard-name,
    .leaderboard-item.top .leaderboard-score { color: #ffffff; }
    .leaderboard-item.top .leaderboard-meta { color: rgb(255 255 255 / 92%); }
    .leaderboard-empty {
      text-align: center;
      padding: 2rem 0;
      color: var(--muted);
    }

    .leaderboard-list.hidden,
    .shared-questions.hidden {
      display: none;
    }

    /* ---- Board toggle bar ---- */
    .lb-tabs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 1.5rem;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }
    .lb-tab {
      display: inline-flex;
      align-items: center;
      min-height: 2.2rem;
      padding: 0 1.1rem;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .lb-tab:hover { border-color: var(--red); }
    .lb-tab.active {
      background: var(--red);
      border-color: var(--lasalle-red-dark);
      color: #ffffff;
    }
    .dark-mode .lb-tab {
      background: #2b303b;
    }
    .dark-mode .lb-tab.active {
      background: var(--red);
      border-color: var(--lasalle-red-dark);
    }
    .shared-entry {
      margin-bottom: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--purple);
      border-radius: 0.375rem;
      padding: 1.5rem;
      text-align: center;
    }
    .shared-entry .shared-name {
      font-family: "Noto Serif TC", serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--ink);
    }
    .shared-entry .shared-score {
      margin-top: 0.35rem;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--purple);
      font-variant-numeric: tabular-nums;
    }
    .shared-entry .shared-meta {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .shared-entry .shared-rank {
      display: inline-block;
      margin-top: 0.75rem;
      padding: 0.35rem 1rem;
      background: var(--purple);
      color: var(--cream);
      border-radius: 0.25rem;
      font-size: 0.9rem;
      font-weight: 700;
    }

    /* ---- Dark mode readability fixes ---- */
    .dark-mode .leaderboard-title,
    .dark-mode .leaderboard-score {
      color: #e7c9ee;
    }
    .dark-mode .leaderboard-item.top {
      background: var(--red);
      border-color: var(--lasalle-red-dark);
    }
    .dark-mode .shared-entry {
      border-color: #a87fd6;
    }
    .dark-mode .shared-entry .shared-score {
      color: #e7c9ee;
    }
    .dark-mode .shared-entry .shared-rank {
      background: #63359b;
    }

    /* ---- Shared entry: per-question review ---- */
    .shared-questions {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .sq-summary {
      font-size: 0.95rem;
      color: var(--ink);
      padding: 0.25rem 0;
    }
    .sq-ok { color: #2e7d32; font-weight: 700; }
    .sq-wrong { color: var(--red); font-weight: 700; }
    .sq-un { color: var(--muted); font-weight: 700; }
    .sq-item {
      display: flex;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.25rem;
    }
    .sq-item.ok { border-left: 3px solid #2e7d32; }
    .sq-item.wrong { border-left: 3px solid var(--red); }
    .sq-item.un { border-left: 3px solid var(--border); }
    .sq-item.un .sq-badge { background: var(--border); color: var(--muted); }
    .sq-item.un .sq-ans span:first-child { color: var(--muted); }

    /* ---- Shared entry: filter toggle ---- */
    .shared-filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding-bottom: 0.9rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.9rem;
    }
    .review-filter {
      display: inline-flex;
      align-items: center;
      min-height: 2.1rem;
      padding: 0 1rem;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 0.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
      font-variant-numeric: tabular-nums;
    }
    .review-filter:hover { border-color: var(--purple); }
    .review-filter.active {
      background: var(--purple);
      border-color: var(--purple-deep);
      color: var(--cream);
    }
    .sq-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 30rem;
      overflow-y: auto;
      padding-right: 0.25rem;
    }
    .review-empty {
      text-align: center;
      padding: 2rem 0;
      color: var(--muted);
    }

    /* dark mode filters */
    .dark-mode .review-filter {
      background: #2b303b;
    }
    .dark-mode .review-filter.active {
      background: #63359b;
      border-color: #7a4bb3;
    }
    .sq-badge {
      flex: none;
      width: 1.5rem;
      height: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }
    .sq-item.ok .sq-badge { background: #2e7d32; }
    .sq-item.wrong .sq-badge { background: var(--red); }
    .sq-body { flex: 1; min-width: 0; }
    .sq-q {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .sq-ans {
      margin: 0.4rem 0 0;
      font-size: 0.85rem;
      color: var(--muted);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .sq-item.wrong .sq-ans span:first-child { color: var(--red); }

    /* dark mode */
    .dark-mode .sq-item {
      background: #2b303b;
      border-color: #454b59;
    }
    .dark-mode .sq-ok { color: #7dc98a; }
    /* lighter red for small red text on dark backgrounds (contrast) */
    .dark-mode .sq-wrong,
    .dark-mode .sq-item.wrong .sq-ans span:first-child,
    .dark-mode .rv-wrong,
    .dark-mode .ls-kicker-red {
      color: #f28779;
    }
    .dark-mode .leaderboard-item.top {
      background: var(--red);
      border-color: var(--lasalle-red-dark);
    }
  </style>
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-cream text-ink">
      <header class="sticky top-0 z-50 bg-purple text-cream">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
          <a class="flex min-h-11 items-center gap-2 font-serif text-lg font-semibold tracking-wide" href="/"><img class="brand-icon" src="../assets/agk-icon.png" width="36" height="36" alt="" aria-hidden="true" /><span>AGK <span class="hidden font-sans text-sm font-normal text-plum-soft sm:inline">學術時事及常識問答隊</span></span></a>
          <nav class="hidden items-center gap-1 md:flex"><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/">隊伍簡介</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/training">訓練資料</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/competition/">競賽模擬</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors bg-red text-cream active" href="/leaderboard/" data-status="active" aria-current="page">排行榜</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/news">最新消息</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/awards">得獎詳情</a><a class="min-h-11 rounded-full px-3 py-2 text-sm transition-colors text-cream/90 hover:bg-purple-deep" href="/contact">聯絡我們</a></nav>
          <button type="button" class="inline-flex min-h-11 min-w-11 items-center justify-center rounded-md md:hidden" aria-expanded="false" aria-label="開啟選單"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu size-6" aria-hidden="true"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg></button>
        </div>
        <div class="stripes h-3 w-full" aria-hidden="true"></div>
      </header>
      <main class="flex-1">
        <div class="leaderboard-container">
          <h1 class="leaderboard-title">排行榜</h1>

          <div class="shared-entry hidden" id="sharedEntry"></div>

          <div class="shared-questions hidden" id="sharedQuestions"></div>

          <div class="lb-tabs" id="lbTabs">
            <button type="button" class="lb-tab active" data-board="listInfinite">無限模式</button>
            <button type="button" class="lb-tab" data-board="listSprint">60秒挑戰</button>
          </div>

          <div class="leaderboard-card">
            <div class="leaderboard-list" id="listInfinite"></div>
            <div class="leaderboard-list hidden" id="listSprint"></div>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const SUPABASE_URL = "https://oajvxavzsomymqunpgxx.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_L8QCQotDAIP-Fzm8r5IIWQ_U17i-eFy";
      let supabaseClient = null;
      try {
        if (window.supabase && typeof window.supabase.createClient === "function") {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
          console.warn("Supabase SDK 未載入，排行榜暫不可用。");
        }
      } catch (e) {
        console.warn("Supabase 初始化失敗，排行榜暫不可用。", e);
      }

      async function renderList(listId, rows, opts) {
        const list = document.getElementById(listId);
        if (!rows || rows.length === 0) {
          list.innerHTML = '<div class="leaderboard-empty">暫無成績記錄</div>';
          return;
        }
        const infinite = opts && opts.infinite;
        const head = infinite ? `
          <div class="leaderboard-head head-infinite">
            <span>排名</span><span>姓名</span><span>類別</span><span>答對</span><span>準確率</span><span>用時</span><span>日期</span>
          </div>
        ` : `
          <div class="leaderboard-head">
            <span>排名</span><span>姓名</span><span>得分</span><span>準確率</span><span>用時</span><span>日期</span>
          </div>
        `;
        list.innerHTML = head + rows.map((r, i) => {
          const scoreText = infinite ? `${r.score} / ${r.total}` : `${r.score}`;
          const accText = r.accuracy != null ? `${Math.round(r.accuracy * 100)}%` : "";
          const timeText = r.time_taken != null ? `${r.time_taken}s` : "—";
          const dateText = r.created_at ? new Date(r.created_at).toLocaleDateString() : "";
          const isTop = i < 3;
          const cat = infinite ? `<span class="leaderboard-cat">${esc(modeLabel(r.mode))}</span>` : "";
          return `
            <div class="leaderboard-item ${infinite ? 'item-infinite' : ''} ${isTop ? 'top' : ''}">
              <span class="leaderboard-rank">${i + 1}</span>
              <span class="leaderboard-name">${esc(r.name)}</span>
              ${cat}
              <span class="leaderboard-score">${scoreText}</span>
              <span class="leaderboard-meta">${accText}</span>
              <span class="leaderboard-meta">${timeText}</span>
              <span class="leaderboard-meta">${dateText}</span>
            </div>
          `;
        }).join("");
      }

      // infinite mode: all question-bank runs in one list, with the category column
      async function renderInfinite(listId) {
        if (!supabaseClient) {
          document.getElementById(listId).innerHTML = '<div class="leaderboard-empty">排行榜暫不可用（Supabase 未載入），請重新整理。</div>';
          return;
        }
        const { data, error } = await supabaseClient.from("leaderboard")
          .select("*")
          .order('score', { ascending: false })
          .order('accuracy', { ascending: false })
          .limit(500);
        if (error) {
          document.getElementById(listId).innerHTML = '<div class="leaderboard-empty">暫無成績記錄</div>';
          return;
        }
        const rows = (data || []).filter((r) => r.mode !== "sprint");
        await renderList(listId, rows, { infinite: true });
      }

      // 60s sprint mode: its own leaderboard
      async function renderSprint(listId) {
        if (!supabaseClient) {
          document.getElementById(listId).innerHTML = '<div class="leaderboard-empty">排行榜暫不可用（Supabase 未載入），請重新整理。</div>';
          return;
        }
        const { data, error } = await supabaseClient.from("leaderboard")
          .select("*")
          .eq("mode", "sprint")
          .order('score', { ascending: false })
          .order('accuracy', { ascending: false })
          .limit(100);
        if (error) {
          document.getElementById(listId).innerHTML = '<div class="leaderboard-empty">暫無成績記錄</div>';
          return;
        }
        await renderList(listId, data);
      }

      function modeLabel(mode) {
        const names = { normal: "第八屆紫荊杯", spring: "春季題庫", zijing9: "第九屆紫荊杯", national: "國情知識問答比賽", longtrek: "長征閱讀材料" };
        if (mode === "both") return "第八屆紫荊杯＋春季題庫";
        if (mode === "sprint") return "60秒挑戰";
        return (mode || "").split("+").map((m) => names[m] || m).join("＋");
      }

      async function renderSharedEntry() {
        const params = new URLSearchParams(window.location.search);
        const entryId = params.get("entry");
        if (!entryId || !supabaseClient) return;

        const { data, error } = await supabaseClient
          .from("leaderboard")
          .select("*")
          .eq("id", entryId)
          .maybeSingle();
        if (error || !data) return;

        // rank = (number of entries in the same mode with a higher score) + 1
        let rank = null;
        try {
          const { count, error: countError } = await supabaseClient
            .from("leaderboard")
            .select("*", { count: "exact", head: true })
            .eq("mode", data.mode)
            .gt("score", data.score);
          if (!countError && typeof count === "number") rank = count + 1;
        } catch (e) { /* rank is optional */ }

        const scoreText = `${data.score} / ${data.total}`;
        const timeText = data.time_taken != null ? `${data.time_taken}s` : "—";
        const dateText = data.created_at ? new Date(data.created_at).toLocaleDateString() : "";
        const el = document.getElementById("sharedEntry");
        el.innerHTML = `
          <div class="shared-name">${esc(data.name)}</div>
          <div class="shared-score">${scoreText}</div>
          <div class="shared-meta">${modeLabel(data.mode)} · 用時 ${timeText} · ${dateText}</div>
          ${rank !== null ? `<div class="shared-rank">排名 第 ${rank} 位</div>` : ""}
        `;
        el.classList.remove("hidden");
        el.scrollIntoView({ behavior: "smooth", block: "center" });

        // per-question review (correct / wrong / unanswered) with filter toggle
        sharedDetails = Array.isArray(data.details) ? data.details : null;
        if (sharedDetails && sharedDetails.length) {
          renderSharedQuestions();
        }
      }

      let sharedDetails = null;
      let sharedFilter = "all";

      function renderSharedQuestions() {
        const qWrap = document.getElementById("sharedQuestions");
        if (!sharedDetails || !sharedDetails.length) return;

        const right = sharedDetails.filter((d) => d.ok).length;
        const wrong = sharedDetails.filter((d) => !d.ok && d.ua != null).length;
        const unanswered = sharedDetails.filter((d) => !d.ok && d.ua == null).length;

        const counts = { all: sharedDetails.length, ok: right, wrong: wrong, un: unanswered };
        const labels = { all: "全部", ok: "答對", wrong: "答錯", un: "未答" };
        let html = '<div class="shared-filters">';
        for (const key of ["all", "ok", "wrong", "un"]) {
          html += `<button type="button" class="review-filter${sharedFilter === key ? " active" : ""}" data-filter="${key}">${labels[key]} ${counts[key]}</button>`;
        }
        html += "</div>";

        const filtered = sharedFilter === "all" ? sharedDetails : sharedDetails.filter((d) => {
          if (sharedFilter === "ok") return d.ok;
          if (sharedFilter === "wrong") return !d.ok && d.ua != null;
          return !d.ok && d.ua == null;
        });

        html += '<div class="sq-list">';
        if (filtered.length === 0) {
          html += '<div class="review-empty">沒有記錄</div>';
        } else {
          html += filtered.map((d) => {
            const n = sharedDetails.indexOf(d) + 1;
            const status = d.ok ? "ok" : (d.ua != null ? "wrong" : "un");
            const badge = d.ok ? "✓" : (d.ua != null ? "✗" : "–");
            return `
              <div class="sq-item ${status}">
                <span class="sq-badge">${badge}</span>
                <div class="sq-body">
                  <p class="sq-q">${n}. ${esc(d.q)}</p>
                  <p class="sq-ans"><span>你的答案：${esc(d.ua == null ? "未作答" : d.ua)}</span><span>正確答案：${esc(d.ca)}</span></p>
                </div>
              </div>
            `;
          }).join("");
        }
        html += "</div>";

        qWrap.innerHTML = html;
        qWrap.classList.remove("hidden");
      }

      document.getElementById("sharedQuestions").addEventListener("click", (e) => {
        const btn = e.target && e.target.closest ? e.target.closest(".review-filter") : null;
        if (!btn) return;
        sharedFilter = btn.dataset.filter || "all";
        renderSharedQuestions();
      });

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&" + "amp;")
          .replace(/</g, "&" + "lt;")
          .replace(/>/g, "&" + "gt;");
      }

      // tab bar: one board visible at a time, fetched lazily and cached
      const fetchedBoards = new Set();

      async function activateTab(boardId) {
        document.querySelectorAll(".leaderboard-list").forEach((el) => el.classList.add("hidden"));
        const list = document.getElementById(boardId);
        if (list) list.classList.remove("hidden");
        if (fetchedBoards.has(boardId)) return;
        fetchedBoards.add(boardId);
        if (boardId === "listSprint") {
          await renderSprint(boardId);
        } else {
          await renderInfinite(boardId);
        }
      }

      document.getElementById("lbTabs").addEventListener("click", (e) => {
        const tab = e.target && e.target.closest ? e.target.closest(".lb-tab") : null;
        if (!tab) return;
        document.querySelectorAll(".lb-tab").forEach((t) => t.classList.toggle("active", t === tab));
        activateTab(tab.dataset.board);
      });

      // entry-link view: show only the shared result stats, not the leaderboard boards
      (function init() {
        const isEntryView = !!new URLSearchParams(window.location.search).get("entry");
        if (isEntryView) {
          document.querySelectorAll(".lb-tabs, .leaderboard-card").forEach((el) => el.classList.add("hidden"));
          renderSharedEntry();
        } else {
          activateTab("listInfinite");
        }
      })();
    </script>
