<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="/assets/agk-icon.png" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" />
    <title>競賽模擬 | AGK 學術時事及常識問答隊</title>
    <meta name="description" content="AGK 學術時事及常識問答隊的競賽模擬：全真介面限時作答，即時批改。" />
    <style>
      .quiz-card {
        border-radius: 0.2rem;
        box-shadow: 0 8px 24px rgb(28 32 43 / 8%);
      }
      .quiz-progress-row {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }
      .quiz-progress-track {
        position: relative;
        flex: 1;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
      }
      .quiz-progress-dot {
        position: absolute;
        top: 50%;
        left: 0;
        transform: translate(-50%, -50%);
        width: 9px;
        height: 9px;
        background: var(--red);
        border-radius: 50%;
        transition: left 0.2s ease;
      }
      .quiz-progress-label {
        font-size: 1.125rem;
        color: var(--ink);
        white-space: nowrap;
      }
      .quiz-timer {
        margin-top: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: var(--red);
        font-size: 1.05rem;
      }
      .quiz-timer .divider { margin: 0 0.25rem; }
      .quiz-question {
        margin-top: 1.5rem;
        font-size: 1.15rem;
        line-height: 1.7;
        color: var(--ink);
      }
      .quiz-options {
        margin-top: 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }
      .quiz-option {
        display: flex;
        align-items: flex-start;
        gap: 0.7rem;
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1.55;
        color: var(--ink);
      }
      .quiz-option input[type="radio"] { display: none; }
      .quiz-option .radio-circle {
        flex-shrink: 0;
        width: 19px;
        height: 19px;
        margin-top: 3px;
        border: 2px solid var(--muted);
        border-radius: 50%;
        position: relative;
        transition: border-color 150ms ease;
      }
      .quiz-option .radio-circle::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: var(--red);
        opacity: 0;
        transform: scale(0.4);
        transition: all 150ms ease;
      }
      .quiz-option:hover .radio-circle { border-color: var(--red); }
      .quiz-option.selected .radio-circle { border-color: var(--red); }
      .quiz-option.selected .radio-circle::after { opacity: 1; transform: scale(1); }
      .quiz-buttons {
        margin-top: 2.75rem;
        display: flex;
        justify-content: space-around;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .quiz-btn {
        align-items: center;
        background: var(--red);
        border: none;
        border-radius: 999px;
        color: #ffffff;
        cursor: pointer;
        display: inline-flex;
        font-size: 0.95rem;
        font-weight: 600;
        justify-content: center;
        min-height: 2.75rem;
        letter-spacing: 0.05em;
        padding: 0.7rem 1.75rem;
        transition: background-color 150ms ease;
      }
      .quiz-btn:hover { background: var(--purple); }
      .quiz-btn:disabled {
        background: var(--border);
        color: var(--muted);
        cursor: not-allowed;
      }
      .quiz-toast {
        position: fixed;
        bottom: 2.5rem;
        left: 50%;
        transform: translateX(-50%);
        background: rgb(32 36 46 / 85%);
        color: #fffdf8;
        padding: 0.65rem 1.4rem;
        border-radius: 0.5rem;
        font-size: 0.9rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 100;
      }
      .quiz-toast.show { opacity: 1; }

      .quiz-results { display: none; }
      .quiz-results.active { display: block; }
      .quiz-view.hidden { display: none; }
      .quiz-score {
        text-align: center;
        padding: 0.5rem 0 1.75rem;
      }
      .quiz-score-big {
        font-size: 2.75rem;
        font-weight: 700;
        color: var(--purple);
        font-family: "Noto Serif TC", serif;
      }
      .quiz-score-sub { margin-top: 0.5rem; font-size: 1rem; color: var(--muted); }
      .quiz-review-list {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        max-height: 30rem;
        overflow-y: auto;
        padding-right: 0.5rem;
      }
      .quiz-review-item {
        border: 1px solid var(--border);
        border-left: 3px solid var(--red);
        border-radius: 0.2rem;
        padding: 0.85rem 1.1rem;
        font-size: 0.95rem;
        line-height: 1.6;
      }
      .quiz-review-item.correct { border-left-color: #4caf7d; }
      .quiz-review-item .quiz-review-q { color: var(--ink); }
      .quiz-review-item .quiz-review-a { margin-top: 0.35rem; color: var(--muted); font-size: 0.875rem; }
      .quiz-review-item .tag { font-weight: 600; }
      .quiz-review-item.correct .tag { color: #4caf7d; }
      .quiz-review-item.wrong .tag { color: var(--red); }
      .quiz-results-actions { margin-top: 2rem; text-align: center; }
    </style>
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-cream text-ink">
      <header class="sticky top-0 z-50 bg-purple text-cream">
        <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
          <a class="flex min-h-11 items-center gap-2 font-serif text-lg font-semibold tracking-wide" href="/">
            <img class="brand-icon" src="/assets/agk-icon.png" width="36" height="36" alt="" aria-hidden="true" /><span>AGK <span class="hidden font-sans text-sm font-normal text-plum-soft sm:inline">學術時事及常識問答隊</span></span>
          </a>
          <nav class="hidden items-center gap-1 md:flex">
            <a href="/" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">隊伍簡介</a>
            <a href="/training" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">訓練資料</a>
            <a href="/competition" class="min-h-11 rounded-full bg-red px-3 py-2 text-sm text-cream" aria-current="page">競賽模擬</a>
            <a href="/news" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">最新消息</a>
            <a href="/awards" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">得獎詳情</a>
            <a href="/contact" class="min-h-11 rounded-full px-3 py-2 text-sm text-cream/90 hover:bg-purple-deep">聯絡我們</a>
          </nav>
          <a href="/" class="inline-flex min-h-11 items-center rounded-md px-3 text-sm md:hidden">返回首頁</a>
        </div>
        <div class="stripes h-3 w-full" aria-hidden="true"></div>
      </header>
      <main class="flex-1">
        <section class="bg-purple px-4 py-16 text-cream sm:px-6 sm:py-20">
          <div class="mx-auto max-w-3xl text-center">
            <p class="text-sm tracking-[0.2em] text-plum-soft">COMPETITION SIMULATOR</p>
            <h1 class="mt-3 font-serif text-4xl font-bold sm:text-5xl">競賽模擬</h1>
            <p class="mt-4 text-lg text-plum-soft">全真模擬競賽介面，限時作答，即時批改。</p>
          </div>
        </section>
        <div class="stripes h-3 w-full" aria-hidden="true"></div>
        <section class="bg-cream px-4 py-16 sm:px-6">
          <div class="mx-auto max-w-3xl">
            <article class="quiz-card border border-border bg-surface p-6 sm:p-8">

              <div class="quiz-view" id="quizView">
                <div class="quiz-progress-row">
                  <div class="quiz-progress-track"><div class="quiz-progress-dot" id="progressDot"></div></div>
                  <div class="quiz-progress-label" id="progressLabel">1/563</div>
                </div>
                <div class="quiz-timer">
                  <span>🕐</span>
                  <span>总时长：<span id="totalTimeText">1分钟</span></span>
                  <span class="divider">|</span>
                  <span>当前：<span id="currentTimeText">01:00</span></span>
                </div>
                <div class="quiz-question" id="questionText"></div>
                <div class="quiz-options" id="optionsList"></div>
                <div class="quiz-buttons">
                  <button type="button" class="quiz-btn" id="prevBtn">上一題</button>
                  <button type="button" class="quiz-btn" id="saveBtn">保 存</button>
                  <button type="button" class="quiz-btn" id="nextBtn">下一題</button>
                </div>
              </div>

              <div class="quiz-results" id="resultsView">
                <div class="quiz-score">
                  <div class="quiz-score-big" id="scoreBig"></div>
                  <div class="quiz-score-sub" id="scoreSub"></div>
                </div>
                <div class="quiz-review-list" id="reviewList"></div>
                <div class="quiz-results-actions">
                  <button type="button" class="quiz-btn" id="restartBtn">重新開始</button>
                </div>
              </div>

            </article>
          </div>
        </section>
      </main>
      <footer class="bg-purple-deep px-4 py-8 text-center text-sm text-plum-soft"><a href="/" class="text-cream">AGK 學術時事及常識問答隊</a><span class="mx-2">·</span><a href="/contact" class="text-cream underline">聯絡我們</a></footer>
    </div>
    <div class="quiz-toast" id="toast"></div>

    <script src="/competition/questions.js"></script>
    <script>
      const TOTAL_SECONDS = 60; // 总时长：1分钟
      const LETTERS = ["A", "B", "C", "D", "E", "F"];

      // 每次載入隨機生成四個選項（正確答案 + 三個干擾項）
      function buildOptions(correct) {
        const pool = QUESTION_BANK.map((item) => item.a).sort(() => Math.random() - 0.5);
        const used = new Set([correct]);
        const distractors = [];
        for (const cand of pool) {
          if (distractors.length >= 3) break;
          if (used.has(cand)) continue;
          used.add(cand);
          distractors.push(cand);
        }
        const options = [correct, ...distractors];
        for (let i = options.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [options[i], options[j]] = [options[j], options[i]];
        }
        return options;
      }

      const QUESTIONS = QUESTION_BANK.map((item) => {
        const options = buildOptions(item.a);
        return { q: item.q, options, correctIndex: options.indexOf(item.a) };
      });

      let idx = 0;
      let selections = new Array(QUESTIONS.length).fill(null);
      let saved = new Set();
      let timeLeft = TOTAL_SECONDS;
      let timerId = null;
      let finished = false;

      const $ = (id) => document.getElementById(id);

      function fmt(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function startTimer() {
        stopTimer();
        timeLeft = TOTAL_SECONDS;
        $("currentTimeText").textContent = fmt(timeLeft);
        timerId = setInterval(() => {
          timeLeft--;
          $("currentTimeText").textContent = fmt(Math.max(timeLeft, 0));
          if (timeLeft <= 0) {
            stopTimer();
            finish(true);
          }
        }, 1000);
      }

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function render() {
        const item = QUESTIONS[idx];
        $("progressLabel").textContent = (idx + 1) + "/" + QUESTIONS.length;
        $("progressDot").style.left = QUESTIONS.length > 1 ? (idx / (QUESTIONS.length - 1)) * 100 + "%" : "0%";
        $("questionText").textContent = item.q;

        const list = $("optionsList");
        list.innerHTML = "";
        item.options.forEach((opt, i) => {
          const label = document.createElement("label");
          label.className = "quiz-option" + (selections[idx] === i ? " selected" : "");
          const input = document.createElement("input");
          input.type = "radio";
          input.name = "q" + idx;
          input.checked = selections[idx] === i;
          input.addEventListener("change", () => {
            selections[idx] = i;
            render();
          });
          const circle = document.createElement("span");
          circle.className = "radio-circle";
          const text = document.createElement("span");
          text.textContent = LETTERS[i] + "、" + opt;
          label.appendChild(input);
          label.appendChild(circle);
          label.appendChild(text);
          list.appendChild(label);
        });

        $("prevBtn").disabled = idx === 0;
        $("nextBtn").textContent = idx === QUESTIONS.length - 1 ? "完 成" : "下一題";
      }

      function showToast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 1400);
      }

      function finish(timeUp) {
        if (finished) return;
        finished = true;
        stopTimer();

        let correctCount = 0;
        const review = $("reviewList");
        review.innerHTML = "";
        QUESTIONS.forEach((item, i) => {
          const sel = selections[i];
          const isCorrect = sel === item.correctIndex;
          if (isCorrect) correctCount++;
          const div = document.createElement("div");
          div.className = "quiz-review-item " + (isCorrect ? "correct" : "wrong");
          const q = document.createElement("div");
          q.className = "quiz-review-q";
          q.textContent = (i + 1) + ". " + item.q;
          const a = document.createElement("div");
          a.className = "quiz-review-a";
          const yourAns = sel === null ? "未作答" : LETTERS[sel] + "、" + item.options[sel];
          const correctAns = LETTERS[item.correctIndex] + "、" + item.options[item.correctIndex];
          a.innerHTML = "你的答案：<span class=\"tag\">" + esc(yourAns) + "</span>　正確答案：<span class=\"tag\">" + esc(correctAns) + "</span>";
          div.appendChild(q);
          div.appendChild(a);
          review.appendChild(div);
        });

        const pct = Math.round((correctCount / QUESTIONS.length) * 100);
        $("scoreBig").textContent = correctCount + " / " + QUESTIONS.length;
        $("scoreSub").textContent = timeUp ? "時間到！正確率 " + pct + "%" : "答題完成！正確率 " + pct + "%";

        $("quizView").classList.add("hidden");
        $("resultsView").classList.add("active");
        window.scrollTo(0, 0);
      }

      function esc(s) {
        return String(s).replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
      }

      $("prevBtn").addEventListener("click", () => {
        if (finished || idx === 0) return;
        idx--;
        render();
      });

      $("saveBtn").addEventListener("click", () => {
        if (finished) return;
        if (selections[idx] === null) {
          showToast("請先選擇一個答案");
          return;
        }
        saved.add(idx);
        showToast("已保存第 " + (idx + 1) + " 題");
      });

      $("nextBtn").addEventListener("click", () => {
        if (finished) return;
        if (idx === QUESTIONS.length - 1) {
          finish(false);
        } else {
          idx++;
          render();
        }
      });

      $("restartBtn").addEventListener("click", () => {
        idx = 0;
        selections = new Array(QUESTIONS.length).fill(null);
        saved = new Set();
        finished = false;
        $("resultsView").classList.remove("active");
        $("quizView").classList.remove("hidden");
        render();
        startTimer();
        window.scrollTo(0, 0);
      });

      render();
      startTimer();
    </script>
  </body>
</html>
