<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="assets/agk-icon.png" />
    <meta name="theme-color" content="#f4f4f4" />
    <script src="theme.js"></script>
    <script>document.documentElement.classList.add("js");</script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"
    />
    <title>LSCAGKT · 喇沙書院學術時事及常識問答隊</title>
    <meta
      name="description"
      content="喇沙書院學術時事及常識問答隊（LSCAGKT）：資源庫與競賽模擬。"
    />
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-cream text-ink">
      <header class="site-header">
        <div class="site-header-inner">
          <a class="brand" href="/" aria-label="LSCAGKT 首頁">
            <img class="brand-icon" src="assets/agk-icon.png" width="30" height="30" alt="LSCAGKT 校徽標誌" />
            <span class="brand-name">LSC<span class="accent">AGKT</span></span>
            <span class="brand-zh">喇沙書院學術時事及常識問答隊</span>
          </a>
          <nav class="site-nav" id="siteNav">
            <a href="/training">資源庫</a>
            <a href="/competition/">競賽模擬</a>
            <a href="/leaderboard/">排行榜</a>
          </nav>
          <button type="button" class="nav-toggle" aria-expanded="false" aria-label="開啟選單">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg>
          </button>
        </div>
      </header>
      <main class="flex-1">
        <section class="ls-hero">
          <div class="mx-auto max-w-6xl">
            <p class="reveal ls-kicker">LSC AGKT · LA SALLE COLLEGE</p>
            <h1 class="reveal ls-title" style="--reveal-delay: 70ms">
              喇沙書院學術時事及常識問答隊
            </h1>
            <p class="reveal ls-sub" style="--reveal-delay: 140ms">
              資源庫與競賽模擬，一切為了賽場。
            </p>
            <div class="reveal entry-grid" style="--reveal-delay: 210ms">
              <a class="entry-card" href="/training">
                <span class="entry-num">01 — RESOURCES</span>
                <h2>資源庫</h2>
                <p>筆記、參考資料與溫習文件，密碼保護，懸停預覽，網頁內直接閱覽。</p>
                <span class="entry-arrow">前往資源庫 →</span>
              </a>
              <a class="entry-card" href="/competition/">
                <span class="entry-num">02 — PRACTICE</span>
                <h2>競賽模擬</h2>
                <p>限時搶答練習，即時批改，連擊計分；成績可保存至排行榜。</p>
                <span class="entry-arrow">開始練習 →</span>
              </a>
            </div>
          </div>
        </section>
      </main>
      <footer class="bg-purple-deep">
        <div class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
          <p class="text-sm text-muted" style="margin: 0">
            版權所有 © 2026 LSCAGKT · 喇沙書院學術時事及常識問答隊
          </p>
        </div>
      </footer>
