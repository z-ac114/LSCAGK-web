<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../styles.css" />
    <style>html{background:#fcfbf4}html.dark-mode{background:#181715}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="../assets/agk-icon.png" />
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" />
    <title>管理後台 | LSCAGKT</title>
    <meta name="robots" content="noindex" />
    <style>
      .admin-wrap { max-width: 1080px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
      .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
      .admin-title { font-family: "Noto Serif TC", serif; font-size: 1.7rem; font-weight: 700; color: var(--purple); margin: 0; }
      .dark-mode .admin-title { color: #e3c6dc; }
      .admin-sub { color: var(--muted); font-size: 0.88rem; margin: 0.2rem 0 0; }

      /* ---- 登入 ---- */
      .login-box {
        max-width: 380px; margin: 4rem auto 0; padding: 2.2rem 2rem;
        background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
      }
      .login-box h1 { font-family: "Noto Serif TC", serif; font-size: 1.4rem; font-weight: 700; color: var(--purple); margin: 0 0 0.3rem; }
      .dark-mode .login-box h1 { color: #e3c6dc; }
      .login-box p { color: var(--muted); font-size: 0.88rem; margin: 0 0 1.4rem; }
      .field { display: block; margin-bottom: 1rem; }
      .field span { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink); margin-bottom: 0.35rem; }
      .field input[type="text"], .field input[type="password"], .field textarea, .field select {
        width: 100%; box-sizing: border-box; padding: 0.6rem 0.8rem;
        border: 1px solid var(--hairline-strong, var(--hairline)); border-radius: 8px;
        background: var(--cream, #fcfbf4); color: var(--ink); font: inherit; font-size: 0.95rem;
      }
      .dark-mode .field input, .dark-mode .field textarea, .dark-mode .field select { background: rgb(255 255 255 / 4%); }
      .field textarea { resize: vertical; min-height: 84px; }
      .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--school-gold, #c9a227); outline-offset: 1px; }

      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        min-height: 2.5rem; padding: 0 1.1rem; border-radius: 9999px; border: 1px solid var(--hairline);
        background: var(--surface); color: var(--ink); font: inherit; font-size: 0.9rem; font-weight: 600;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        transition: border-color 150ms ease, background 150ms ease, opacity 150ms ease;
      }
      .btn:hover { border-color: var(--purple); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
      .btn.primary:hover { background: var(--lasalle-red-dark); border-color: var(--lasalle-red-dark); }
      .btn.danger { color: #b3261e; border-color: rgb(179 38 30 / 40%); }
      .btn.danger:hover { border-color: #b3261e; background: rgb(179 38 30 / 6%); }
      .btn.sm { min-height: 2.1rem; padding: 0 0.8rem; font-size: 0.82rem; }
      .dark-mode .btn.danger { color: #f28779; }

      /* ---- 分頁 ---- */
      .tabs { display: flex; gap: 0.4rem; margin: 1.6rem 0 1.4rem; border-bottom: 1px solid var(--hairline); overflow-x: auto; }
      .tab {
        padding: 0.65rem 1.1rem; border: 0; border-bottom: 2px solid transparent; background: none;
        font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted); cursor: pointer;
        white-space: nowrap; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      .tab[aria-selected="true"] { color: var(--purple); border-bottom-color: var(--purple); }
      .dark-mode .tab[aria-selected="true"] { color: #e3c6dc; }

      /* ---- 上傳卡 ---- */
      .card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 1.4rem; }
      .card + .card, .card + .list, .list + .card { margin-top: 1.2rem; }
      .card h2 { font-family: "Noto Serif TC", serif; font-size: 1.15rem; font-weight: 700; color: var(--purple); margin: 0 0 1rem; }
      .dark-mode .card h2 { color: #e3c6dc; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.2rem; }
      .form-grid .span2 { grid-column: 1 / -1; }
      @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
      .file-drop {
        display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 1rem;
        border: 1.5px dashed var(--hairline-strong, var(--hairline)); border-radius: 10px; cursor: pointer;
        color: var(--muted); font-size: 0.9rem;
      }
      .file-drop.has-file { border-style: solid; color: var(--ink); }
      .check-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--ink); }
      .check-row input { width: 16px; height: 16px; }
      .progress { height: 6px; border-radius: 9999px; background: var(--hairline); overflow: hidden; margin-top: 0.8rem; display: none; }
      .progress.show { display: block; }
      .progress i { display: block; height: 100%; width: 0; background: var(--purple); transition: width 150ms ease; }
      .form-msg { font-size: 0.85rem; margin: 0.7rem 0 0; }
      .form-msg.err { color: #b3261e; }
      .dark-mode .form-msg.err { color: #f28779; }
      .form-msg.ok { color: #1b7f3b; }
      .dark-mode .form-msg.ok { color: #7bd39a; }

      /* ---- 清單 ---- */
      .list { display: flex; flex-direction: column; gap: 0.8rem; }
      .item {
        background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
        padding: 1rem 1.2rem;
      }
      .item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; }
      .item-title { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 1.02rem; color: var(--purple); margin: 0; line-height: 1.45; }
      .dark-mode .item-title { color: #e3c6dc; }
      .item-desc { color: var(--muted); font-size: 0.88rem; line-height: 1.65; margin: 0.35rem 0 0; }
      .item-meta { display: flex; flex-wrap: wrap; gap: 0.6rem 0.9rem; margin-top: 0.6rem; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
      .badge {
        display: inline-flex; padding: 3px 10px; border-radius: 9999px;
        background: var(--rose-soft); color: var(--lasalle-red-dark); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      }
      .dark-mode .badge { background: rgb(224 82 74 / 14%); color: #f28779; }
      .badge.extra { background: #efe4c8; color: #7a5c14; }
      .dark-mode .badge.extra { background: rgb(226 187 98 / 16%); color: #e2bb62; }
      .item-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
      .empty { text-align: center; color: var(--muted); font-size: 0.9rem; padding: 2.5rem 1rem; }

      /* ---- 排行榜 ---- */
      .board-tools { display: flex; flex-wrap: wrap; gap: 0.7rem; align-items: center; margin-bottom: 1rem; }
      .board-tools select, .board-tools input {
        padding: 0.55rem 0.8rem; border: 1px solid var(--hairline); border-radius: 8px;
        background: var(--surface); color: var(--ink); font: inherit; font-size: 0.9rem;
      }
      .dark-mode .board-tools select, .dark-mode .board-tools input { background: rgb(255 255 255 / 4%); }
      .board-tools .spacer { flex: 1; }
      .board-scroll { overflow-x: auto; border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--surface); }
      table.board { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 640px; }
      .board th {
        text-align: left; padding: 0.7rem 0.9rem; font-size: 0.76rem; letter-spacing: 0.06em;
        color: var(--muted); border-bottom: 1px solid var(--hairline); white-space: nowrap; font-weight: 600;
      }
      .board td { padding: 0.65rem 0.9rem; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
      .board tr:last-child td { border-bottom: 0; }
      .board td.num, .board th.num { text-align: right; font-variant-numeric: tabular-nums; }
      .board .name { font-weight: 600; }
      .board .star { color: var(--school-gold, #c9a227); }
      .board input[type="checkbox"] { width: 15px; height: 15px; }
      .dark-mode .board-scroll { background: var(--surface); }
      .board-mode { display: inline-flex; padding: 2px 9px; border-radius: 9999px; border: 1px solid var(--hairline); font-size: 0.72rem; color: var(--muted); }

      /* ---- Kahoot 佔位 ---- */
      .soon { text-align: center; padding: 3rem 1.5rem; }
      .soon-icon { color: var(--purple); opacity: 0.6; }
      .soon h2 { font-family: "Noto Serif TC", serif; font-size: 1.3rem; color: var(--purple); margin: 0.8rem 0 0.4rem; }
      .dark-mode .soon h2 { color: #e3c6dc; }
      .soon p { color: var(--muted); font-size: 0.92rem; max-width: 440px; margin: 0 auto 1.4rem; line-height: 1.7; }
      .soon ul { list-style: none; padding: 0; margin: 0 auto 1.6rem; max-width: 380px; text-align: left; color: var(--muted); font-size: 0.88rem; }
      .soon li { padding: 0.45rem 0; border-bottom: 1px solid var(--hairline); display: flex; gap: 0.6rem; }
      .soon li:last-child { border-bottom: 0; }

      .hidden { display: none !important; }

      /* ---- 問答競技場（主持） ---- */
      .k-pin {
        font-family: "Noto Serif TC", serif; font-size: 3.2rem; font-weight: 700;
        letter-spacing: 0.14em; color: var(--purple); font-variant-numeric: tabular-nums; line-height: 1.1;
      }
      .dark-mode .k-pin { color: #e3c6dc; }
      .k-chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.9rem; }
      .k-chips .chip {
        padding: 0.35rem 0.85rem; border-radius: 9999px; border: 1px solid var(--hairline);
        background: var(--cream, #fcfbf4); font-size: 0.86rem;
      }
      .dark-mode .k-chips .chip { background: rgb(255 255 255 / 5%); }
      .k-qtext { font-family: "Noto Serif TC", serif; font-size: 1.15rem; font-weight: 700; line-height: 1.6; margin: 0 0 1rem; }
      .k-opt {
        display: flex; align-items: center; gap: 0.7rem; padding: 0.65rem 0.9rem;
        border-radius: 10px; border: 1px solid var(--hairline); font-size: 0.95rem; position: relative; overflow: hidden;
      }
      .k-opt .bar { position: absolute; inset: 0; opacity: 0.18; }
      .k-opt .lab { position: relative; flex: 1; min-width: 0; font-weight: 600; }
      .k-opt .cnt { position: relative; font-weight: 700; font-variant-numeric: tabular-nums; }
      .k-opt.correct { border-color: var(--school-gold); }
      .k-opt.correct .lab::after { content: " · 正確答案"; color: #1b7f3b; font-weight: 700; font-size: 0.8rem; }
      .o-red { background: #c0392b; } .o-gold { background: #b3862c; }
      .o-plum { background: #6b3a63; } .o-green { background: #3e7d5a; }
      .o-red .bar, .o-gold .bar, .o-plum .bar, .o-green .bar { background: #fff; }
      .k-live-top { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
      .q-num { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
      .timer-track { height: 8px; border-radius: 9999px; background: var(--hairline); overflow: hidden; }
      .timer-fill { height: 100%; width: 0; background: var(--school-gold); transition: width 300ms linear; }
      .timer-fill.low { background: var(--red); }

      @media (max-width: 640px) {
        .admin-wrap { padding: 1rem 0.85rem 3rem; }
        .card { padding: 1.1rem 1rem; }
        .item-top { flex-direction: column; }
        .item-actions { width: 100%; }
        .item-actions .btn { flex: 1; }
      }
    </style>
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-cream text-ink">
      <header class="site-header"><div class="site-header-inner"><a class="brand" href="/"><img class="brand-icon" src="/assets/agk-icon.png" width="30" height="30" alt="LSCAGKT 校徽標誌" /><span class="brand-name">LSC<span class="accent">AGKT</span></span><span class="brand-zh">喇沙書院學術時事及常識問答隊</span></a><nav class="site-nav" id="siteNav"><a href="/">首頁</a><a href="/training">資源庫</a><a href="/competition/">競賽模擬</a><a href="/leaderboard/">排行榜</a></nav><button type="button" class="nav-toggle" aria-expanded="false" aria-label="開啟選單"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg></button></div></header>

      <main class="flex-1">
        <div class="admin-wrap">
          <!-- 登入 -->
          <div class="login-box" id="loginView">
            <h1>管理後台</h1>
            <p>請輸入管理員密碼以繼續。</p>
            <form id="loginForm">
              <label class="field"><span>帳號</span><input type="text" id="loginUser" autocomplete="username" required /></label>
              <label class="field"><span>密碼</span><input type="password" id="loginPass" autocomplete="current-password" required /></label>
              <button type="submit" class="btn primary" id="loginBtn" style="width: 100%;">進入</button>
              <p class="form-msg err" id="loginMsg" role="alert"></p>
            </form>
          </div>

          <!-- 面板 -->
          <div id="panelView" class="hidden">
            <div class="admin-head">
              <div>
                <h1 class="admin-title">管理後台</h1>
                <p class="admin-sub">管理資源庫 PDF、排行榜記錄與問答遊戲。</p>
              </div>
              <button type="button" class="btn sm" id="logoutBtn">登出</button>
            </div>

            <div class="tabs" role="tablist">
              <button class="tab" role="tab" aria-selected="true" data-tab="pdfs">資源管理</button>
              <button class="tab" role="tab" aria-selected="false" data-tab="board">排行榜記錄</button>
              <button class="tab" role="tab" aria-selected="false" data-tab="kahoot">問答遊戲</button>
            </div>

            <!-- ======== 資源管理 ======== -->
            <section id="tab-pdfs" role="tabpanel">
              <div class="card">
                <h2>上傳 PDF</h2>
                <div class="form-grid">
                  <label class="field span2" id="fileField">
                    <span>PDF 檔案（最大 50MB）</span>
                    <div class="file-drop" id="fileDrop" tabindex="0" role="button" aria-label="選擇 PDF 檔案">
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                      <span id="fileLabel">點擊選擇檔案</span>
                    </div>
                    <input type="file" id="pdfFile" accept="application/pdf,.pdf" class="hidden" />
                  </label>
                  <label class="field"><span>標題</span><input type="text" id="pdfTitle" maxlength="120" placeholder="例如：全民國情參考資料 v25" /></label>
                  <label class="field"><span>分類標籤</span><input type="text" id="pdfTag" maxlength="30" list="tagList" placeholder="競賽資料" />
                    <datalist id="tagList"><option value="競賽資料"></option><option value="化學"></option><option value="物理"></option><option value="數學"></option><option value="中文"></option><option value="英文"></option><option value="其他"></option></datalist>
                  </label>
                  <label class="field"><span>頁數</span><input type="text" id="pdfPages" maxlength="30" placeholder="例如：28 頁（可自動生成）" /></label>
                  <label class="field span2"><span>描述（會顯示在資源庫卡片）</span><textarea id="pdfDesc" maxlength="500" placeholder="簡介內容、題數、頁數等"></textarea></label>
                  <label class="field span2 check-row"><input type="checkbox" id="pdfExtra" /> 歸入「延伸資料」（非隊伍資源）</label>
                </div>
                <div class="progress" id="upProg"><i id="upBar"></i></div>
                <p class="form-msg" id="upMsg" role="status"></p>
                <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
                  <button type="button" class="btn" id="genBtn" title="分析 PDF 自動填入標題、描述與頁數">自動填入資料</button>
                  <button type="button" class="btn primary" id="uploadBtn">上傳</button>
                </div>
              </div>

              <h2 class="admin-title" style="font-size: 1.15rem; margin: 1.8rem 0 0.8rem;">已上傳的 PDF（雲端）</h2>
              <p class="admin-sub" style="margin-bottom: 0.9rem;">這些檔案會自動顯示在資源庫頁面。靜態資源（隨網站部署的 PDF）不在此列。</p>
              <div class="list" id="pdfList"><div class="empty">載入中…</div></div>
            </section>

            <!-- ======== 排行榜 ======== -->
            <section id="tab-board" role="tabpanel" class="hidden">
              <div class="board-tools">
                <select id="boardMode" aria-label="模式篩選">
                  <option value="all">全部模式</option>
                  <option value="sprint">限時模式</option>
                  <option value="infinite">無限模式</option>
                </select>
                <input type="text" id="boardSearch" placeholder="搜尋名字…" aria-label="搜尋名字" />
                <span class="spacer"></span>
                <button type="button" class="btn danger" id="boardDelete" disabled>刪除所選</button>
                <button type="button" class="btn sm" id="boardRefresh">重新載入</button>
              </div>
              <div class="board-scroll">
                <table class="board">
                  <thead>
                    <tr>
                      <th><input type="checkbox" id="boardAll" aria-label="全選" /></th>
                      <th>日期</th>
                      <th>名字</th>
                      <th>模式</th>
                      <th class="num">成績</th>
                      <th class="num">準確率</th>
                      <th class="num">用時</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody id="boardBody"><tr><td colspan="8" class="empty">載入中…</td></tr></tbody>
                </table>
              </div>
              <p class="admin-sub" id="boardCount" style="margin-top: 0.8rem;"></p>
            </section>

            <!-- ======== 問答遊戲（主持） ======== -->
            <section id="tab-kahoot" role="tabpanel" class="hidden">
              <!-- 建立 -->
              <div class="card" id="kSetup">
                <h2>開新遊戲</h2>
                <div class="form-grid">
                  <label class="field"><span>題庫</span>
                    <select id="kBank">
                      <option value="guoqing">全民國情（2159 題）</option>
                      <option value="nschallenge">國家安全挑戰賽（354 題）</option>
                    </select>
                  </label>
                  <label class="field"><span>題數</span>
                    <select id="kCount"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="15">15 題</option><option value="20">20 題</option></select>
                  </label>
                  <label class="field"><span>每題時限</span>
                    <select id="kTime"><option value="10">10 秒</option><option value="20" selected>20 秒</option><option value="30">30 秒</option></select>
                  </label>
                </div>
                <p class="form-msg" id="kMsg" role="status"></p>
                <button type="button" class="btn primary" id="kCreate">建立遊戲</button>
              </div>

              <!-- 大廳 -->
              <div class="card" id="kLobby" style="display:none;">
                <h2>等待玩家加入</h2>
                <div class="k-pin-row">
                  <div>
                    <div class="k-pin" id="kPin">------</div>
                    <p class="admin-sub">玩家到 <strong id="kUrl"></strong> 輸入遊戲碼加入</p>
                  </div>
                </div>
                <div class="k-chips" id="kPlayers"></div>
                <p class="admin-sub" id="kCount2" style="margin:0.6rem 0 1rem;"></p>
                <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
                  <button type="button" class="btn primary" id="kStart">開始遊戲</button>
                  <button type="button" class="btn danger" id="kCancel">取消遊戲</button>
                </div>
              </div>

              <!-- 進行中 -->
              <div class="card" id="kLive" style="display:none;">
                <div class="k-live-top">
                  <span class="q-num" id="kIdx"></span>
                  <span class="q-num" id="kAnswered"></span>
                </div>
                <div class="timer-track" style="margin-bottom:1rem;"><div class="timer-fill" id="kTimerFill"></div></div>
                <p class="k-qtext" id="kQ"></p>
                <div id="kOptions" style="display:flex; flex-direction:column; gap:0.55rem; margin-bottom:1.2rem;"></div>
                <p class="admin-sub" id="kHint" style="margin-bottom:0.9rem;"></p>
                <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
                  <button type="button" class="btn primary" id="kNext">繼續</button>
                  <button type="button" class="btn danger" id="kEnd">結束遊戲</button>
                </div>
                <p class="form-msg" id="kLiveMsg"></p>
              </div>
            </section>
          </div>
        </div>
      </main>

      <footer class="bg-purple-deep"><div class="mx-auto max-w-6xl px-4 py-10 sm:px-6"><p class="text-sm text-muted" style="margin: 0;">版權所有 © 2026 LSCAGKT · 喇沙書院學術時事及常識問答隊</p></div></footer>
    </div>

    <script>
      (function () {
        "use strict";

        var $ = function (id) { return document.getElementById(id); };

        /* ===================== 資源管理 ===================== */
        var pdfRows = [];

        /* ---- PDF 自動分析（pdf.js 動態載入） ---- */
        var PDFJS_BASE = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
        var pdfjsPromise = null;
        function loadPdfJs() {
          if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
          if (pdfjsPromise) return pdfjsPromise;
          pdfjsPromise = new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = PDFJS_BASE + "pdf.min.js";
            s.onload = function () {
              try {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE + "pdf.worker.min.js";
                resolve(window.pdfjsLib);
              } catch (e) { pdfjsPromise = null; reject(e); }
            };
            s.onerror = function () { pdfjsPromise = null; reject(new Error("無法載入 PDF 解析元件，請檢查網絡。")); };
            document.head.appendChild(s);
          });
          return pdfjsPromise;
        }

        function fileToArrayBuffer(file) {
          return new Promise(function (resolve, reject) {
            var r = new FileReader();
            r.onload = function () { resolve(r.result); };
            r.onerror = function () { reject(new Error("讀取檔案失敗。")); };
            r.readAsArrayBuffer(file);
          });
        }

        function analyzeData(buf) {
          return loadPdfJs().then(function (pdfjsLib) {
            return pdfjsLib.getDocument({ data: buf }).promise.then(function (pdf) {
              var probes = [1, 2].filter(function (n) { return n <= pdf.numPages; });
              var textP = Promise.all(probes.map(function (n) {
                return pdf.getPage(n).then(function (p) { return p.getTextContent(); }).then(function (tc) {
                  return tc.items.map(function (it) { return it.str; }).join(" ");
                });
              }));
              var outlineP = pdf.getOutline().catch(function () { return null; });
              return Promise.all([textP, outlineP]).then(function (arr) {
                return pdf.getMetadata().catch(function () { return null; }).then(function (m) {
                  return { pages: pdf.numPages, text: arr[0].join(" "), outline: arr[1] || [], meta: m && m.info };
                });
              });
            });
          });
        }

        function buildSuggestions(res, fallbackDateMs) {
          var clean = String(res.text || "").replace(/\s+/g, " ").trim();

          var qMatch = clean.match(/([0-9０-９][0-9０-９,，]*)\s*(?:道)?題/);
          var catFromText = clean.match(/([0-9０-９][0-9０-９,，]*)\s*個(?:分類|類別|部分)/);

          // 書籤（目錄）→ 分類數
          var topTitles = (res.outline || [])
            .map(function (o) { return o && o.title ? String(o.title).replace(/\s+/g, "").trim() : ""; })
            .filter(function (t) { return t && t.length <= 16; });
          var useOutline = topTitles.length >= 2;

          var parts = [];
          if (qMatch) parts.push(qMatch[1].replace(/[,，]/g, "") + " 題");
          if (useOutline) parts.push(topTitles.length + " 個分類");
          else if (catFromText) parts.push(catFromText[1].replace(/[,，]/g, "") + " 個分類");

          // 製作日期：優先 PDF 元資料的建立日期，退回檔案修改日期
          var made = "";
          var cm = res.meta && res.meta.CreationDate ? String(res.meta.CreationDate).match(/D:(\d{4})(\d{2})(\d{2})/) : null;
          if (cm) made = cm[1] + "-" + cm[2] + "-" + cm[3];
          if (!made && fallbackDateMs) {
            var d = new Date(fallbackDateMs);
            made = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
          }
          if (made) parts.push("製作日期 " + made);

          var t = res.meta && res.meta.Title ? String(res.meta.Title).trim() : "";
          var title = t && t.length >= 4 && t.length <= 120 ? t : "";
          return { pages: res.pages + " 頁", desc: parts.join(" · "), title: title };
        }

        function fmtSize(b) {
          if (!b && b !== 0) return "—";
          if (b < 1024 * 1024) return (b / 1024).toFixed(0) + " KB";
          return (b / 1024 / 1024).toFixed(1) + " MB";
        }
        function fmtDate(iso) { return iso ? String(iso).slice(0, 10) : "—"; }

        function loadPdfs() {
          $("pdfList").innerHTML = '<div class="empty">載入中…</div>';

          if (btn.dataset.act === "gen") {

            fetch(SB_URL + "/storage/v1/object/public/pdfs/" + row.storage_path)
              .then(function (r) { if (!r.ok) throw new Error("無法取得檔案。"); return r.arrayBuffer(); })
              .then(analyzeData)

        /* ---- 上傳 ---- */

        function putFile(uploadUrl, file, onProgress) {
          return new Promise(function (resolve, reject) {
            var xhr = new XMLHttpRequest();
            xhr.open("PUT", uploadUrl);
            xhr.setRequestHeader("Content-Type", "application/pdf");
            xhr.upload.onprogress = function (e) { if (e.lengthComputable) onProgress(e.loaded / e.total); };
            xhr.onload = function () {
              if (xhr.status >= 200 && xhr.status < 300) resolve();
              else reject(new Error("上傳失敗（" + xhr.status + "）"));
            };
            xhr.onerror = function () { reject(new Error("網絡錯誤，請重試。")); };
            xhr.send(file);
          });
        }

        function pad2(n) { return String(n).padStart(2, "0"); }
        function fmtBoardDate(iso) {
          if (!iso) return "—";
          var d = new Date(iso);
          return pad2(d.getDate()) + "." + pad2(d.getMonth() + 1) + "." + String(d.getFullYear()).slice(2) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
        }

        function boardFiltered() {
          var mode = $("boardMode").value;
          var q = $("boardSearch").value.trim().toLowerCase();
          return boardRows.filter(function (r) {
            if (mode === "sprint" && r.mode !== "sprint") return false;
            if (mode === "infinite" && r.mode === "sprint") return false;
            if (q && String(r.name || "").toLowerCase().indexOf(q) === -1) return false;
            return true;
          });
        }

        function renderBoard() {
          var rows = boardFiltered();
          var body = $("boardBody");
          $("boardCount").textContent = "共 " + rows.length + " 筆記錄" + (boardRows.length !== rows.length ? "（總庫存 " + boardRows.length + " 筆）" : "");
          if (!rows.length) {
            body.innerHTML = '<tr><td colspan="8" class="empty">沒有符合的記錄。</td></tr>';
            updateDeleteBtn();
            return;
          }
          body.innerHTML = rows.map(function (r) {
            var sprint = r.mode === "sprint";
            var scoreText = sprint ? r.score + " 分" : r.score + " / " + (r.total == null ? "—" : r.total);
            var acc = r.accuracy != null ? Math.round(r.accuracy * 100) + "%" : "—";
            var time = r.time_taken != null ? Math.floor(r.time_taken / 60) + ":" + pad2(r.time_taken % 60) : "—";
            return "<tr data-id=\"" + esc(r.id) + "\">" +
              '<td><input type="checkbox" data-check="' + esc(r.id) + '"' + (selected[r.id] ? " checked" : "") + ' aria-label="選擇此記錄" /></td>' +

              '<td class="num">' + acc + "</td>" +
              '<td class="num">' + time + "</td>" +

        /* ===================== 問答競技場（主持） ===================== */
        // 遊戲端點位於 /api/game/*（非 /api/admin/*），需獨立呼叫
        function gameApi(path, method, body) {
          return fetch("/api/game/" + path, {
            method: method || "GET",
            headers: { "Content-Type": "application/json", "x-admin-user": getUser(), "x-admin-pass": getPass() },
            body: body ? JSON.stringify(body) : undefined
          }).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
              if (res.status === 401) { logout(); throw new Error("密碼不正確或已登出。"); }
              if (!res.ok) throw new Error(data.error || "請求失敗（" + res.status + "）");
              return data;
            });
          });
        }

        var K = { pin: null, poll: null, tick: null, last: null, busy: false };

        function kMsg(el, text, cls) { var e = $(el); e.textContent = text || ""; e.className = "form-msg" + (cls ? " " + cls : ""); }

        function loadBank(name) {
          return new Promise(function (resolve, reject) {
            var win = window;
            if (name === "guoqing" && win.GQ_QUESTION_BANK) return resolve(win.GQ_QUESTION_BANK);
            if (name === "nschallenge" && win.NS_QUESTION_BANK) return resolve(win.NS_QUESTION_BANK);
            var s = document.createElement("script");
            s.src = "/competition/" + (name === "guoqing" ? "guoqing.js" : "nschallenge.js");
            s.onload = function () {
              var b = name === "guoqing" ? win.GQ_QUESTION_BANK : win.NS_QUESTION_BANK;
              b && b.length ? resolve(b) : reject(new Error("題庫為空"));
            };
            s.onerror = function () { reject(new Error("題庫載入失敗。")); };
            document.head.appendChild(s);
          });
        }

        function kShow(which) {
          ["kSetup", "kLobby", "kLive"].forEach(function (id) { $(id).style.display = id === which ? "block" : "none"; });
        }

        $("kCreate").addEventListener("click", function () {
          var btn = this;
          if (btn.disabled) return;
          btn.disabled = true;
          kMsg("kMsg", "載入題庫…");
          var bank = $("kBank").value;
          var count = Number($("kCount").value);
          var timeLimit = Number($("kTime").value);
          loadBank(bank).then(function (bankArr) {
            kMsg("kMsg", "抽選題目…");
            // Fisher–Yates 抽題
            var idx = bankArr.map(function (_, i) { return i; });
            for (var i = idx.length - 1; i > 0; i--) {
              var j = Math.floor(Math.random() * (i + 1));
              var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
            }
            var qs = idx.slice(0, count).map(function (i) {
              var e = bankArr[i];
              return { q: e.q, options: e.options, c: e.c };
            });
            return gameApi("create", "POST", { bank: bank, count: count, timeLimit: timeLimit, questions: qs });
          }).then(function (d) {
            K.pin = d.pin;
            $("kPin").textContent = d.pin;
            $("kUrl").textContent = location.origin + "/play";
            kShow("kLobby");
            kStartPoll();
          }).catch(function (err) {
            kMsg("kMsg", err.message || "建立失敗。", "err");
          }).finally(function () { btn.disabled = false; });
        });

        function kStartPoll() {
          kStopPoll();
          K.poll = setInterval(kPoll, 1000);
          kPoll();
        }
        function kStopPoll() {
          if (K.poll) { clearInterval(K.poll); K.poll = null; }
          if (K.tick) { clearInterval(K.tick); K.tick = null; }
        }

        function kPoll() {
          if (K.busy || !K.pin) return;
          K.busy = true;
          gameApi("host?pin=" + encodeURIComponent(K.pin))
            .then(function (d) { K.last = d; kRender(d); })
            .catch(function (err) { kMsg("kLiveMsg", err.message || "", "err"); })
            .finally(function () { K.busy = false; });
        }

        var OPT_CLS = ["o-red", "o-gold", "o-plum", "o-green"];

        function kRender(d) {
          if (d.status === "lobby") {
            kShow("kLobby");
            $("kPlayers").innerHTML = (d.players || []).map(function (n) { return '<span class="chip">' + esc(n) + "</span>"; }).join("");
            $("kCount2").textContent = "已加入 " + (d.players || []).length + " 位玩家";
            return;
          }
          kShow("kLive");
          $("kIdx").textContent = d.status === "ended" ? "遊戲結束" : "第 " + (d.index + 1) + " / " + d.total + " 題";
          $("kAnswered").textContent = d.status === "question" ? "已作答 " + (d.answered || 0) + " / " + (d.playerCount || 0) : "";
          $("kTimerFill").style.width = "0";

          if (d.status === "question") {
            $("kQ").textContent = d.q || "";
            $("kOptions").innerHTML = (d.options || []).map(function (o, i) {
              return '<div class="k-opt ' + (OPT_CLS[i] || "o-plum") + '"><span class="bar" style="width:0;"></span><span class="lab">' + esc(o) + "</span></div>";
            }).join("");
            $("kHint").textContent = "玩家作答中，時間到後自動揭曉。";
            $("kNext").textContent = "提前揭曉";
            $("kNext").style.display = "";
            kTicker(d);
          } else if (d.status === "reveal") {
            stopTickerK();
            $("kQ").textContent = d.q || "";
            var max = Math.max.apply(null, (d.counts || [0]).concat([1]));
            $("kOptions").innerHTML = (d.options || []).map(function (o, i) {
              var c = (d.counts || [])[i] || 0;
              var cls = "k-opt " + (OPT_CLS[i] || "o-plum") + (i === d.correct ? " correct" : "");
              return '<div class="' + cls + '"><span class="bar" style="width:' + Math.round(c / max * 100) + '%;"></span>' +
                '<span class="lab">' + esc(o) + "</span><span class=\"cnt\">" + c + "</span></div>";
            }).join("");
            $("kHint").textContent = "分佈已公佈。";
            $("kNext").textContent = "顯示排行榜";
            $("kNext").style.display = "";
          } else if (d.status === "board") {
            stopTickerK();
            $("kQ").textContent = "目前排行";
            $("kOptions").innerHTML = (d.standings || []).slice(0, 10).map(function (p, i) {
              return '<div class="board-row"><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(p.name) + '</span><span class="sc">' + p.score + "</span></div>";
            }).join("");
            var last = d.index + 1 >= d.total;
            $("kHint").textContent = last ? "這是最後一題。" : "按「下一題」繼續。";
            $("kNext").textContent = last ? "查看最終結果" : "下一題";
            $("kNext").style.display = "";
          } else if (d.status === "ended") {
            stopTickerK();
            $("kQ").textContent = "最終排名";
            $("kOptions").innerHTML = (d.standings || []).slice(0, 10).map(function (p, i) {
              return '<div class="board-row"><span class="rk">' + (i + 1) + '</span><span class="nm">' + esc(p.name) + '</span><span class="sc">' + p.score + "</span></div>";
            }).join("");
            $("kHint").textContent = "玩家裝置已顯示頒獎台。";
            $("kNext").textContent = "關閉遊戲";
            $("kNext").style.display = "";
          }
        }

        function kTicker(d) {
          stopTickerK();
          if (d.status !== "question" || !d.endsAt) return;
          var ends = Date.parse(d.endsAt) - (Date.parse(d.now) - Date.now());
          K.tick = setInterval(function () {
            var fill = $("kTimerFill");
            if (!fill || !K.last || K.last.status !== "question") { stopTickerK(); return; }
            var pct = Math.max(0, Math.min(100, (ends - Date.now()) / (d.timeLimit * 1000) * 100));
            fill.style.width = pct + "%";
            if (pct < 25) fill.classList.add("low");
            if (pct <= 0) stopTickerK();
          }, 300);
        }
        function stopTickerK() { if (K.tick) { clearInterval(K.tick); K.tick = null; } }

        function kReset() {
          kStopPoll();
          K.pin = null; K.last = null;
          kShow("kSetup");
          kMsg("kMsg", "");
        }

        $("kStart").addEventListener("click", function () {
          var btn = this;
          btn.disabled = true;
          gameApi("control", "POST", { pin: K.pin, action: "start" })
            .then(kPoll)
            .catch(function (err) { kMsg("kLiveMsg", err.message || "操作失敗。", "err"); })
            .finally(function () { btn.disabled = false; });
        });

        $("kNext").addEventListener("click", function () {
          var btn = this;
          var d = K.last;
          if (!d) return;
          var action = d.status === "question" ? "reveal" : d.status === "reveal" ? "next" : d.status === "board" ? "go" : "cancel";
          btn.disabled = true;
          gameApi("control", "POST", { pin: K.pin, action: action })
            .then(function () { if (action === "cancel") kReset(); else kPoll(); })
            .catch(function (err) { kMsg("kLiveMsg", err.message || "操作失敗。", "err"); })
            .finally(function () { btn.disabled = false; });
        });
        $("kEnd").addEventListener("click", function () {
          if (!confirm("確定結束遊戲？")) return;
          gameApi("control", "POST", { pin: K.pin, action: "end" }).then(kPoll)
            .catch(function (err) { kMsg("kLiveMsg", err.message || "操作失敗。", "err"); });
        });
        $("kCancel").addEventListener("click", function () {
          if (!confirm("確定取消遊戲？所有玩家會被移除。")) return;
          gameApi("control", "POST", { pin: K.pin, action: "cancel" })
            .then(kReset)
            .catch(function (err) { kMsg("kLiveMsg", err.message || "操作失敗。", "err"); });
        });

        /* ===================== 啟動 ===================== */
        if (getPass() && getUser()) {
          // 已有帳密：靜默驗證
          fetch("/api/admin/verify", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-user": getUser(), "x-admin-pass": getPass() } })
            .then(function (res) { if (res.ok) showPanel(); else logout(); })
            .catch(function () {});
        }
      })();
    </script>
  </body>
</html>
