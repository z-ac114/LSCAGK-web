    <style>
      /* ---- 資源庫 ---- */
      .res-section-title {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--purple);
        margin: 0;
      }
      .dark-mode .res-section-title {
        color: #e8c979;
      }
      .res-section-note {
        color: var(--muted);
        font-size: 0.88rem;
        margin: 0.2rem 0 0;
      }
      .res-grid {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        margin-top: 1.4rem;
      }
      .res-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        width: 100%;
        padding: 1.3rem 1.3rem 1.2rem;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        cursor: pointer;
        font: inherit;
        color: var(--ink);
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: transform 160ms ease, border-color 160ms ease;
      }
      @media (hover: hover) {
.res-card:hover {
          border-color: var(--hairline-strong);
        }
      }
      .res-card:focus-visible {
        outline: 3px solid var(--school-gold);
        outline-offset: 2px;
      }
      .res-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }
      .res-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: var(--rose-soft);
        color: var(--lasalle-red-dark);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .dark-mode .res-badge {
        background: rgb(224 82 74 / 14%);
        color: #f28779;
      }
      .res-badge.extra {
        background: var(--gold-soft, #efe4c8);
        color: #7a5c14;
      }
      .dark-mode .res-badge.extra {
        background: rgb(226 187 98 / 16%);
        color: #e2bb62;
      }
      .res-lock {
        color: var(--muted);
        opacity: 0.75;
      }
      .res-title {
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--purple);
        margin: 0;
        line-height: 1.45;
      }
      .dark-mode .res-title {
        color: #e8c979;
      }
      .res-desc {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.7;
      }
      .res-meta {
        margin-top: auto;
        padding-top: 0.65rem;
        border-top: 1px solid var(--hairline);
        display: flex;
        gap: 0.9rem;
        color: var(--muted);
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
      }
      .res-hint {
        margin-top: 1.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .res-hint svg {
        vertical-align: -2px;
        margin-right: 4px;
      }

      /* ---- Drive 式懸停預覽（只於桌面裝置） ---- */
      .res-preview {
        position: fixed;
        z-index: 95;
        width: 284px;
        padding: 0.8rem;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 16px;
        box-shadow: var(--shadow-popover);
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 160ms ease, transform 160ms ease;
        pointer-events: none;
        display: none;
      }
      .res-preview.show {
        display: block;
      }
      .res-preview.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .res-preview-img {
        display: block;
        width: 100%;
        height: 300px;
        object-fit: contain;
        object-position: top center;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: #f6f5f8;
      }
      .dark-mode .res-preview-img {
        background: #262230;
      }
      .res-preview-title {
        margin: 0.6rem 0 0;
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--purple);
        line-height: 1.4;
      }
      .dark-mode .res-preview-title {
        color: #e8c979;
      }
      .res-preview-meta {
        margin-top: 0.25rem;
        color: var(--muted);
        font-size: 0.78rem;
      }
      @media (hover: none) {
        .res-preview {
          display: none !important;
        }
      }

      /* ---- 閱覽器（全頁覆蓋） ---- */
      .viewer {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: none;
        flex-direction: column;
        background: rgb(20 14 30 / 72%);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      }
      .viewer.open {
        display: flex;
      }
      .viewer-sheet {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow-popover);
      }
      .viewer-bar {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.65rem 0.9rem;
        border-bottom: 1px solid var(--hairline);
        background: var(--surface);
      }
      .viewer-title {
        flex: 1;
        min-width: 0;
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-weight: 700;
        color: var(--purple);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.95rem;
      }
      .dark-mode .viewer-title {
        color: #e8c979;
      }
      .viewer-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 2.4rem;
        padding: 0 0.95rem;
        border-radius: 9999px;
        border: 1px solid var(--hairline);
        background: var(--surface);
        color: var(--ink);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: border-color 150ms ease, background 150ms ease;
        text-decoration: none;
      }
      .viewer-btn:hover {
        border-color: var(--purple);
      }
      .viewer-btn.primary {
        background: var(--red);
        border-color: var(--red);
        color: #ffffff;
      }
      .viewer-btn.primary:hover {
        background: var(--lasalle-red-dark);
        border-color: var(--lasalle-red-dark);
      }
      .viewer-frame {
        flex: 1;
        min-height: 0;
        width: 100%;
        border: 0;
        background: #525659;
      }
      @media (max-width: 640px) {
        .viewer {
          padding: 0.5rem;
        }
        .viewer-btn span.label {
          display: none;
        }
        .viewer-btn {
          padding: 0 0.75rem;
        }
      }
    </style>

    <!-- 懸停預覽（Drive 式） -->

    <!-- PDF 閱覽器 -->
    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="資料閱覽器">

    <script>
      (function () {
        "use strict";

        /* ===================== 資源清單 =====================
           新增 PDF：
           1. 把檔案放入 /assets/
           2.（建議）用 macOS 產生首頁縮圖：
              qlmanage -t -s 720 -o assets/thumbs "assets/你的檔案.pdf"
              並改名為簡短英文名，例如 assets/thumbs/my-notes.png
           3. 在下面加一項（extra: true 會歸入「延伸資料」） */
        var RESOURCES = [
          {
            title: "全港學界國家安全常識挑戰賽 2026-27 參考資料",
            desc: "354 題 · 17 個分類，涵蓋憲法、基本法、國安法、國安相關法律與總體國家安全觀。",
            file: "/assets/國家安全挑戰賽(2627)-v2.pdf",
            tag: "競賽資料",
            date: "2026-11-11",
            size: "5.1 MB",
            pages: "28 頁",
            thumb: "/assets/thumbs/ns-v2.png"
          },
          {
            title: "國家安全挑戰賽 — 法例出處與原文",
            desc: "354 題逐題附法例出處與原文引錄，對應競賽題庫。",
            file: "/assets/國家安全挑戰賽(2627)-法例出處-v3.pdf",
            tag: "競賽資料",
            date: "2026-11-11",
            size: "8.9 MB",
            pages: "60 頁",
            thumb: "/assets/thumbs/faliu-v3.png"
          },
          {
            title: "第二十六屆基本法問答比賽參考資料",
            desc: "190 題 · 7 個分類，基本法及國民常識網上問答比賽溫習材料。",
            file: "/assets/第二十六屆基本法問答比賽參考資料-v6.pdf",
            tag: "競賽資料",
            date: "2026-11-02",
            size: "2.5 MB",
            pages: "16 頁",
            thumb: "/assets/thumbs/blq-v6.png"
          },
          {
            title: "第五屆「全民國情」知識大賽參考資料",
            desc: "2201 題 · 9 個分類，全民國情知識大賽完整溫習材料。",
            file: "/assets/第五屆「全民國情」參考資料-v24.pdf",
            tag: "競賽資料",
            date: "2026-11-10",
            size: "22.9 MB",
            pages: "151 頁",
            thumb: "/assets/thumbs/kuoqing-v24.png"
          },
          {
            title: "化學筆記：氧化還原與電解",
            desc: "Redox & Electrolysis 個人研習筆記（11 個章節）。",
            file: "/assets/Chemistry Notes (Redox & Electrolysis)-v1.pdf",
            tag: "化學",
            date: "2026-11-03",
            size: "1.3 MB",
            pages: "15 頁",
            thumb: "/assets/thumbs/chem-v1.png",
            extra: true
          }
        ];

        var PASSWORD = "agk2627";
        var SESSION_KEY = "agkResourcesUnlocked";

        /* 雲端資源（由管理後台上傳，存於 Supabase）
           - 資料表 pdfs 開放公開讀取；檔案存於 Storage bucket「pdfs」 */
        var SUPABASE_URL = "https://oajvxavzsomymqunpgxx.supabase.co";
        var SUPABASE_ANON_KEY = "sb_publishable_L8QCQotDAIP-Fzm8r5IIWQ_U17i-eFy";
        var cloudResources = [];

        function fmtCloudSize(b) {
          if (!b && b !== 0) return "PDF";
          if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + " KB";
          return (b / 1024 / 1024).toFixed(1) + " MB";
        }

        function loadCloud() {
          if (typeof fetch !== "function") return;
          fetch(SUPABASE_URL + "/rest/v1/pdfs?select=*&order=created_at.desc", {
            headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY }
          })
            .then(function (r) { return r.ok ? r.json() : []; })
            .then(function (rows) {
              cloudResources = (rows || []).map(function (r) {
                return {
                  id: r.id,
                  title: r.title,
                  desc: r.description || "",
                  tag: r.tag || "資料",
                  file: SUPABASE_URL + "/storage/v1/object/public/pdfs/" + r.storage_path,
                  date: r.created_at ? String(r.created_at).slice(0, 10) : "",
                  size: fmtCloudSize(r.file_size),
                  pages: r.pages || "PDF",
                  thumb: null,
                  extra: !!r.extra
                };
              });
              render();
            })
            .catch(function () { /* 雲端資源載入失敗時仍顯示靜態清單 */ });
        }

        var $ = function (id) { return document.getElementById(id); };
        var grid = $("resGrid");
        var gridExtra = $("resGridExtra");
        var viewer = $("viewer");
        var currentIndex = -1;
        var preview = $("resPreview");
        var hideTimer = null;
        var showTimer = null;
        var lastFocus = null;

        function unlocked() {
          try {
            return sessionStorage.getItem(SESSION_KEY) === "1";
          } catch (e) {
            return false;
          }
        }

        function requestUnlock() {
          if (unlocked()) return true;
          var input = window.prompt("此資源受密碼保護，請輸入密碼：");
          if (input === null) return false;
          if (input === PASSWORD) {
            try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (e) { /* 私密模式 */ }
            return true;
          }
          window.alert("密碼不正確。");
          return false;
        }

        function openViewer(item, card) {
          $("viewerTitle").textContent = item.title;
          $("viewerNewTab").href = item.file;
          $("viewerDownload").href = item.file;
          // #view=FitH：進入時縮放至適寬；原生瀏覽器 PDF 檢視器負責渲染（快速、零依賴）
          $("viewerFrame").src = item.file + "#view=FitH";
          lastFocus = document.activeElement;
          hidePreview();
          document.body.style.overflow = "hidden";
          // Shared Element Transition：閱覽器從卡片morph展開
          if (card && document.startViewTransition) {
            card.style.viewTransitionName = "pdf-card";
            var vt = document.startViewTransition(function () {
              viewer.classList.add("open");
            });
            vt.finished.finally(function () { card.style.viewTransitionName = ""; });
          } else {
            viewer.classList.add("open");
          }
          $("viewerClose").focus();
        }

        function closeViewer() {
          var done = function () {
            viewer.classList.remove("open");
            $("viewerFrame").src = "about:blank";
            document.body.style.overflow = "";
            if (lastFocus && lastFocus.focus) lastFocus.focus();
          };
          // 反向morph：閱覽器縮回卡片
          var openCard = document.querySelector('.res-card[data-index="' + currentIndex + '"]');
          if (document.startViewTransition && openCard) {
            openCard.style.viewTransitionName = "pdf-card";
            var vt = document.startViewTransition(done);
            vt.finished.finally(function () { openCard.style.viewTransitionName = ""; });
          } else {
            done();
          }
        }

        /* ===================== Drive 式懸停預覽 ===================== */
        var canHover = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;

        function showPreview(item, card) {
          if (!item.thumb) return;
          var img = $("previewImg");
          if (!img.getAttribute("src") || img.dataset.file !== item.file) {
            img.src = item.thumb;
            img.dataset.file = item.file;
          }
          img.alt = item.title + " 首頁預覽";
          $("previewTitle").textContent = item.title;
          $("previewMeta").textContent = item.pages + " · " + item.size + " · " + item.date;
          preview.classList.add("show");
          // 定位：先放卡片旁，再依面板實際尺寸夾回視窗內
          preview.style.left = "0px";
          preview.style.top = "0px";
          var rect = card.getBoundingClientRect();
          var pw = preview.offsetWidth;
          var ph = preview.offsetHeight;
          var vw = window.innerWidth;
          var vh = window.innerHeight;
          var left = rect.right + 14;
          if (left + pw > vw - 10) left = rect.left - pw - 14;
          if (left < 10) left = Math.min(Math.max(10, vw - pw - 10), Math.max(10, rect.left));
          var top = rect.top + rect.height / 2 - ph / 2;
          top = Math.min(Math.max(10, top), vh - ph - 10);
          preview.style.left = left + "px";
          preview.style.top = top + "px";
          requestAnimationFrame(function () {
            preview.classList.add("visible");
          });
        }

        function hidePreview() {
          if (showTimer) { clearTimeout(showTimer); showTimer = null; }
          preview.classList.remove("visible");
          preview.classList.remove("show");
        }

        function bindPreview(card, item) {
          card.addEventListener("mouseenter", function () {
            if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
            if (showTimer) clearTimeout(showTimer);
            showTimer = setTimeout(function () {
              if (!viewer.classList.contains("open")) showPreview(item, card);
            }, 300);
          });
          card.addEventListener("mouseleave", function () {
            if (showTimer) { clearTimeout(showTimer); showTimer = null; }
            hideTimer = setTimeout(hidePreview, 80);
          });
        }

        /* ===================== 渲染 ===================== */
        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&" + "amp;")
            .replace(/</g, "&" + "lt;")
            .replace(/>/g, "&" + "gt;")
            .replace(/"/g, "&" + "quot;");
        }

        function cardHtml(item, index) {
          var badgeClass = item.extra ? "res-badge extra" : "res-badge";
          return (
            '<button type="button" class="res-card reveal" style="--reveal-delay:' + Math.min((index % 6) * 60, 300) + 'ms" data-index="' + index + '" data-extra="' + (item.extra ? "1" : "0") + '" aria-label="開啟「' + esc(item.title) + '（需密碼）">' +
              '<div class="res-top">' +
                '<span class="' + badgeClass + '">PDF · ' + esc(item.tag) + "</span>" +
                '<span class="res-lock" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>' +
              "</div>" +
              '<h3 class="res-title">' + esc(item.title) + "</h3>" +
              '<p class="res-desc">' + esc(item.desc) + "</p>" +
              '<div class="res-meta"><span>' + esc(item.pages || "PDF") + "</span><span>" + esc(item.size) + "</span><span>" + esc(item.date) + "</span></div>" +
            "</button>"
          );
        }

        var ALL = [];

        function render() {
          ALL = cloudResources.concat(RESOURCES);
          var mainHtml = "";
          var extraHtml = "";
          ALL.forEach(function (item, i) {
            if (item.extra) extraHtml += cardHtml(item, i);
            else mainHtml += cardHtml(item, i);
          });
          grid.innerHTML = mainHtml;
          gridExtra.innerHTML = extraHtml;
        }

        function onGridClick(e) {
          var card = e.target && e.target.closest ? e.target.closest(".res-card") : null;
          if (!card) return;
          var index = Number(card.dataset.index);
          var item = ALL[index];
          if (!item) return;
          currentIndex = index;
          if (requestUnlock()) openViewer(item, card);
        }

        grid.addEventListener("click", onGridClick);
        gridExtra.addEventListener("click", onGridClick);

        if (canHover) {
          [grid, gridExtra].forEach(function (g) {
            g.addEventListener("mouseover", function (e) {
              var card = e.target && e.target.closest ? e.target.closest(".res-card") : null;
              if (!card) return;
              var item = ALL[Number(card.dataset.index)];
              if (item && item.thumb) bindPreview(card, item);
            });
          });
          document.addEventListener("scroll", hidePreview, { passive: true });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") hidePreview();
          });
        }

        $("viewerClose").addEventListener("click", closeViewer);
        viewer.addEventListener("click", function (e) {
          if (e.target === viewer) closeViewer();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && viewer.classList.contains("open")) closeViewer();
        });

        render();
        loadCloud();
      })();
    </script>
  </body>
</html>
