<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>html{background:#faf9f5}html.dark-mode{background:#181715}</style>

<link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" />
    <title>資源庫 | LSCAGKT</title>
    <meta name="description" content="LSCAGKT 資源庫：集中存放筆記、歷屆試題與溫習資料，密碼保護，可在網頁內直接閱覽。" />
    <style>
      /* ---- 資源庫 ---- */
      .res-section-title {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--purple);
        margin: 0;
      }
      .dark-mode .res-section-title {
        color: #e3c6dc;
      }
      .res-section-note {
        color: var(--muted);
        font-size: 0.88rem;
        margin: 0.2rem 0 0;
      }
      .res-grid {
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        margin-top: 1.4rem;
      }
      .res-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        width: 100%;
        padding: 1.3rem 1.3rem 1.2rem;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        cursor: pointer;
        font: inherit;
        color: var(--ink);
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: transform 160ms ease, border-color 160ms ease;
      }
      @media (hover: hover) {
.res-card:hover {
          border-color: var(--hairline-strong);
        }
      }
      .res-card:focus-visible {
        outline: 3px solid var(--school-gold);
        outline-offset: 2px;
      }
      .res-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.6rem;
      }
      .res-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: var(--rose-soft);
        color: var(--lasalle-red-dark);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .dark-mode .res-badge {
        background: rgb(224 82 74 / 14%);
        color: #f28779;
      }
      .res-badge.extra {
        background: var(--gold-soft, #efe4c8);
        color: #7a5c14;
      }
      .dark-mode .res-badge.extra {
        background: rgb(226 187 98 / 16%);
        color: #e2bb62;
      }
      .res-lock {
        color: var(--muted);
        opacity: 0.75;
      }
      .res-title {
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--purple);
        margin: 0;
        line-height: 1.45;
      }
      .dark-mode .res-title {
        color: #e3c6dc;
      }
      .res-desc {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.7;
      }
      .res-meta {
        margin-top: auto;
        padding-top: 0.65rem;
        border-top: 1px solid var(--hairline);
        display: flex;
        gap: 0.9rem;
        color: var(--muted);
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
      }
      .res-hint {
        margin-top: 1.5rem;
        text-align: center;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .res-hint svg {
        vertical-align: -2px;
        margin-right: 4px;
      }

      /* ---- Drive 式懸停預覽（只於桌面裝置） ---- */
      .res-preview {
        position: fixed;
        z-index: 95;
        width: 284px;
        padding: 0.8rem;
        background: var(--surface);
        border: 1px solid var(--hairline);
        border-radius: 16px;
        box-shadow: var(--shadow-popover);
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 160ms ease, transform 160ms ease;
        pointer-events: none;
        display: none;
      }
      .res-preview.show {
        display: block;
      }
      .res-preview.visible {
        opacity: 1;
        transform: translateY(0);
      }
      .res-preview-img {
        display: block;
        width: 100%;
        height: 300px;
        object-fit: contain;
        object-position: top center;
        border: 1px solid var(--hairline);
        border-radius: 10px;
        background: #efe9de;
      }
      .dark-mode .res-preview-img {
        background: #252320;
      }
      .res-preview-title {
        margin: 0.6rem 0 0;
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-size: 0.92rem;
        font-weight: 500;
        color: var(--purple);
        line-height: 1.4;
      }
      .dark-mode .res-preview-title {
        color: #e3c6dc;
      }
      .res-preview-meta {
        margin-top: 0.25rem;
        color: var(--muted);
        font-size: 0.78rem;
      }
      @media (hover: none) {
        .res-preview {
          display: none !important;
        }
      }

      /* ---- 閱覽器（全頁覆蓋） ---- */
      .viewer {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: none;
        flex-direction: column;
        background: rgb(20 14 30 / 72%);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      }
      .viewer.open {
        display: flex;
      }
      .viewer-sheet {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow-popover);
      }
      .viewer-bar {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.65rem 0.9rem;
        border-bottom: 1px solid var(--hairline);
        background: var(--surface);
      }
      .viewer-title {
        flex: 1;
        min-width: 0;
        font-family: "Noto Serif TC", "Songti TC", serif;
        font-weight: 700;
        color: var(--purple);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.95rem;
      }
      .dark-mode .viewer-title {
        color: #e3c6dc;
      }
      .viewer-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 2.4rem;
        padding: 0 0.95rem;
        border-radius: 9999px;
        border: 1px solid var(--hairline);
        background: var(--surface);
        color: var(--ink);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition: border-color 150ms ease, background 150ms ease;
        text-decoration: none;
      }
      .viewer-btn:hover {
        border-color: var(--purple);
      }
      .viewer-btn.primary {
        background: var(--red);
        border-color: var(--red);
        color: #ffffff;
      }
      .viewer-btn.primary:hover {
        background: var(--lasalle-red-dark);
        border-color: var(--lasalle-red-dark);
      }
      .viewer-frame {
        flex: 1;
        min-height: 0;
        width: 100%;
        border: 0;
        background: #403e39;
      }
      @media (max-width: 640px) {
        .viewer {
          padding: 0.5rem;
        }
        .viewer-btn span.label {
          display: none;
        }
        .viewer-btn {
          padding: 0 0.75rem;
        }
      }

      /* ===== 資源庫密碼閘（伺服器端驗證 + 自訂對話框） ===== */
      .gate-backdrop {
        position: fixed; inset: 0; background: rgb(20 20 19 / 42%);
        display: none; align-items: center; justify-content: center;
        padding: 1rem; z-index: 90;
      }
      .gate-backdrop.show { display: flex; }
      .gate-card {
        width: min(92vw, 380px); background: var(--surface);
        border: 1px solid var(--hairline); border-radius: var(--radius);
        padding: 1.8rem 1.6rem 1.5rem;
        box-shadow: 0 24px 60px rgb(0 0 0 / 24%);
        animation: gatein 240ms cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      @keyframes gatein { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
      .gate-card h2 { font-family: var(--font-serif); font-size: 1.3rem; font-weight: 500; color: var(--purple); margin: 0 0 0.3rem; }
      .dark-mode .gate-card h2 { color: #e3c6dc; }
      .gate-card > p { color: var(--muted); font-size: 0.88rem; margin: 0 0 1.1rem; }
      .gate-card label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--ink); }
      .gate-input {
        width: 100%; box-sizing: border-box; padding: 0.6rem 0.8rem;
        border: 1.5px solid var(--hairline-strong, var(--hairline)); border-radius: 8px;
        background: var(--cream, #faf9f5); color: var(--ink); font: inherit; font-size: 0.95rem;
      }
      .dark-mode .gate-input { background: rgb(255 255 255 / 4%); }
      .gate-input:focus { outline: 2px solid var(--school-gold, #c9a227); outline-offset: 1px; }
      .gate-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
      .gate-btn {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 2.6rem; padding: 0 1.2rem; border-radius: 9999px;
        border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
        font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        transition: border-color 150ms ease, background 150ms ease, transform 120ms ease;
      }
      .gate-btn:hover { border-color: var(--purple); }
      .gate-btn:active { transform: scale(0.98); }
      .gate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .gate-btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
      .gate-btn.primary:hover { background: var(--red-active, #ae0906); border-color: var(--red-active, #ae0906); }
      .gate-err { color: #b3261e; font-size: 0.85rem; min-height: 1.2em; margin: 0.6rem 0 0; }
      .dark-mode .gate-err { color: #f28779; }
      .gate-shake { animation: gateshake 320ms ease; }
      @keyframes gateshake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
      .gate-lock {
        display: none; text-align: center; padding: 3.2rem 1.2rem;
        border: 1.5px dashed var(--hairline-strong, var(--hairline));
        border-radius: var(--radius); margin-bottom: 2.5rem;
      }
      .gate-lock.show { display: block; }
      .gate-lock .gate-lock-icon { color: var(--muted); opacity: 0.7; }
      .gate-lock p { color: var(--muted); font-size: 0.92rem; margin: 0.7rem auto 1.3rem; max-width: 320px; line-height: 1.7; }
      @media (prefers-reduced-motion: reduce) {
        .gate-card, .gate-shake { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-cream text-ink">
      <header class="site-header"><div class="site-header-inner"><a class="brand" href="/"><img class="brand-icon" src="/assets/agk-icon.png" width="30" height="30" alt="LSCAGKT 校徽標誌" /><span class="brand-name">LSC<span class="accent">AGKT</span></span><span class="brand-zh">喇沙書院學術時事及常識問答隊</span></a><nav class="site-nav" id="siteNav"><a href="/">首頁</a><a href="/training" aria-current="page">資源庫</a><a href="/competition/">競賽模擬</a><a href="/leaderboard/">排行榜</a></nav><button type="button" class="nav-toggle" aria-expanded="false" aria-label="開啟選單"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg></button></div></header>
      <main class="flex-1">
        <section class="bg-purple px-4 py-16 text-cream sm:px-6 sm:py-20">
          <div class="mx-auto max-w-3xl text-center">
            <p class="text-sm tracking-[0.2em] text-plum-soft">RESOURCES</p>
            <h1 class="mt-3 font-serif text-4xl font-bold sm:text-5xl">資源庫</h1>
            <p class="mt-4 text-lg text-plum-soft">筆記與參考資料集中存放，密碼保護，網頁內直接閱覽。</p>
          </div>
        </section>
        <div class="stripes h-3 w-full" aria-hidden="true"></div>
        <section class="bg-cream px-4 py-14 sm:px-6 sm:py-16">
          <div class="mx-auto max-w-5xl">
            <!-- 未解鎖時顯示鎖定卡，隱藏清單 -->
            <div class="gate-lock" id="gateLock">
              <span class="gate-lock-icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>
              <p>此資源庫受密碼保護。輸入密碼後即可瀏覽與閱覽全部資料。</p>
              <button type="button" class="gate-btn primary" id="gateOpen">輸入密碼解鎖</button>
            </div>

            <div id="resContent">
              <h2 class="res-section-title">隊伍資源</h2>
              <p class="res-section-note">競賽參考資料與練習資源。</p>
              <div class="res-grid" id="resGrid"></div>

              <h2 class="res-section-title" style="margin-top: 3rem;">延伸資料</h2>
              <p class="res-section-note">非隊伍相關的個人研習資料。</p>
              <div class="res-grid" id="resGridExtra"></div>

              <p class="res-hint">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                所有資料受密碼保護 · 桌面裝置可懸停預覽首頁 · 開啟後可於本頁直接閱覽、另開視窗或下載
              </p>
            </div>
          </div>
        </section>
      </main>
      <footer class="bg-purple-deep"><div class="mx-auto max-w-6xl px-4 py-10 sm:px-6"><p class="text-sm text-muted" style="margin: 0;">版權所有 © 2026 LSCAGKT · 喇沙書院學術時事及常識問答隊</p></div></footer>
    </div>

    <!-- 懸停預覽（Drive 式） -->
    <div class="res-preview" id="resPreview" aria-hidden="true">
      <img class="res-preview-img" id="previewImg" alt="" />
      <p class="res-preview-title" id="previewTitle"></p>
      <p class="res-preview-meta" id="previewMeta"></p>
    </div>

    <!-- 資源庫密碼對話框（伺服器端驗證） -->
    <div class="gate-backdrop" id="gateBackdrop" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
      <div class="gate-card" id="gateCard">
        <h2 id="gateTitle">受密碼保護</h2>
        <p>請輸入資源庫密碼以瀏覽及閱覽全部資料。驗證後 24 小時內無需重新輸入。</p>
        <form id="gateForm">
          <label for="gatePass">密碼</label>
          <input class="gate-input" type="password" id="gatePass" autocomplete="current-password" />
          <p class="gate-err" id="gateErr" role="alert"></p>
          <div class="gate-actions">
            <button type="submit" class="gate-btn primary" id="gateGo">解鎖</button>
            <button type="button" class="gate-btn" id="gateCancel">取消</button>
          </div>
        </form>
      </div>
    </div>

    <!-- PDF 閱覽器 -->
    <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="資料閱覽器">
      <div class="viewer-sheet">
        <div class="viewer-bar">
          <span class="viewer-title" id="viewerTitle"></span>
          <a class="viewer-btn" id="viewerNewTab" href="#" target="_blank" rel="noopener noreferrer" title="在新視窗開啟">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            <span class="label">新視窗</span>
          </a>
          <a class="viewer-btn" id="viewerDownload" href="#" download title="下載">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            <span class="label">下載</span>
          </a>
          <button type="button" class="viewer-btn primary" id="viewerClose">關閉</button>
        </div>
        <iframe class="viewer-frame" id="viewerFrame" title="PDF 閱覽" src="about:blank"></iframe>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        /* ===================== 資源清單 =====================
           所有資源現由管理後台（/admin）上傳至雲端（Supabase），
           會自動顯示於下方。此靜態清單保留作後備／特殊用途。 */
        var RESOURCES = [];

        /* 資源庫密碼閘：密碼只存於伺服器環境變數 LIBRARY_PASSWORD，
           驗證成功後取得 24 小時 HMAC 憑證（sessionStorage）；
           資源清單與檔案連結一律經 /api/library/*（伺服器端驗證）取得 */
        var TOKEN_KEY = "agkLibToken";
        var token = "";
        try { token = sessionStorage.getItem(TOKEN_KEY) || ""; } catch (e) { /* 私密模式 */ }

        function setToken(t) {
          token = String(t || "");
          try {
            if (token) sessionStorage.setItem(TOKEN_KEY, token);
            else sessionStorage.removeItem(TOKEN_KEY);
          } catch (e) { /* 私密模式 */ }
        }

        var cloudResources = [];

        function fmtCloudSize(b) {
          if (!b && b !== 0) return "PDF";
          if (b < 1024 * 1024) return Math.max(1, Math.round(b / 1024)) + " KB";
          return (b / 1024 / 1024).toFixed(1) + " MB";
        }

        function loadCloud() {
          if (typeof fetch !== "function") { render(); return; }
          if (!token) { showLock(); return; }
          fetch("/api/library/list", { headers: { "x-library-token": token } })
            .then(function (r) {
              if (r.status === 401) return Promise.reject({ auth: true });
              return r.ok ? r.json() : [];
            })
            .then(function (rows) {
              cloudResources = (rows || []).map(function (r) {
                return {
                  id: r.id,
                  title: r.title,
                  desc: r.description || "",
                  tag: r.tag || "資料",
                  path: r.storage_path,
                  date: r.created_at ? String(r.created_at).slice(0, 10) : "",
                  size: fmtCloudSize(r.file_size),
                  pages: r.pages || "PDF",
                  thumb: null,
                  extra: !!r.extra
                };
              });
              showContent();
              render();
            })
            .catch(function (err) {
              if (err && err.auth) { setToken(""); showLock(); return; }
              showContent();
              render();
            });
        }

        var $ = function (id) { return document.getElementById(id); };
        var grid = $("resGrid");
        var gridExtra = $("resGridExtra");
        var viewer = $("viewer");
        var currentIndex = -1;
        var preview = $("resPreview");
        var hideTimer = null;
        var showTimer = null;
        var lastFocus = null;

        /* ===================== 密碼閘（自訂對話框 + 伺服器驗證） ===================== */
        function showLock() {
          $("gateLock").classList.add("show");
          $("resContent").style.display = "none";
        }
        function showContent() {
          $("gateLock").classList.remove("show");
          $("resContent").style.display = "";
        }

        var lastGateFocus = null;
        var gateBusy = false;
        function openGate() {
          if ($("gateBackdrop").classList.contains("show")) return;
          lastGateFocus = document.activeElement;
          $("gateErr").textContent = "";
          $("gateBackdrop").classList.add("show");
          document.body.style.overflow = "hidden";
          window.setTimeout(function () { $("gatePass").focus(); }, 30);
        }
        function closeGate() {
          $("gateBackdrop").classList.remove("show");
          document.body.style.overflow = "";
          $("gatePass").value = "";
          if (lastGateFocus && lastGateFocus.focus) lastGateFocus.focus();
        }
        function gateError(msg) {
          $("gateErr").textContent = msg;
          var c = $("gateCard");
          c.classList.remove("gate-shake");
          void c.offsetWidth;
          c.classList.add("gate-shake");
        }
        function requestUnlock() {
          if (token) return true;
          openGate();
          return false;
        }

        $("gateOpen").addEventListener("click", openGate);
        $("gateCancel").addEventListener("click", closeGate);
        $("gateBackdrop").addEventListener("click", function (e) {
          if (e.target === $("gateBackdrop")) closeGate();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && $("gateBackdrop").classList.contains("show")) closeGate();
        });
        $("gateForm").addEventListener("submit", function (ev) {
          ev.preventDefault();
          if (gateBusy) return;
          var pass = $("gatePass").value;
          if (!pass) { gateError("請輸入密碼。"); return; }
          gateBusy = true;
          $("gateGo").disabled = true;
          $("gateErr").textContent = "";
          fetch("/api/library/verify", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pass })
          }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
          }).then(function (res) {
            if (res.ok && res.d && res.d.token) {
              setToken(res.d.token);
              closeGate();
              showContent();
              loadCloud();
            } else if (res.status === 429) {
              gateError(res.d.error || "嘗試次數過多，請稍後再試。");
            } else {
              gateError(res.d.error || "密碼不正確。");
            }
          }).catch(function () {
            gateError("網絡錯誤，請重試。");
          }).finally(function () {
            gateBusy = false;
            $("gateGo").disabled = false;
          });
        });

        function openViewer(item, card) {
          $("viewerTitle").textContent = item.title + "（載入中…）";
          $("viewerNewTab").href = "#";
          $("viewerDownload").href = "#";
          $("viewerFrame").src = "about:blank";
          lastFocus = document.activeElement;
          hidePreview();
          document.body.style.overflow = "hidden";
          // 將背景設為 inert：鍵盤焦點不會逃出對話框（2.4.3）
          var shell = document.querySelector(".flex.min-h-screen");
          if (shell) { shell.setAttribute("inert", ""); shell.setAttribute("aria-hidden", "true"); }
          // Shared Element Transition：閱覽器從卡片morph展開
          if (card && document.startViewTransition) {
            card.style.viewTransitionName = "pdf-card";
            var vt = document.startViewTransition(function () {
              viewer.classList.add("open");
            });
            vt.finished.finally(function () { card.style.viewTransitionName = ""; });
          } else {
            viewer.classList.add("open");
          }
          $("viewerClose").focus();
          // 經伺服器取得 1 小時有效之簽名連結後載入（配合私密 bucket 為唯一取檔途徑）
          fetch("/api/library/file?path=" + encodeURIComponent(item.path || ""), { headers: { "x-library-token": token } })
            .then(function (r) {
              return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, status: r.status, d: d }; });
            })
            .then(function (res) {
              if (res.status === 401) { setToken(""); closeViewer(); showLock(); return; }
              if (!res.ok || !res.d || !res.d.url) throw new Error((res.d && res.d.error) || "無法開啟檔案。");
              $("viewerTitle").textContent = item.title;
              $("viewerNewTab").href = res.d.url;
              $("viewerDownload").href = res.d.url;
              // #view=FitH：進入時縮放至適寬；原生瀏覽器 PDF 檢視器負責渲染（快速、零依賴）
              $("viewerFrame").src = res.d.url + "#view=FitH";
            })
            .catch(function (err) {
              closeViewer();
              window.alert((err && err.message) || "無法開啟檔案，請稍後再試。");
            });
        }

        function closeViewer() {
          var done = function () {
            viewer.classList.remove("open");
            $("viewerFrame").src = "about:blank";
            document.body.style.overflow = "";
            var shell = document.querySelector(".flex.min-h-screen");
            if (shell) { shell.removeAttribute("inert"); shell.removeAttribute("aria-hidden"); }
            if (lastFocus && lastFocus.focus) lastFocus.focus();
          };
          // 反向morph：閱覽器縮回卡片
          var openCard = document.querySelector('.res-card[data-index="' + currentIndex + '"]');
          if (document.startViewTransition && openCard) {
            openCard.style.viewTransitionName = "pdf-card";
            var vt = document.startViewTransition(done);
            vt.finished.finally(function () { openCard.style.viewTransitionName = ""; });
          } else {
            done();
          }
        }

        /* ===================== Drive 式懸停預覽 ===================== */
        var canHover = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;

        function showPreview(item, card) {
          if (!item.thumb) return;
          var img = $("previewImg");
          if (!img.getAttribute("src") || img.dataset.file !== item.file) {
            img.src = item.thumb;
            img.dataset.file = item.file;
          }
          img.alt = item.title + " 首頁預覽";
          $("previewTitle").textContent = item.title;
          $("previewMeta").textContent = item.pages + " · " + item.size + " · " + item.date;
          preview.classList.add("show");
          // 定位：先放卡片旁，再依面板實際尺寸夾回視窗內
          preview.style.left = "0px";
          preview.style.top = "0px";
          var rect = card.getBoundingClientRect();
          var pw = preview.offsetWidth;
          var ph = preview.offsetHeight;
          var vw = window.innerWidth;
          var vh = window.innerHeight;
          var left = rect.right + 14;
          if (left + pw > vw - 10) left = rect.left - pw - 14;
          if (left < 10) left = Math.min(Math.max(10, vw - pw - 10), Math.max(10, rect.left));
          var top = rect.top + rect.height / 2 - ph / 2;
          top = Math.min(Math.max(10, top), vh - ph - 10);
          preview.style.left = left + "px";
          preview.style.top = top + "px";
          requestAnimationFrame(function () {
            preview.classList.add("visible");
          });
        }

        function hidePreview() {
          if (showTimer) { clearTimeout(showTimer); showTimer = null; }
          preview.classList.remove("visible");
          preview.classList.remove("show");
        }

        function bindPreview(card, item) {
          card.addEventListener("mouseenter", function () {
            if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
            if (showTimer) clearTimeout(showTimer);
            showTimer = setTimeout(function () {
              if (!viewer.classList.contains("open")) showPreview(item, card);
            }, 300);
          });
          card.addEventListener("mouseleave", function () {
            if (showTimer) { clearTimeout(showTimer); showTimer = null; }
            hideTimer = setTimeout(hidePreview, 80);
          });
        }

        /* ===================== 渲染 ===================== */
        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&" + "amp;")
            .replace(/</g, "&" + "lt;")
            .replace(/>/g, "&" + "gt;")
            .replace(/"/g, "&" + "quot;");
        }

        function cardHtml(item, index) {
          var badgeClass = item.extra ? "res-badge extra" : "res-badge";
          return (
            '<button type="button" class="res-card reveal" style="--reveal-delay:' + Math.min((index % 6) * 60, 300) + 'ms" data-index="' + index + '" data-extra="' + (item.extra ? "1" : "0") + '" aria-label="開啟「' + esc(item.title) + '（需密碼）">' +
              '<div class="res-top">' +
                '<span class="' + badgeClass + '">PDF · ' + esc(item.tag) + "</span>" +
                '<span class="res-lock" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span>' +
              "</div>" +
              '<h3 class="res-title">' + esc(item.title) + "</h3>" +
              '<p class="res-desc">' + esc(item.desc) + "</p>" +
              '<div class="res-meta"><span>' + esc(item.pages || "PDF") + "</span><span>" + esc(item.size) + "</span><span>" + esc(item.date) + "</span></div>" +
            "</button>"
          );
        }

        var ALL = [];

        function render() {
          ALL = cloudResources.concat(RESOURCES);
          var mainHtml = "";
          var extraHtml = "";
          ALL.forEach(function (item, i) {
            if (item.extra) extraHtml += cardHtml(item, i);
            else mainHtml += cardHtml(item, i);
          });
          grid.innerHTML = mainHtml;
          gridExtra.innerHTML = extraHtml;
        }

        function onGridClick(e) {
          var card = e.target && e.target.closest ? e.target.closest(".res-card") : null;
          if (!card) return;
          var index = Number(card.dataset.index);
          var item = ALL[index];
          if (!item) return;
          currentIndex = index;
          if (requestUnlock()) openViewer(item, card);
        }

        grid.addEventListener("click", onGridClick);
        gridExtra.addEventListener("click", onGridClick);

        if (canHover) {
          [grid, gridExtra].forEach(function (g) {
            g.addEventListener("mouseover", function (e) {
              var card = e.target && e.target.closest ? e.target.closest(".res-card") : null;
              if (!card) return;
              var item = ALL[Number(card.dataset.index)];
              if (item && item.thumb) bindPreview(card, item);
            });
          });
          document.addEventListener("scroll", hidePreview, { passive: true });
          document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") hidePreview();
          });
        }

        $("viewerClose").addEventListener("click", closeViewer);
        viewer.addEventListener("click", function (e) {
          if (e.target === viewer) closeViewer();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && viewer.classList.contains("open")) closeViewer();
        });

        render();
        if (token) {
          loadCloud();
        } else {
          showLock();
        }
      })();
    </script>
  </body>
</html>
