<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="../styles.css" />
    <style>html{background:#fcfbf4}html.dark-mode{background:#181715}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="../assets/agk-icon.png" />
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" />
    <title>問答競技場 | LSCAGKT</title>
    <meta name="robots" content="noindex" />
    <style>
      .play-wrap {
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column;
        max-width: 560px; margin: 0 auto; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
        box-sizing: border-box;
      }
      .play-brand { text-align: center; padding: 0.6rem 0 1rem; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.08em; }
      .play-brand strong { font-family: "Noto Serif TC", serif; color: var(--ink); letter-spacing: 0; }
      .dark-mode .play-brand strong { color: #f2ede1; }

      .screen { flex: 1; display: flex; flex-direction: column; }

      /* ---- 加入 ---- */
      .join-box { margin: auto 0; display: flex; flex-direction: column; gap: 1rem; }
      .join-title { font-family: "Noto Serif TC", serif; font-size: 1.9rem; font-weight: 700; color: var(--purple); text-align: center; margin: 0; }
      .dark-mode .join-title { color: #e3c6dc; }
      .join-sub { text-align: center; color: var(--muted); font-size: 0.92rem; margin: -0.4rem 0 0.6rem; }
      .pin-input {
        width: 100%; box-sizing: border-box; padding: 0.9rem 1rem;
        border: 1.5px solid var(--hairline-strong); border-radius: 12px;
        background: var(--surface); color: var(--ink);
        font: inherit; font-size: 1.7rem; font-weight: 700; letter-spacing: 0.45em; text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .pin-input:focus { outline: 2px solid var(--school-gold); outline-offset: 1px; }
      .name-input {
        width: 100%; box-sizing: border-box; padding: 0.75rem 1rem;
        border: 1.5px solid var(--hairline-strong); border-radius: 12px;
        background: var(--surface); color: var(--ink); font: inherit; font-size: 1.05rem;
      }
      .name-input:focus { outline: 2px solid var(--school-gold); outline-offset: 1px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        min-height: 3rem; padding: 0 1.3rem; border-radius: 12px; border: 1px solid var(--hairline);
        background: var(--surface); color: var(--ink); font: inherit; font-size: 1rem; font-weight: 700;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        transition: opacity 150ms ease, border-color 150ms ease;
      }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
      .btn.primary:hover { background: var(--lasalle-red-dark); }
      .play-msg { text-align: center; font-size: 0.92rem; min-height: 1.4em; }
      .play-msg.err { color: #b3261e; }
      .dark-mode .play-msg.err { color: #f28779; }
      .play-msg.ok { color: #1b7f3b; }
      .dark-mode .play-msg.ok { color: #7bd39a; }

      /* ---- 大廳 ---- */
      .lobby-head { text-align: center; margin: 1.5rem 0 0.5rem; }
      .lobby-head .pin {
        font-family: "Noto Serif TC", serif; font-size: 2.6rem; font-weight: 700;
        letter-spacing: 0.18em; color: var(--purple); font-variant-numeric: tabular-nums;
      }
      .dark-mode .lobby-head .pin { color: #e3c6dc; }
      .lobby-head p { color: var(--muted); margin: 0.3rem 0 0; font-size: 0.92rem; }
      .me-badge {
        align-self: center; display: inline-flex; align-items: center; gap: 8px;
        padding: 0.5rem 1.1rem; border-radius: 9999px; margin-top: 0.8rem;
        background: var(--rose-soft); color: var(--lasalle-red-dark); font-weight: 700;
      }
      .dark-mode .me-badge { background: rgb(224 82 74 / 14%); color: #f28779; }
      .player-cloud { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1.4rem; }
      .chip {
        padding: 0.4rem 0.9rem; border-radius: 9999px; border: 1px solid var(--hairline);
        background: var(--surface); font-size: 0.88rem; color: var(--ink);
      }
      .wait-note { text-align: center; color: var(--muted); font-size: 0.88rem; margin: auto 0 1rem; }

      /* ---- 題目 ---- */
      .q-top { display: flex; align-items: center; gap: 0.8rem; margin: 0.4rem 0 0.8rem; }
      .q-num { color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .timer-track { flex: 1; height: 8px; border-radius: 9999px; background: var(--hairline); overflow: hidden; }
      .timer-fill { height: 100%; width: 100%; background: var(--school-gold); border-radius: 9999px; transition: width 250ms linear; }
      .timer-fill.low { background: var(--red); }
      .q-text {
        font-family: "Noto Serif TC", serif; font-size: 1.18rem; font-weight: 700; line-height: 1.6;
        color: var(--ink); margin: 0 0 1rem; min-height: 3.4em;
      }
      .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
      @media (max-width: 480px) { .answers { grid-template-columns: 1fr; } }
      .ans-btn {
        display: flex; align-items: center; gap: 0.7rem; text-align: left;
        padding: 0.9rem 1rem; border-radius: 12px; border: 0;
        color: #fff; font: inherit; font-size: 1rem; font-weight: 700; line-height: 1.45;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        transition: transform 120ms ease, opacity 150ms ease;
      }
      .ans-btn:active { transform: scale(0.98); }
      .ans-btn:disabled { opacity: 0.55; cursor: default; }
      .ans-btn svg { flex-shrink: 0; }
      .ans-btn .txt { flex: 1; min-width: 0; }
      .ans-red { background: #c0392b; }
      .ans-gold { background: #b3862c; }
      .ans-plum { background: #6b3a63; }
      .ans-green { background: #3e7d5a; }
      .ans-btn.right { outline: 4px solid var(--school-gold); outline-offset: -4px; }
      .ans-btn.dim { opacity: 0.35; }
      .submitted {
        margin: auto 0; text-align: center; display: flex; flex-direction: column; gap: 0.6rem; align-items: center;
      }
      .submitted .big { font-family: "Noto Serif TC", serif; font-size: 1.5rem; font-weight: 700; color: var(--purple); }
      .dark-mode .submitted .big { color: #e3c6dc; }
      .submitted p { color: var(--muted); margin: 0; font-size: 0.92rem; }
      .spinner {
        width: 30px; height: 30px; border-radius: 50%; margin-top: 0.6rem;
        border: 3px solid var(--hairline-strong); border-top-color: var(--purple);
        animation: spin 900ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---- 揭曉 ---- */
      .verdict { text-align: center; margin: 1.2rem 0; }
      .verdict .v-big { font-family: "Noto Serif TC", serif; font-size: 2rem; font-weight: 700; }
      .verdict .v-good { color: #1b7f3b; }
      .dark-mode .verdict .v-good { color: #7bd39a; }
      .verdict .v-bad { color: #b3261e; }
      .dark-mode .verdict .v-bad { color: #f28779; }
      .verdict .v-sub { color: var(--muted); font-size: 0.95rem; margin: 0.3rem 0 0; font-variant-numeric: tabular-nums; }
      .verdict .v-score { color: var(--muted); font-size: 0.9rem; margin-top: 0.4rem; font-variant-numeric: tabular-nums; }

      /* ---- 排行 ---- */
      .board-title { font-family: "Noto Serif TC", serif; text-align: center; font-size: 1.4rem; color: var(--purple); margin: 1.2rem 0 1rem; }
      .dark-mode .board-title { color: #e3c6dc; }
      .board-list { display: flex; flex-direction: column; gap: 0.45rem; }
      .board-row {
        display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0.9rem;
        border-radius: 10px; border: 1px solid var(--hairline); background: var(--surface); font-size: 0.95rem;
      }
      .board-row .rk { width: 1.8em; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
      .board-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .board-row .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
      .board-row.me { border-color: var(--red); background: var(--rose-soft); }
      .dark-mode .board-row.me { background: rgb(224 82 74 / 12%); }

      /* ---- 頒獎台 ---- */
      .podium { display: flex; align-items: flex-end; justify-content: center; gap: 0.6rem; margin: 1.6rem 0 1.2rem; }
      .pod { width: 33%; max-width: 120px; text-align: center; }
      .pod .p-name { font-weight: 700; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .pod .p-score { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
      .pod .p-block { margin-top: 0.4rem; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; color: #fff; font-family: "Noto Serif TC", serif; font-weight: 700; }
      .pod.p1 .p-block { height: 88px; background: var(--red); font-size: 1.6rem; }
      .pod.p2 .p-block { height: 60px; background: var(--school-gold); font-size: 1.3rem; }
      .pod.p3 .p-block { height: 42px; background: #9c7b52; font-size: 1.1rem; }
      .end-note { text-align: center; color: var(--muted); font-size: 0.92rem; margin: auto 0 1rem; }
      .conn { text-align: center; color: var(--muted); font-size: 0.78rem; padding: 0.4rem 0 0; }
    </style>
  </head>
  <body>
    <div class="play-wrap bg-cream text-ink">
      <div class="play-brand"><strong>LSCAGKT</strong> · 問答競技場</div>
      <div class="screen" id="app"></div>
      <div class="conn" id="conn"></div>
    </div>

    <script>
      (function () {
        "use strict";
        var $ = function (id) { return document.getElementById("app"); };
        var app = $("app");
        var connEl = document.getElementById("conn");

        var K_PIN = "agkPlayPin", K_ID = "agkPlayId", K_NAME = "agkPlayName";
        function sGet(k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } }
        function sSet(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch (e) {} }

        var pin = sGet(K_PIN), playerId = sGet(K_ID), myName = sGet(K_NAME);
        var view = pin && playerId ? "game" : "join";
        var serverOffset = 0;
        var answeredIndex = -1;   // 本題已提交（本地即時反饋）
        var chosen = -1;
        var busy = false, joined = false, pollTimer = null, tickTimer = null;
        var failCount = 0;

        function esc(s) {
          return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        var SHAPES = [
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4 L21 19 H3 Z"></path></svg>',
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 L21 12 L12 21 L3 12 Z"></path></svg>',
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>',
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect></svg>'
        ];
        var CLS = ["ans-red", "ans-gold", "ans-plum", "ans-green"];

        function api(path, method, body) {
          return fetch("/api/game/" + path, {
            method: method || "GET",
            headers: { "Content-Type": "application/json" },
            body: body ? JSON.stringify(body) : undefined
          }).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (d) {
              if (!res.ok) throw new Error(d.error || "請求失敗（" + res.status + "）");
              return d;
            });
          });
        }

        /* ===================== 加入 ===================== */
        function renderJoin(msg, isErr) {
          app.innerHTML =
            '<div class="join-box">' +
              '<h1 class="join-title">問答競技場</h1>' +
              '<p class="join-sub">輸入主持人提供的 6 位遊戲碼加入</p>' +
              '<input class="pin-input" id="jPin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" value="' + esc(pin) + '" />' +
              '<input class="name-input" id="jName" maxlength="16" placeholder="你的名字" value="' + esc(myName) + '" />' +
              '<button class="btn primary" id="jGo">加入遊戲</button>' +
              '<p class="play-msg ' + (isErr ? "err" : "") + '" id="jMsg">' + esc(msg || "") + "</p>" +
            "</div>";
          document.getElementById("jGo").addEventListener("click", doJoin);
          app.querySelectorAll("input").forEach(function (inp) {
            inp.addEventListener("keydown", function (e) { if (e.key === "Enter") doJoin(); });
          });
          if (!pin) document.getElementById("jPin").focus();
        }

        function doJoin() {
          if (busy) return;
          var p = document.getElementById("jPin").value.replace(/\D/g, "");
          var n = document.getElementById("jName").value.trim();
          var msg = document.getElementById("jMsg");
          if (p.length !== 6) { msg.textContent = "請輸入 6 位遊戲碼。"; msg.className = "play-msg err"; return; }
          if (!n) { msg.textContent = "請輸入名字。"; msg.className = "play-msg err"; return; }
          busy = true;
          msg.textContent = "加入中…"; msg.className = "play-msg";
          api("join", "POST", { pin: p, name: n })
            .then(function (d) {
              pin = p; playerId = d.playerId; myName = n;
              sSet(K_PIN, pin); sSet(K_ID, playerId); sSet(K_NAME, myName);
              view = "game";
              renderWait("已加入，等待主持人開始…");
              startPolling();
            })
            .catch(function (err) {
              msg.textContent = err.message || "加入失敗。";
              msg.className = "play-msg err";
            })
            .finally(function () { busy = false; });
        }

        /* ===================== 大廳／等待 ===================== */
        function renderWait(text, players) {
          var cloud = (players && players.length)
            ? '<div class="player-cloud">' + players.map(function (n) { return '<span class="chip">' + esc(n) + "</span>"; }).join("") + "</div>"
            : "";
          app.innerHTML =
            '<div class="lobby-head"><div class="pin">' + esc(pin) + "</div><p>遊戲碼</p></div>" +
            '<div style="align-self:center;"><span class="me-badge">' + esc(myName) + "（你）</span></div>" +
            cloud +
            '<p class="wait-note" style="margin-top:auto;">' + esc(text) + "</p>" +
            '<div class="spinner" style="align-self:center; margin-bottom:1.2rem;"></div>';
        }

        /* ===================== 題目 ===================== */
        function renderQuestion(d) {
          if (answeredIndex !== d.index) { answeredIndex = -1; chosen = -1; }
          var answered = answeredIndex === d.index;
          var opts = d.options.map(function (o, i) {
            var cls = "ans-btn " + (CLS[i] || "ans-plum");
            if (answered && chosen === i) cls += " right";
            return '<button type="button" class="' + cls + '" data-opt="' + i + '"' + (answered ? " disabled" : "") + ">" +
              SHAPES[i] + '<span class="txt">' + esc(o) + "</span></button>";
          }).join("");
          app.innerHTML =
            '<div class="q-top"><span class="q-num">第 ' + (d.index + 1) + " / " + d.total + " 題</span>" +
              '<div class="timer-track"><div class="timer-fill" id="tFill"></div></div></div>' +
            '<p class="q-text">' + esc(d.q) + "</p>" +
            '<div class="answers">' + opts + "</div>";
          if (!answered) {
            app.querySelectorAll(".ans-btn").forEach(function (b) {
              b.addEventListener("click", function () { submitAnswer(Number(b.dataset.opt)); });
            });
          }
          startTicker(d);
        }

        function startTicker(d) {
          stopTicker();
          var ends = Date.parse(d.endsAt) - serverOffset;
          var total = d.total ? 0 : 0;
          tickTimer = setInterval(function () {
            var fill = document.getElementById("tFill");
            if (!fill) { stopTicker(); return; }
            var remain = Math.max(0, ends - Date.now());
            var pct = Math.max(0, Math.min(100, remain / (d.timeMs || 20000) * 100));
            fill.style.width = pct + "%";
            if (remain <= 5000) fill.classList.add("low");
            if (remain <= 0) stopTicker();
          }, 250);
        }
        function stopTicker() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

        function renderSubmitted() {
          app.innerHTML =
            '<div class="submitted"><div class="big">已提交</div>' +
            "<p>等待其他玩家作答…</p>" +
            '<div class="spinner"></div></div>';
        }

        function submitAnswer(opt) {
          if (busy || answeredIndex !== -1) return;
          busy = true;
          chosen = opt;
          answeredIndex = lastData ? lastData.index : -2;
          api("answer", "POST", { pin: pin, player: playerId, index: lastData.index, option: opt })
            .then(function () { renderSubmitted(); })
            .catch(function (err) {
              answeredIndex = -1; chosen = -1;
              connEl.textContent = err.message || "提交失敗";
              if (lastData) renderQuestion(lastData);
            })
            .finally(function () { busy = false; });
        }

        /* ===================== 揭曉 ===================== */
        function renderReveal(d) {
          stopTicker();
          var mine = d.my || {};
          var good = mine.answered && mine.correct;
          var vBig = !mine.answered ? "未作答"
            : good ? "正確！"
            : "錯誤";
          var vCls = good ? "v-good" : "v-bad";
          var sub = mine.answered && good ? "+" + mine.points + " 分"
            : !mine.answered ? "這題沒有取得分數"
            : "再接再厲";
          var opts = d.options.map(function (o, i) {
            var cls = "ans-btn " + (CLS[i] || "ans-plum");
            if (i === d.correct) cls += " right";
            else if (mine.answered && mine.option === i) cls += " dim";
            else cls += " dim";
            return '<button type="button" class="' + cls + '" disabled>' +
              SHAPES[i] + '<span class="txt">' + esc(o) + "</span></button>";
          }).join("");
          app.innerHTML =
            '<div class="verdict"><div class="v-big ' + vCls + '">' + vBig + "</div>" +
            '<p class="v-sub">' + sub + "</p>" +
            '<p class="v-score">目前總分 ' + (mine.score != null ? mine.score : 0) + " 分</p></div>" +
            '<div class="answers" style="margin-top:auto; margin-bottom:1rem;">' + opts + "</div>";
        }

        /* ===================== 排行 ===================== */
        function renderBoard(d, isFinal) {
          var rows = (d.standings || []).map(function (r, i) {
            var cls = "board-row" + (r.name === myName ? " me" : "");
            return '<div class="' + cls + '"><span class="rk">' + (i + 1) + "</span><span class=\"nm\">" + esc(r.name) + "</span><span class=\"sc\">" + r.score + "</span></div>";
          }).join("");
          var my = d.my ? '<p class="wait-note" style="margin:1rem 0 0;">你排第 <strong>' + d.my.rank + "</strong> 名 · " + d.my.score + " 分</p>" : "";
          var title = isFinal ? "最終排名" : "排行榜";
          app.innerHTML = '<h2 class="board-title">' + title + "</h2>" +
            '<div class="board-list">' + (rows || '<p class="wait-note">暫無資料</p>') + "</div>" + my;
        }

        /* ===================== 頒獎台 ===================== */
        function renderEnded(d) {
          stopPolling();
          var pod = d.podium || [];
          var order = [pod[1], pod[0], pod[2]]; // 2 1 3
          var blocks = order.map(function (p, i) {
            var place = i === 1 ? 1 : i === 0 ? 2 : 3;
            return '<div class="pod p' + place + '"><div class="p-name">' + esc(p ? p.name : "") + "</div>" +
              '<div class="p-score">' + (p ? p.score + " 分" : "") + "</div>" +
              '<div class="p-block">' + place + "</div></div>";
          }).join("");
          var rows = (d.standings || []).map(function (r, i) {
            var cls = "board-row" + (r.name === myName ? " me" : "");
            return '<div class="' + cls + '"><span class="rk">' + (i + 1) + "</span><span class=\"nm\">" + esc(r.name) + "</span><span class=\"sc\">" + r.score + "</span></div>";
          }).join("");
          app.innerHTML =
            '<h2 class="board-title">遊戲結束</h2>' +
            '<div class="podium">' + blocks + "</div>" +
            '<div class="board-list">' + rows + "</div>" +
            '<p class="end-note">感謝參與！</p>';
          if (d.my) {
            var note = app.querySelector(".end-note");
            note.textContent = "你排第 " + d.my.rank + " 名 · " + d.my.score + " 分 · 感謝參與！";
          }
        }

        /* ===================== 輪詢 ===================== */
        var lastData = null;
        function startPolling() {
          stopPolling();
          pollTimer = setInterval(poll, 1000);
          poll();
        }
        function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

        function poll() {
          if (busy) return;
          busy = true;
          api("state?pin=" + encodeURIComponent(pin) + "&player=" + encodeURIComponent(playerId))
            .then(function (d) {
              failCount = 0;
              connEl.textContent = "";
              if (d.now) serverOffset = Date.parse(d.now) - Date.now();
              var prevStatus = lastData ? lastData.status : null;
              lastData = d;
              if (d.timeMs == null && d.endsAt && d.startedAt) {
                d.timeMs = Date.parse(d.endsAt) - Date.parse(d.startedAt);
              }
              // 離開作答階段時重設本地提交狀態
              if (d.index !== (lastData.index || 0)) answeredIndex = -1;
              if (prevStatus !== d.status && d.status === "question") answeredIndex = -1;

              if (d.status === "lobby") renderWait("等待主持人開始…", d.players);
              else if (d.status === "question") { if (answeredIndex === d.index) renderSubmitted(); else renderQuestion(d); }
              else if (d.status === "reveal") renderReveal(d);
              else if (d.status === "board") renderBoard(d, false);
              else if (d.status === "ended") renderEnded(d);
            })
            .catch(function (err) {
              failCount++;
              connEl.textContent = failCount >= 3 ? "連線不穩定，重試中…" : "";
              if (failCount > 12) {
                stopPolling();
                connEl.textContent = "連線中斷，請重新整理頁面。";
              }
            })
            .finally(function () { busy = false; });
        }

        /* ===================== 啟動 ===================== */
        if (view === "game") {
          startPolling();
        } else {
          renderJoin();
        }
      })();
    </script>
  </body>
</html>
