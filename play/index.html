<!doctype html>
<html lang="zh-Hant" class="antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="stylesheet" href="../styles.css" />
    <style>html{background:#181715}</style>
    <meta name="theme-color" content="#181715" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="../assets/agk-icon.png" />
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" />
    <title>問答競技場 | LSCAGKT</title>
    <meta name="robots" content="noindex" />
    <style>
      /* =====================================================================
         問答競技場 · 舞台設計 v2（ redesiged to design-system v5.2 ）
         · 一體式暗場劇院：加入 → 遊戲 → 結算全在 #181715 舞台上
         · 電壓 = 校徽紅 #d42522（焦點／計時／你的標記）；學校金 #c69a3a
           只留給分數語意（連擊・得分・正確答案・頒獎台）
         · 選項保留四色快辨（紅／金／梅紫／綠），改用系統色調、平面化陰影
         · 動效只用 CSS keyframes（transform／opacity），尊重 prefers-reduced-motion
         ===================================================================== */
      :root {
        --stage-bg: #181715;
        --stage-elev: #252320;
        --stage-elev-2: #2a2825;
        --on-dark: #faf9f5;
        --on-dark-mute: rgb(250 249 245 / 62%);
        --on-dark-faint: rgb(250 249 245 / 50%);
        --hair-dark: rgb(255 255 255 / 14%);
        --hair-dark-soft: rgb(255 255 255 / 9%);
        --v-red: #d42522;
        --v-red-deep: #ae0906;
        --gold: #c69a3a;
        --gold-deep: #8a6a18;
        --ok-dark: #7bd39a;
        --err-dark: #f28779;
      }

      /* ===== 基礎 ===== */
      .play-wrap {
        position: relative;
        min-height: 100vh; min-height: 100dvh;
        display: flex; flex-direction: column;
        max-width: 560px; margin: 0 auto; padding: 1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
        box-sizing: border-box;
        overflow: hidden; overflow: clip; /* 裝飾光暈不造成橫向捲動 */
        background:
          radial-gradient(130% 62% at 50% 0%, rgb(212 37 34 / 7%), transparent 55%),
          linear-gradient(170deg, #201e1c 0%, #1a1917 55%, var(--stage-bg) 100%);
        color: var(--on-dark);
      }
      @media (min-width: 768px) { .play-wrap { max-width: 600px; } }

      /* 慢速漂移的品牌光暈（紅右上／梅紫左下），與首頁 hero 同源 */
      .play-glow {
        position: absolute; border-radius: 50%; filter: blur(64px);
        pointer-events: none; z-index: 0;
      }
      .play-glow-a {
        width: 420px; height: 420px; top: -170px; right: -130px;
        background: radial-gradient(circle at center, rgb(212 37 34 / 11%), transparent 70%);
        animation: pg-a 28s ease-in-out infinite alternate;
      }
      .play-glow-b {
        width: 500px; height: 500px; bottom: -230px; left: -170px;
        background: radial-gradient(circle at center, rgb(107 58 99 / 13%), transparent 70%);
        animation: pg-b 36s ease-in-out infinite alternate;
      }
      @keyframes pg-a { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-56px, 44px, 0) scale(1.1); } }
      @keyframes pg-b { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(64px, -52px, 0) scale(1.07); } }

      .play-brand {
        position: relative; z-index: 1;
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        align-self: center;
        padding: 0.8rem 0 1.2rem;
        color: var(--on-dark-mute); font-size: 0.78rem; letter-spacing: 0.16em;
      }
      .play-brand::before { content: ""; width: 20px; height: 2px; border-radius: 2px; background: var(--v-red); }
      .play-brand strong { font-family: "Noto Serif TC", serif; color: var(--on-dark); letter-spacing: 0.1em; font-weight: 500; }

      .screen { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; }
      .conn { position: relative; z-index: 1; }

      /* ===== 加入（同一暗場） ===== */
      .join-box { margin: auto 0; display: flex; flex-direction: column; gap: 1rem; }
      .join-mark { display: flex; justify-content: center; margin-bottom: 0.3rem; }
      .join-mark img {
        width: 60px; height: 60px; border-radius: 16px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 40%), 0 0 0 1px rgb(255 255 255 / 8%);
      }
      .join-title {
        font-family: "Noto Serif TC", serif; font-size: 2.3rem; font-weight: 500;
        letter-spacing: -0.015em; color: var(--on-dark); text-align: center; margin: 0;
      }
      .join-sub { text-align: center; color: var(--on-dark-mute); font-size: 0.92rem; margin: -0.45rem 0 0.5rem; }
      .field-label { font-size: 0.8rem; font-weight: 600; color: var(--on-dark-mute); margin: 0 0 -0.55rem 0.25rem; letter-spacing: 0.08em; }
      .pin-cells { display: flex; gap: 0.5rem; justify-content: center; }
      .pin-cell {
        width: 2.9rem; height: 3.7rem; text-align: center; padding: 0;
        border: 1.5px solid var(--hair-dark); border-radius: 14px;
        background: var(--stage-elev); color: var(--on-dark);
        font: inherit; font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums;
        caret-color: var(--v-red);
        transition: border-color 150ms ease, transform 120ms ease, box-shadow 150ms ease, background 150ms ease;
      }
      .pin-cell:focus {
        outline: none; border-color: var(--v-red);
        transform: translateY(-2px); box-shadow: 0 6px 18px rgb(212 37 34 / 26%);
      }
      .pin-cell.filled { border-color: var(--on-dark-faint); background: var(--stage-elev-2); }
      @media (max-width: 360px) { .pin-cell { width: 2.4rem; height: 3.1rem; font-size: 1.4rem; } }
      .name-input {
        width: 100%; box-sizing: border-box; padding: 0.85rem 1.05rem;
        border: 1.5px solid var(--hair-dark); border-radius: 14px;
        background: var(--stage-elev); color: var(--on-dark); font: inherit; font-size: 1.05rem;
      }
      .name-input::placeholder { color: var(--on-dark-faint); }
      .name-input:focus { outline: 2px solid var(--v-red); outline-offset: 1px; border-color: transparent; }
      .shake { animation: shake 320ms ease; }
      @keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        min-height: 3rem; padding: 0 1.3rem; border-radius: 14px; border: 1px solid var(--hair-dark);
        background: var(--stage-elev); color: var(--on-dark); font: inherit; font-size: 1rem; font-weight: 700;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        transition: opacity 150ms ease, background 150ms ease, transform 120ms ease;
      }
      .btn:focus-visible { outline: 2px solid rgb(250 249 245 / 85%); outline-offset: 2px; }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn.primary { background: var(--v-red); border-color: var(--v-red); color: #fff; box-shadow: 0 5px 18px rgb(212 37 34 / 32%); }
      .btn.primary:hover { background: var(--v-red-deep); }
      .btn.primary:active { transform: scale(0.98); }
      .play-msg { text-align: center; font-size: 0.92rem; min-height: 1.4em; }
      .play-msg.err { color: var(--err-dark); }
      .play-msg.ok { color: var(--ok-dark); }

      /* ===== 大廳（舞台） ===== */
      .lobby-head { text-align: center; margin: 2rem 0 0.5rem; }
      .lobby-head .pin {
        font-family: "Noto Serif TC", serif; font-size: clamp(3.4rem, 18vw, 5.6rem); font-weight: 500;
        letter-spacing: 0.14em; color: var(--on-dark); line-height: 1.05; font-variant-numeric: tabular-nums;
        text-shadow: 0 4px 30px rgb(212 37 34 / 28%);
      }
      .lobby-head p { color: var(--on-dark-mute); margin: 0.6rem 0 0; font-size: 0.9rem; letter-spacing: 0.3em; }
      .me-badge {
        align-self: center; display: inline-flex; align-items: center; gap: 8px;
        padding: 0.55rem 1.2rem; border-radius: 9999px; margin-top: 1.1rem;
        background: rgb(212 37 34 / 13%); color: var(--on-dark); font-weight: 700;
        border: 1px solid rgb(212 37 34 / 45%);
      }
      .player-cloud { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 1.6rem; }
      .chip {
        padding: 0.42rem 0.95rem; border-radius: 9999px; border: 1px solid var(--hair-dark-soft);
        background: rgb(255 255 255 / 6%); font-size: 0.92rem; color: var(--on-dark);
        animation: chipin 260ms ease backwards;
      }
      .player-cloud .chip:nth-child(2) { animation-delay: 40ms; }
      .player-cloud .chip:nth-child(3) { animation-delay: 80ms; }
      .player-cloud .chip:nth-child(4) { animation-delay: 120ms; }
      .player-cloud .chip:nth-child(5) { animation-delay: 160ms; }
      .player-cloud .chip:nth-child(6) { animation-delay: 200ms; }
      .player-cloud .chip:nth-child(7) { animation-delay: 240ms; }
      .player-cloud .chip:nth-child(8) { animation-delay: 280ms; }
      @keyframes chipin { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
      .wait-note { text-align: center; color: var(--on-dark-mute); font-size: 0.9rem; margin: auto 0 1rem; }
      .leave {
        background: none; border: none; color: var(--on-dark-faint); text-decoration: underline;
        text-underline-offset: 3px; font: inherit; font-size: 0.85rem; cursor: pointer;
        padding: 0.5rem; touch-action: manipulation;
      }
      .leave:hover { color: var(--on-dark); }
      .leave:focus-visible { outline: 2px solid rgb(250 249 245 / 85%); outline-offset: 2px; border-radius: 6px; }

      /* ===== 題目（舞台） ===== */
      .dots { display: flex; gap: 5px; justify-content: center; margin: 0.3rem 0 0.9rem; flex-wrap: wrap; }
      .dot { width: 7px; height: 7px; border-radius: 9999px; background: rgb(250 249 245 / 22%); transition: width 200ms ease, background 200ms ease; }
      .dot.done { background: var(--v-red); }
      .dot.cur { background: var(--on-dark); width: 22px; }
      .q-top { display: flex; align-items: center; gap: 0.85rem; margin: 0.45rem 0 0.7rem; }
      .q-num { color: var(--on-dark-mute); font-size: 0.9rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .streak-chip {
        display: inline-flex; align-items: center; gap: 4px; padding: 0.22rem 0.65rem;
        border-radius: 9999px; background: rgb(198 154 58 / 16%); border: 1px solid rgb(198 154 58 / 42%);
        color: var(--gold); font-size: 0.8rem; font-weight: 700; white-space: nowrap;
        animation: chipin 260ms ease;
      }
      .t-num { color: var(--on-dark); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; min-width: 1.6em; text-align: right; transition: color 300ms ease; }
      .t-num.low { color: var(--err-dark); }
      .timer-track { flex: 1; height: 12px; border-radius: 9999px; background: rgb(255 255 255 / 10%); overflow: hidden; }
      .timer-fill { height: 100%; width: 100%; background: var(--on-dark); border-radius: 9999px; transition: width 250ms linear, background 300ms ease; }
      .timer-fill.low { background: var(--v-red); animation: tpulse 1s ease-in-out infinite; }
      @keyframes tpulse { 50% { opacity: 0.72; } }
      .q-text {
        font-family: "Noto Serif TC", serif; font-size: clamp(1.4rem, 5.6vw, 1.9rem); font-weight: 500; letter-spacing: -0.015em; line-height: 1.55;
        color: var(--on-dark); margin: 0 0 1.35rem; min-height: 2.9em; text-wrap: balance;
      }
      .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.5rem; }
      .ans-btn {
        display: flex; align-items: center; gap: 0.7rem; text-align: left;
        min-height: 3.8rem; padding: 0.9rem 1.05rem; border-radius: 14px; border: 0;
        color: #fff; font: inherit; font-size: 1.02rem; font-weight: 700; line-height: 1.45;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        transition: transform 120ms ease, opacity 150ms ease, filter 150ms ease;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 16%), 0 6px 18px rgb(0 0 0 / 26%);
        animation: ansin 380ms cubic-bezier(0.22, 0.9, 0.36, 1) backwards;
      }
      .answers .ans-btn:nth-child(2) { animation-delay: 60ms; }
      .answers .ans-btn:nth-child(3) { animation-delay: 120ms; }
      .answers .ans-btn:nth-child(4) { animation-delay: 180ms; }
      @keyframes ansin { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
      .ans-btn .shp {
        display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        width: 2.1rem; height: 2.1rem; border-radius: 9px; background: rgb(255 255 255 / 22%);
      }
      .ans-btn .txt { flex: 1; min-width: 0; word-break: break-word; }
      @media (max-width: 480px) {
        .ans-btn { font-size: 0.94rem; min-height: 3.4rem; padding: 0.8rem 0.9rem; }
        .ans-btn .shp { width: 1.8rem; height: 1.8rem; }
      }
      .ans-btn:focus-visible { outline: 2px solid rgb(250 249 245 / 85%); outline-offset: 2px; }
      .ans-btn:active { transform: scale(0.98); }
      .ans-btn:disabled { cursor: default; filter: saturate(0.75) brightness(0.92); }
      /* 四色快辨：系統色調（校徽紅／學校金／梅紫／深綠） */
      .ans-red { background: #d42522; }
      .ans-gold { background: var(--gold-deep); }
      .ans-plum { background: #7d4273; }
      .ans-green { background: #2f7a52; }
      .ans-btn.right { outline: 4px solid var(--gold); outline-offset: -4px; }
      .ans-btn.picked { outline: 3px solid rgb(250 249 245 / 90%); outline-offset: -3px; transform: scale(0.98); }
      .ans-btn.dim { opacity: 0.35; }
      .submitted {
        margin: auto 0; text-align: center; display: flex; flex-direction: column; gap: 0.6rem; align-items: center;
      }
      /* ===== 每題開始前的 3·2·1 倒數 ===== */
      .cd-wrap { margin: auto 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
      .cd-kicker { color: var(--on-dark-mute); font-size: 0.95rem; letter-spacing: 0.28em; margin: 0; }
      .cd-num {
        font-family: "Noto Serif TC", serif; font-weight: 500; font-size: clamp(5rem, 30vw, 8rem);
        line-height: 1; color: var(--on-dark); font-variant-numeric: tabular-nums;
        text-shadow: 0 4px 34px rgb(212 37 34 / 30%);
      }
      .cd-num.cd-pop { animation: cdpop 900ms cubic-bezier(0.22, 0.9, 0.36, 1); }
      @keyframes cdpop { 0% { transform: scale(1.35); opacity: 0.25; } 45% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      .cd-sub { color: var(--on-dark-mute); margin: 0; letter-spacing: 0.4em; font-size: 0.9rem; }
      .submitted .big { font-family: "Noto Serif TC", serif; font-size: 1.75rem; font-weight: 500; color: var(--on-dark); }
      .submitted p { color: var(--on-dark-mute); margin: 0; font-size: 0.94rem; }
      .submitted .pick {
        padding: 0.55rem 1.2rem; border-radius: 12px; border: 1px solid var(--hair-dark);
        background: rgb(255 255 255 / 7%); color: var(--on-dark); font-weight: 700; max-width: 100%; box-sizing: border-box;
      }
      .spinner {
        width: 30px; height: 30px; border-radius: 50%; margin-top: 0.6rem;
        border: 3px solid rgb(250 249 245 / 18%); border-top-color: var(--v-red);
        animation: spin 900ms linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ===== 揭曉（判定 + 分佈 + 連擊） ===== */
      .verdict { text-align: center; margin: 1rem 0 1.1rem; }
      .verdict .v-big {
        font-family: "Noto Serif TC", serif; font-size: clamp(2rem, 8vw, 2.7rem); font-weight: 500;
        animation: vpop 320ms ease; line-height: 1.2;
      }
      @keyframes vpop { 0% { transform: scale(0.72); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
      .verdict .v-good { color: var(--ok-dark); }
      .verdict .v-bad { color: var(--err-dark); }
      /* 揭曉全螢幕色調閃動（正確＝綠／錯誤＝紅） */
      body.flash-good::after, body.flash-bad::after {
        content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 6;
        animation: tintflash 700ms ease forwards;
      }
      body.flash-good::after { background: radial-gradient(circle at 50% 55%, rgb(123 211 154 / 25%), transparent 62%); }
      body.flash-bad::after { background: radial-gradient(circle at 50% 55%, rgb(242 135 121 / 22%), transparent 62%); }
      @keyframes tintflash { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
      .verdict .v-sub { color: var(--on-dark-mute); font-size: 1rem; margin: 0.35rem 0 0; font-variant-numeric: tabular-nums; }
      .verdict .v-pts { color: var(--gold); font-weight: 700; }
      .verdict .v-rank, .verdict .v-gap {
        margin: 0.5rem 0 0; font-size: 0.98rem; color: var(--on-dark); font-variant-numeric: tabular-nums;
      }
      .verdict .v-gap { color: var(--on-dark-mute); margin-top: 0.25rem; }
      .v-streak {
        display: inline-flex; align-items: center; gap: 5px; margin-top: 0.6rem;
        padding: 0.32rem 0.85rem; border-radius: 9999px;
        background: rgb(198 154 58 / 16%); border: 1px solid rgb(198 154 58 / 48%);
        color: var(--gold); font-weight: 700; font-size: 0.92rem;
        animation: chipin 300ms ease backwards;
      }
      .rv-q {
        font-family: "Noto Serif TC", serif; font-weight: 500; font-size: 1rem; line-height: 1.6;
        color: rgb(250 249 245 / 85%); margin: 0.2rem 0 0.9rem; text-align: center;
      }
      .rv-opts { display: flex; flex-direction: column; gap: 0.5rem; }
      .rv-opt {
        position: relative; display: flex; align-items: center; gap: 0.7rem; overflow: hidden;
        padding: 0.7rem 0.95rem; border-radius: 12px; font-size: 0.95rem; font-weight: 700; color: #fff;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 14%);
      }
      .rv-opt .bar { position: absolute; inset: 0; width: 0; background: rgb(255 255 255 / 22%); transition: width 600ms cubic-bezier(0.22, 0.9, 0.36, 1); }
      .rv-opt .lab { position: relative; flex: 1; min-width: 0; word-break: break-word; }
      .rv-opt .cnt { position: relative; font-weight: 700; font-variant-numeric: tabular-nums; }
      .rv-opt.correct { outline: 3px solid var(--gold); outline-offset: -3px; }
      .rv-opt.correct .lab::after { content: "正確答案"; margin-left: 0.5rem; padding: 0.1rem 0.5rem; border-radius: 9999px; background: var(--gold); color: #1f1e1b; font-size: 0.72rem; vertical-align: 1px; }
      .rv-opt.mine { box-shadow: inset 0 0 0 2px rgb(250 249 245 / 55%), inset 0 1px 0 rgb(255 255 255 / 14%); }
      .rv-opt.mine .lab::before { content: "你"; margin-right: 0.5rem; padding: 0.1rem 0.5rem; border-radius: 9999px; background: rgb(250 249 245 / 22%); font-size: 0.72rem; }
      .rv-red { background: #d42522; }
      .rv-gold { background: var(--gold-deep); }
      .rv-plum { background: #7d4273; }
      .rv-green { background: #2f7a52; }
      .interlude { margin: auto 0; text-align: center; display: flex; flex-direction: column; gap: 0.6rem; align-items: center; }
      .interlude .big { font-family: "Noto Serif TC", serif; font-size: 1.75rem; font-weight: 500; color: var(--on-dark); }
      .interlude p { color: var(--on-dark-mute); margin: 0; font-size: 0.92rem; }

      /* 畫面轉場 */
      .view-anim { animation: vfade 280ms ease; }
      @keyframes vfade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

      /* 無障礙：螢幕閱讀器專用區 + 程式化焦點 */
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      .q-text:focus, .verdict:focus, .board-title:focus { outline: none; }

      @media (prefers-reduced-motion: reduce) {
        .view-anim, .player-cloud .chip, .board-row, .verdict .v-big, .ans-btn, .v-streak, .streak-chip, .cd-num, .play-glow-a, .play-glow-b,
        .pod .p-block, .shake { animation: none !important; transition: none !important; }
        .timer-fill, .rv-opt .bar { transition: none !important; }
        .timer-fill.low { animation: none !important; }
        .spinner { animation-duration: 2.4s !important; }
        body.flash-good::after, body.flash-bad::after { display: none !important; }
      }

      /* ===== 排行（結束畫面，舞台） ===== */
      .board-title { font-family: "Noto Serif TC", serif; text-align: center; font-size: 1.6rem; color: var(--on-dark); margin: 1.3rem 0 1.1rem; }
      .board-list { display: flex; flex-direction: column; gap: 0.45rem; }
      .board-row {
        display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1rem;
        border-radius: 12px; border: 1px solid var(--hair-dark-soft); background: rgb(255 255 255 / 5%); font-size: 0.95rem; color: var(--on-dark);
        animation: rowin 320ms ease backwards;
      }
      .board-row:nth-child(2) { animation-delay: 40ms; }
      .board-row:nth-child(3) { animation-delay: 80ms; }
      .board-row:nth-child(4) { animation-delay: 120ms; }
      .board-row:nth-child(5) { animation-delay: 160ms; }
      @keyframes rowin { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .board-row .rk { width: 1.8em; color: var(--on-dark-mute); font-weight: 700; font-variant-numeric: tabular-nums; }
      .board-row .rk.m {
        width: 1.7em; height: 1.7em; border-radius: 50%; display: inline-flex;
        align-items: center; justify-content: center; color: #1f1e1b; font-size: 0.82rem; flex-shrink: 0;
      }
      .rk.m1 { background: var(--gold); }
      .rk.m2 { background: rgb(250 249 245 / 55%); }
      .rk.m3 { background: #b08d57; }
      .board-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .board-row .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
      .board-row.me { border-color: rgb(212 37 34 / 55%); background: rgb(212 37 34 / 12%); }

      /* ===== 頒獎台（舞台） ===== */
      .podium { display: flex; align-items: flex-end; justify-content: center; gap: 0.7rem; margin: 2.1rem 0 1.4rem; }
      .pod { width: 33%; max-width: 130px; text-align: center; }
      .pod .p-name { font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--on-dark); }
      .pod .p-score { color: var(--on-dark-mute); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
      .pod .p-block {
        margin-top: 0.5rem; border-radius: 10px 10px 0 0; display: flex; align-items: center; justify-content: center;
        color: #1f1e1b; font-family: "Noto Serif TC", serif; font-weight: 500;
        box-shadow: inset 0 2px 0 rgb(255 255 255 / 25%);
        animation: podup 420ms cubic-bezier(0.22, 0.9, 0.36, 1) backwards;
      }
      @keyframes podup { from { transform: scaleY(0); transform-origin: bottom; } to { transform: scaleY(1); } }
      .pod.p1 .p-block { height: 92px; background: var(--gold); font-size: 1.7rem; animation-delay: 200ms; }
      .pod.p2 .p-block { height: 62px; background: rgb(250 249 245 / 55%); font-size: 1.35rem; animation-delay: 100ms; }
      .pod.p3 .p-block { height: 44px; background: #b08d57; color: #1f1e1b; font-size: 1.1rem; }
      .end-note { text-align: center; color: var(--on-dark-mute); font-size: 0.92rem; margin: auto 0 1rem; }
      .conn { text-align: center; color: var(--on-dark-mute); font-size: 0.78rem; padding: 0.4rem 0 0; }
    </style>
  </head>
  <body>
    <div class="play-wrap">
      <div class="play-glow play-glow-a" aria-hidden="true"></div>
      <div class="play-glow play-glow-b" aria-hidden="true"></div>
      <div class="play-brand"><strong>LSCAGKT</strong> · 問答競技場</div>
      <div class="screen" id="app"></div>
      <div id="srPolite" class="sr-only" aria-live="polite"></div>
      <div id="srAssertive" class="sr-only" role="alert"></div>
      <div class="conn" id="conn"></div>
    </div>

    <script>
      (function () {
        "use strict";
        var $ = function (id) { return document.getElementById("app"); };
        var app = $("app");
        var connEl = document.getElementById("conn");

        var K_PIN = "agkPlayPin", K_ID = "agkPlayId", K_NAME = "agkPlayName";
        function sGet(k) { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } }
        function sSet(k, v) { try { v ? sessionStorage.setItem(k, v) : sessionStorage.removeItem(k); } catch (e) {} }

        var pin = sGet(K_PIN), playerId = sGet(K_ID), myName = sGet(K_NAME);
        var view = pin && playerId ? "game" : "join";
        var serverOffset = 0;
        var answeredIndex = -1;   // 本題已提交（本地即時反饋）
        var chosen = -1;
        var streak = 0;           // 連續答對題數（跨題，本頁工作階段內）
        var bestStreak = 0;
        var pollBusy = false, answerBusy = false, pollTimer = null, tickTimer = null;
        var failCount = 0;

        function setView(html, focusView) {
          app.innerHTML = html;
          if (app.firstElementChild) {
            app.firstElementChild.classList.add("view-anim");
            if (focusView) {
              var h = app.querySelector("[data-view-focus]");
              if (h) { h.setAttribute("tabindex", "-1"); try { h.focus({ preventScroll: true }); } catch (e) { h.focus(); } }
            }
          }
        }

        var srPolite = document.getElementById("srPolite");
        var srAssertive = document.getElementById("srAssertive");
        function announce(text, assertive) {
          var el = assertive ? srAssertive : srPolite;
          if (!el || !text) return;
          el.textContent = "";
          window.setTimeout(function () { el.textContent = text; }, 30);
        }

        function esc(s) {
          return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        var SHAPES = [
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 4 L21 19 H3 Z"></path></svg>',
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 L21 12 L12 21 L3 12 Z"></path></svg>',
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>',
          '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"></rect></svg>'
        ];
        var CLS = ["ans-red", "ans-gold", "ans-plum", "ans-green"];

        function api(path, method, body) {
          return fetch("/api/game/" + path, {
            method: method || "GET",
            headers: { "Content-Type": "application/json" },
            body: body ? JSON.stringify(body) : undefined
          }).then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (d) {
              if (!res.ok) throw new Error(d.error || "請求失敗（" + res.status + "）");
              return d;
            });
          });
        }

        /* ===================== 加入 ===================== */
        function renderJoin(msg, isErr) {
          setView(
            '<div class="join-box">' +
              '<div class="join-mark"><img src="/assets/agk-icon.png" alt="" width="56" height="56" /></div>' +
              '<h1 class="join-title">問答競技場</h1>' +
              '<p class="join-sub">輸入主持人螢幕上的遊戲碼加入</p>' +
              '<p class="field-label" id="pinLabel">遊戲碼</p>' +
              '<div class="pin-cells" id="pinCells" role="group" aria-labelledby="pinLabel">' +
                Array.from({ length: 6 }, function (_, i) {
                  return '<input class="pin-cell" data-i="' + i + '" inputmode="numeric" autocomplete="' + (i === 0 ? "one-time-code" : "off") + '" maxlength="1" aria-label="遊戲碼第 ' + (i + 1) + ' 位，共 6 位" />';
                }).join("") +
              "</div>" +
              '<label class="field-label" for="jName" style="margin-top:0.4rem;">你的名字</label>' +
              '<input class="name-input" id="jName" maxlength="16" placeholder="例如：小明" value="' + esc(myName) + '" />' +
              '<button class="btn primary" id="jGo" style="min-height:3.2rem; font-size:1.05rem;">加入遊戲</button>' +
              '<p class="play-msg ' + (isErr ? "err" : "") + '" id="jMsg" role="alert">' + esc(msg || "") + "</p>" +
            "</div>");
          var cells = Array.prototype.slice.call(app.querySelectorAll(".pin-cell"));
          cells.forEach(function (c, i) {
            c.addEventListener("input", function () {
              c.value = c.value.replace(/\D/g, "").slice(0, 1);
              c.classList.toggle("filled", !!c.value);
              if (c.value && i < 5) cells[i + 1].focus();
              if (cells.every(function (x) { return x.value; })) document.getElementById("jName").focus();
            });
            c.addEventListener("keydown", function (e) {
              if (e.key === "Backspace" && !c.value && i > 0) { cells[i - 1].focus(); cells[i - 1].value = ""; cells[i - 1].classList.remove("filled"); e.preventDefault(); }
              if (e.key === "Enter") doJoin();
            });
            c.addEventListener("paste", function (e) {
              e.preventDefault();
              var digits = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
              digits.split("").forEach(function (d, k) { if (cells[k]) { cells[k].value = d; cells[k].classList.add("filled"); } });
              (cells[Math.min(digits.length, 5)] || cells[5]).focus();
            });
          });
          document.getElementById("jGo").addEventListener("click", doJoin);
          document.getElementById("jName").addEventListener("keydown", function (e) { if (e.key === "Enter") doJoin(); });
          if (!pin) cells[0].focus();
        }

        function pinFromCells() {
          return app.querySelectorAll(".pin-cell") ? Array.prototype.map.call(app.querySelectorAll(".pin-cell"), function (c) { return c.value; }).join("") : "";
        }
        function joinError(msg, target) {
          var msgEl = document.getElementById("jMsg");
          msgEl.textContent = msg; msgEl.className = "play-msg err";
          var el = target === "name" ? document.getElementById("jName") : document.getElementById("pinCells");
          if (el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
        }

        function doJoin() {
          if (answerBusy) return;
          var p = pinFromCells();
          var n = document.getElementById("jName").value.trim();
          if (p.length !== 6) { joinError("請輸入完整 6 位遊戲碼。", "pin"); return; }
          if (!n) { joinError("請輸入名字。", "name"); return; }
          answerBusy = true;
          var goBtn = document.getElementById("jGo");
          if (goBtn) goBtn.disabled = true;
          var msgEl = document.getElementById("jMsg");
          msgEl.textContent = "加入中…"; msgEl.className = "play-msg";
          api("join", "POST", { pin: p, name: n })
            .then(function (d) {
              pin = p; playerId = d.playerId; myName = n;
              sSet(K_PIN, pin); sSet(K_ID, playerId); sSet(K_NAME, myName);
              view = "game";
              renderKey = "";
              renderWait("已加入，等待主持人開始…");
              startPolling();
            })
            .catch(function (err) {
              joinError(err.message || "加入失敗。", /遊戲碼/.test(err.message || "") ? "pin" : "name");
            })
            .finally(function () {
              answerBusy = false;
              if (goBtn) goBtn.disabled = false;
            });
        }

        /* ===================== 大廳／等待 ===================== */
        function leaveGame() {
          stopPolling();
          pin = ""; playerId = ""; myName = "";
          sSet(K_PIN, ""); sSet(K_ID, ""); sSet(K_NAME, "");
          view = "join";
          renderJoin();
        }

        function renderWait(text, players) {
          // 只顯示「其他玩家」，自己以徽章顯示（避免重複）
          var others = (players || []).filter(function (n) { return n !== myName; });
          var cloud = others.length
            ? '<p class="host-sub" style="text-align:center; margin:1.3rem 0 0.5rem; font-size:0.82rem; letter-spacing:0.1em;">房內玩家</p>' +
              '<div class="player-cloud">' + others.map(function (n) { return '<span class="chip">' + esc(n) + "</span>"; }).join("") + "</div>"
            : "";
          var total = players ? players.length : 1;
          app.innerHTML =
            '<div class="lobby-head"><div class="pin">' + esc(pin) + "</div><p>遊戲碼</p></div>" +
            '<div style="align-self:center;"><span class="me-badge">' + esc(myName) + "（你）</span></div>" +
            cloud +
            '<p class="wait-note" style="margin-top:auto;">共 ' + total + " 位玩家 · " + esc(text) + "</p>" +
            '<div class="spinner" style="align-self:center; margin-bottom:0.4rem;"></div>' +
            '<button type="button" class="leave" id="leaveBtn" style="align-self:center;">離開遊戲</button>';
          var lb = document.getElementById("leaveBtn");
          if (lb) lb.addEventListener("click", leaveGame);
        }

        /* ===================== 題目 ===================== */
        function streakHtml() {
          if (streak < 2) return "";
          return '<span class="streak-chip" title="連擊中"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>' + streak + "</span>";
        }

        function renderQuestion(d) {
          if (answeredIndex !== d.index) { answeredIndex = -1; chosen = -1; }
          var answered = answeredIndex === d.index;
          var dots = [];
          for (var di = 0; di < d.total; di++) {
            dots.push('<span class="dot' + (di < d.index ? " done" : di === d.index ? " cur" : "") + '"></span>');
          }
          var opts = d.options.map(function (o, i) {
            var cls = "ans-btn " + (CLS[i] || "ans-plum");
            if (answered && chosen === i) cls += " right";
            return '<button type="button" class="' + cls + '" data-opt="' + i + '"' + (answered ? " disabled" : "") + ">" +
              '<span class="shp">' + SHAPES[i] + '</span><span class="txt">' + esc(o) + "</span></button>";
          }).join("");
          setView(
            '<div class="dots" aria-hidden="true">' + dots.join("") + "</div>" +
            '<div class="q-top"><span class="q-num">第 ' + (d.index + 1) + " / " + d.total + " 題</span>" +
              streakHtml() +
              '<div class="timer-track" aria-hidden="true"><div class="timer-fill" id="tFill"></div></div>' +
              '<span class="t-num" id="tNum"></span></div>' +
            '<h2 class="q-text" data-view-focus tabindex="-1">' + esc(d.q) + "</h2>" +
            '<div class="answers">' + opts + "</div>", true);
          if (!answered) {
            app.querySelectorAll(".ans-btn").forEach(function (b) {
              b.addEventListener("click", function () { submitAnswer(Number(b.dataset.opt), b); });
            });
          }
          startTicker(d);
        }

        function startTicker(d) {
          stopTicker();
          var ends = Date.parse(d.endsAt) - serverOffset;
          var dur = d.timeLimit ? d.timeLimit * 1000 : (d.timeMs || 20000);
          var milestone = null;
          tickTimer = setInterval(function () {
            var fill = document.getElementById("tFill");
            var num = document.getElementById("tNum");
            if (!fill) { stopTicker(); return; }
            var remain = Math.max(0, ends - Date.now());
            var pct = Math.max(0, Math.min(100, remain / dur * 100));
            fill.style.width = pct + "%";
            var secs = Math.ceil(remain / 1000);
            if (num) { num.textContent = secs; num.classList.toggle("low", remain <= 5000); }
            // 僅在關鍵秒數向螢幕閱讀器報時，避免洗版
            if ((secs === 10 || secs === 5) && milestone !== secs) {
              milestone = secs;
              announce(secs + " 秒");
            }
            if (remain <= 5000) fill.classList.add("low");
            if (remain <= 0) stopTicker();
          }, 250);
        }
        function stopTicker() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

        /* ===================== 每題前的 3·2·1 倒數 ===================== */
        function renderCountdown(d, answerMs) {
          stopTicker();
          var dots = [];
          for (var di = 0; di < d.total; di++) {
            dots.push('<span class="dot' + (di < d.index ? " done" : di === d.index ? " cur" : "") + '"></span>');
          }
          setView(
            '<div class="dots" aria-hidden="true">' + dots.join("") + "</div>" +
            '<div class="cd-wrap" data-view-focus tabindex="-1">' +
              '<p class="cd-kicker">第 ' + (d.index + 1) + " / " + d.total + " 題</p>" +
              '<div class="cd-num" id="cdNum" aria-hidden="true">3</div>' +
              '<p class="cd-sub">準備</p>' +
            "</div>", true);
          startCdTicker(d, answerMs);
        }

        function startCdTicker(d, answerMs) {
          stopTicker();
          var answerStart = Date.parse(d.endsAt) - serverOffset - answerMs;
          var shown = null;
          tickTimer = setInterval(function () {
            var el = document.getElementById("cdNum");
            if (!el) { stopTicker(); return; }
            var remain = answerStart - Date.now();
            if (remain <= 0) { cdExpire(d); return; }
            var n = Math.max(1, Math.ceil(remain / 1000));
            if (n !== shown) {
              shown = n;
              el.textContent = n;
              el.classList.remove("cd-pop");
              void el.offsetWidth;
              el.classList.add("cd-pop");
              announce(n + " 秒後開始");
            }
          }, 200);
        }

        function cdExpire(d) {
          stopTicker();
          if (!pollBusy && lastData && lastData.status === "question" && lastData.index === d.index && answeredIndex !== d.index) {
            renderKey = "q:" + d.index + ":a";
            renderQuestion(lastData);
          } else {
            renderKey = "";
            if (!pollBusy) poll();
          }
        }

        function renderSubmitted(chosenText) {
          setView(
            '<div class="submitted"><div class="big">已提交</div>' +
            (chosenText ? '<p>你選了「' + esc(chosenText) + '」</p>' : "") +
            "<p>等待其他玩家作答…</p>" +
            '<div class="spinner"></div></div>');
        }

        function submitAnswer(opt, btn) {
          // 只受作答鎖限制（輪詢不會吃掉點擊）
          if (answerBusy || answeredIndex !== -1 || !lastData) return;
          answerBusy = true;
          chosen = opt;
          answeredIndex = lastData.index;
          // 0.1 秒即時回饋：先在被點的按鈕顯示選中狀態（NN/g 反饋時限），隨後切至已提交畫面
          if (btn) {
            btn.classList.add("picked");
            app.querySelectorAll(".ans-btn").forEach(function (x) {
              x.disabled = true;
              if (x !== btn) x.classList.add("dim");
            });
          }
          window.setTimeout(function () {
            var chosenText = lastData && lastData.options ? lastData.options[opt] : "";
            // 樂觀回饋：即時顯示已選，再送出
            renderKey = "q:" + lastData.index + ":s";
            renderSubmitted(chosenText);
            api("answer", "POST", { pin: pin, player: playerId, index: lastData.index, option: opt })
              .catch(function (err) {
                answeredIndex = -1; chosen = -1;
                renderKey = "";
                connEl.textContent = err.message || "提交失敗";
                if (lastData && lastData.status === "question") renderQuestion(lastData);
              })
              .finally(function () {
                answerBusy = false;
                // 若揭曉已到但剛才被作答鎖擋住，立即補一次輪詢顯示最新結果
                if (lastData && lastData.status === "reveal" && renderKey !== "r:" + lastData.index) poll();
              });
          }, 140);
        }

        /* ===================== 揭曉（判定 + 分佈 + 連擊） ===================== */
        function renderReveal(d) {
          stopTicker();
          var mine = d.my || {};
          var good = mine.answered && mine.correct;
          if (mine.answered && mine.correct) {
            streak++;
            if (streak > bestStreak) bestStreak = streak;
          } else {
            streak = 0;
          }
          var vBig = !mine.answered ? "未作答"
            : good ? "正確！"
            : "錯誤";
          var vCls = good ? "v-good" : "v-bad";
          /* 全螢幕色調閃動：只對已作答的反饋（未作答保持中性） */
          if (mine.answered) {
            document.body.classList.remove("flash-good", "flash-bad");
            void document.body.offsetWidth;
            document.body.classList.add(good ? "flash-good" : "flash-bad");
          }
          var sub = mine.answered && good ? '<span class="v-pts">+' + mine.points + " 分</span>"
            : !mine.answered ? "這題沒有取得分數"
            : "再接再厲";
          var rankLine = "";
          var rankText = "";
          if (mine.rank != null) {
            rankText = "目前第 " + mine.rank + " 名，" + (mine.score != null ? mine.score : 0) + " 分";
            if (mine.aheadName != null) {
              var gap = Math.max(0, (mine.aheadScore || 0) - (mine.score || 0));
              rankLine += '<p class="v-gap">落後 ' + esc(mine.aheadName) + " " + gap + " 分</p>";
              rankText += "，落後" + mine.aheadName + " " + gap + " 分";
            } else {
              rankLine += '<p class="v-gap">你是第一名！</p>';
              rankText += "，你是第一名！";
            }
          }
          var streakLine = streak >= 2
            ? '<div class="v-streak"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>' + streak + " 連擊</div>"
            : "";

          /* 全班作答分佈 + 正確答案 */
          var opts = d.options || [];
          var counts = d.counts || [];
          var max = Math.max.apply(null, counts.concat([1]));
          var rows = opts.map(function (o, i) {
            var c = counts[i] || 0;
            var cls = "rv-opt " + (CLS[i] || "rv-plum").replace("ans-", "rv-");
            if (i === d.correct) cls += " correct";
            if (mine.answered && chosen === i) cls += " mine";
            return '<div class="' + cls + '"><span class="bar"></span><span class="lab">' + esc(o) + '</span><span class="cnt">' + c + "</span></div>";
          }).join("");

          setView(
            '<div class="verdict" data-view-focus tabindex="-1"><div class="v-big ' + vCls + '">' + vBig + "</div>" +
            '<p class="v-sub">' + sub + "</p>" +
            streakLine +
            rankLine +
            '<p class="v-score" style="display:none;"></p></div>' +
            '<p class="rv-q">' + esc(d.q || "") + "</p>" +
            '<div class="rv-opts">' + rows + "</div>", true);
          /* 分佈條動畫：先渲染再展開寬度 */
          window.setTimeout(function () {
            var bars = app.querySelectorAll(".rv-opt .bar");
            opts.forEach(function (_, i) {
              if (bars[i]) bars[i].style.width = Math.round((counts[i] || 0) / max * 100) + "%";
            });
          }, 60);
          announce(vBig + (mine.answered && good ? "得 " + mine.points + " 分。" : "") +
            (streak >= 2 ? streak + " 連擊。" : "") +
            "正確答案是" + (opts[d.correct] || "") + "。" +
            (opts.length ? "作答分佈：" + opts.map(function (o, i) { return o + " " + (counts[i] || 0) + "人"; }).join("，") + "。" : "") +
            rankText, true);
        }

        /* ===================== 題間（排行榜只在主持台顯示） ===================== */
        function renderIntermission() {
          setView(
            '<div class="interlude"><div class="big">下一題即將開始</div>' +
            "<p>請留意主持人螢幕上的排行榜</p>" +
            '<div class="spinner"></div></div>');
        }

        /* ===================== 排行（僅最終畫面使用） ===================== */
        function boardRows(d) {
          return (d.standings || []).map(function (r, i) {
            var rk = i < 3 ? '<span class="rk m m' + (i + 1) + '">' + (i + 1) + "</span>" : '<span class="rk">' + (i + 1) + "</span>";
            var cls = "board-row" + (r.name === myName ? " me" : "");
            return '<div class="' + cls + '">' + rk + '<span class="nm">' + esc(r.name) + '</span><span class="sc">' + r.score + "</span></div>";
          }).join("");
        }

        /* ===================== 頒獎台 ===================== */
        function renderEnded(d) {
          stopPolling();
          var pod = d.podium || [];
          var order = [pod[1], pod[0], pod[2]]; // 2 1 3
          var blocks = order.map(function (p, i) {
            var place = i === 1 ? 1 : i === 0 ? 2 : 3;
            return '<div class="pod p' + place + '"><div class="p-name">' + esc(p ? p.name : "") + "</div>" +
              '<div class="p-score">' + (p ? p.score + " 分" : "") + "</div>" +
              '<div class="p-block">' + place + "</div></div>";
          }).join("");
          setView(
            '<h2 class="board-title" data-view-focus tabindex="-1">遊戲結束</h2>' +
            '<div class="podium">' + blocks + "</div>" +
            '<div class="board-list">' + boardRows(d) + "</div>" +
            '<p class="end-note">感謝參與！</p>' +
            '<button type="button" class="leave" id="againBtn" style="align-self:center;">離開</button>', true);
          var note = app.querySelector(".end-note");
          if (d.my) {
            note.textContent = "你排第 " + d.my.rank + " 名 · " + d.my.score + " 分" +
              (bestStreak >= 2 ? " · 最佳連擊 " + bestStreak : "") + " · 感謝參與！";
          } else if (bestStreak >= 2) {
            note.textContent = "最佳連擊 " + bestStreak + " · 感謝參與！";
          }
          var ab = document.getElementById("againBtn");
          if (ab) ab.addEventListener("click", leaveGame);
        }

        /* ===================== 輪詢 ===================== */
        var lastData = null;
        var renderKey = "";
        var offsetReady = false;

        // 伺服器時鐘校正：RTT/2 修正 + 指數平滑，避免進度條跳動
        function noteOffset(nowIso, t0, t1) {
          if (!nowIso) return;
          var off = Date.parse(nowIso) + Math.max(0, t1 - t0) / 2 - t1;
          serverOffset = offsetReady ? serverOffset * 0.7 + off * 0.3 : off;
          offsetReady = true;
        }

        function startPolling() {
          stopPolling();
          pollTimer = setInterval(poll, 1000);
          poll();
        }
        function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

        function poll() {
          if (pollBusy) return;
          pollBusy = true;
          var t0 = Date.now();
          api("state?pin=" + encodeURIComponent(pin) + "&player=" + encodeURIComponent(playerId))
            .then(function (d) {
              var t1 = Date.now();
              failCount = 0;
              connEl.textContent = "";
              noteOffset(d.now, t0, t1);
              if (d.endsAt && d.startedAt && d.timeMs == null) {
                d.timeMs = Date.parse(d.endsAt) - Date.parse(d.startedAt);
              }
              var prev = lastData;
              lastData = d;
              // 換題或重新進入作答階段時重設本地提交狀態
              if (prev && (d.index !== prev.index || (d.status === "question" && prev.status !== "question"))) {
                answeredIndex = -1;
              }

              if (d.status === "lobby") {
                if (renderKey !== "lobby") announce("等待主持人開始");
                renderKey = "lobby";
                renderWait("等待主持人開始…", d.players);
              } else if (d.status === "question") {
                var submitted = answeredIndex === d.index;
                /* 每題前的倒數緩衝：endsAt−startedAt 多出的部分就是準備時間 */
                var bufferMs = Math.max(0, (d.timeMs || 0) - (d.timeLimit || 20) * 1000);
                var answerMs = Math.max(1000, (d.timeMs || (d.timeLimit || 20) * 1000) - bufferMs);
                var remainMs = Date.parse(d.endsAt) - serverOffset - Date.now();
                var inBuffer = !submitted && bufferMs > 0 && remainMs > answerMs;
                var key = inBuffer ? "cd:" + d.index : "q:" + d.index + ":" + (submitted ? "s" : "a");
                if (renderKey !== key) {
                  renderKey = key;
                  if (inBuffer) {
                    renderCountdown(d, answerMs);
                    announce("第 " + (d.index + 1) + " 題，準備開始", true);
                  } else if (submitted) {
                    renderSubmitted();
                    announce("答案已提交，等待其他玩家");
                  } else {
                    renderQuestion(d);
                    announce("第 " + (d.index + 1) + " 題，共 " + d.total + " 題。題目：" + d.q +
                      "。選項：" + d.options.join("、") + "。" + Math.round(answerMs / 1000) + " 秒作答", true);
                  }
                }
              } else if (d.status === "reveal") {
                /* 作答請求還在途中時先不渲染揭曉，避免誤顯示「未作答」；
                   提交完成後會立即補一次輪詢 */
                if (renderKey !== "r:" + d.index && !answerBusy) {
                  renderKey = "r:" + d.index;
                  renderReveal(d);
                }
              } else if (d.status === "board") {
                if (renderKey !== "b") {
                  renderKey = "b";
                  renderIntermission();
                  announce("本題結束，請留意主持人螢幕上的排行榜");
                }
              } else if (d.status === "ended") {
                if (renderKey !== "e") {
                  renderKey = "e";
                  renderEnded(d);
                  announce(d.my ? "遊戲結束。你最終第 " + d.my.rank + " 名，得 " + d.my.score + " 分" : "遊戲結束", true);
                }
              }
            })
            .catch(function (err) {
              failCount++;
              connEl.textContent = failCount >= 3 ? "連線不穩定，重試中…" : "";
              if (failCount > 12) {
                stopPolling();
                connEl.textContent = "連線中斷，請重新整理頁面。";
              }
            })
            .finally(function () { pollBusy = false; });
        }

        /* ===================== 啟動 ===================== */
        if (view === "game") {
          startPolling();
        } else {
          renderJoin();
        }
      })();
    </script>
  </body>
</html>
